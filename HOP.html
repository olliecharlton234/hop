<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,

	touch-action: none;

<style>
/* HOP — map-first, night-time UI.
   Layout: full-bleed map; chrome is a top search bar, one bottom sheet and a tab bar.
   On wide screens the sheet docks as a left column so the map stays dominant. */
:root {
  --ink: #0d0e11;          /* app chrome */
  --surface: #16181d;      /* sheet */
  --surface-2: #1e2127;    /* controls on the sheet */
  --surface-3: #272b33;
  --line: #2a2e36;
  --line-strong: #3b404b;
  --text: #f3f0ea;         /* warm white, like paper under a streetlight */
  --text-2: #a8a9ae;
  --text-3: #70737b;
  --accent: #ffad1f;       /* sodium-vapour amber: the colour of Sydney streets at night */
  --accent-ink: #1b1204;
  --accent-soft: rgba(255, 173, 31, .14);
  --live: #ff4b3a;
  --going: #48d18a;
  --maybe: #f5c451;
  --blue: #4da3ff;
  --event: #6fd3e3;        /* public events: cool, so they never read as your plans */
  --hot: #ff7b47;          /* popular tonight */

  --map-bg: #0b0d10; --map-water: #0e1923; --map-park: #121c16; --map-road: #20242b; --map-road-major: #2c313a;

  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --nav-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --gutter: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font: 15px/1.4 var(--f-body); overflow: hidden; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
a.btn { text-decoration: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.i { flex: none; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- type ---------- */
.h1 { font: 800 30px/1 var(--f-display); font-stretch: 112%; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.h2 { font: 800 21px/1.1 var(--f-display); font-stretch: 108%; margin: 0; text-wrap: balance; }
.h3 { font: 700 16px/1.2 var(--f-body); margin: 0; }
.label { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--text-3); margin: 0; }
.meta { color: var(--text-2); font-size: 13.5px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; letter-spacing: -.01em; }
.amber { color: var(--accent); }
.dim { color: var(--text-3); }
.sep::before { content: "·"; margin: 0 6px; color: var(--text-3); }

/* ---------- app frame ---------- */
#app { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; background: var(--map-bg); z-index: 0; }
.leaflet-container { background: var(--map-bg); font-family: var(--f-body); }
.leaflet-tile-pane { filter: brightness(.82) contrast(1.12); }
.leaflet-control-attribution { background: rgba(13, 14, 17, .7) !important; color: var(--text-3) !important; font-size: 9px !important; padding: 0 5px !important; }
.leaflet-control-attribution a { color: var(--text-3) !important; }
.leaflet-bottom.leaflet-right { bottom: calc(var(--nav-h) + var(--safe-b) + var(--sheet-h, 120px) - 4px); transition: bottom .25s; }
.no-tiles .leaflet-tile-pane, .no-tiles .leaflet-labels-pane { opacity: 0; }

/* fallback base map */
.f-water { fill: var(--map-water); } .f-park { fill: var(--map-park); }
.f-road { stroke: var(--map-road); } .f-major { stroke: var(--map-road-major); } .f-rail { stroke: var(--line-strong); }
.suburb { font: 700 10px/14px var(--f-display); font-stretch: 125%; letter-spacing: .22em; color: #4a4f5a; text-align: center; white-space: nowrap; }

/* ---------- top bar ---------- */
.top { position: absolute; z-index: 600; top: calc(var(--safe-t) + 10px); left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.top:empty { display: none; }
.searchrow { display: flex; gap: 8px; }
.search { flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.35); min-width: 0; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; font-weight: 500; }
.search input::placeholder { color: var(--text-2); }
.search .i { color: var(--text-2); }
.me-btn { width: 48px; height: 48px; flex: none; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.filters { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; align-self: flex-start; max-width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.filters::-webkit-scrollbar { display: none; }
.filters button { padding: 6px 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--text-2); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.filters button.on { background: var(--surface-3); color: var(--text); }
.filters button svg { width: 13px; height: 13px; }
.floatbar { display: flex; justify-content: space-between; gap: 8px; }
.fbtn { height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: 0 6px 20px rgba(0,0,0,.35); font-weight: 600; font-size: 14px; }
.locate { position: absolute; z-index: 550; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + var(--sheet-h, 120px) + 12px); transition: bottom .25s; }

/* ---------- nav ---------- */
.nav { position: absolute; z-index: 700; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--ink); border-top: 1px solid var(--line); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--text-3); padding: 6px 0; }
.nav button.on { color: var(--text); }
.nav button.on .i { color: var(--accent); }
.nav .create { justify-self: center; width: 52px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; padding: 0; }
.nav .create .i { color: var(--accent-ink) !important; width: 24px; height: 24px; stroke-width: 2.4; }
body.hide-nav .nav { transform: translateY(110%); }
.nav { transition: transform .25s; }

/* ---------- sheet ---------- */
.sheet { position: absolute; z-index: 650; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b)); background: var(--surface); border-top: 1px solid var(--line-strong); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; max-height: calc(100% - var(--nav-h) - var(--safe-b) - var(--safe-t) - 24px); transition: height .28s cubic-bezier(.2,.8,.2,1); }
body.hide-nav .sheet { bottom: 0; }
.sheet[data-size="none"] { display: none; }
.grab { flex: none; height: 20px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.grab span { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--gutter) 18px; min-height: 0; }
.sheet.dragging { transition: none; }

@media (min-width: 900px) {
  .top { left: 16px; right: auto; width: 392px; }
  .sheet { left: 16px; right: auto; width: 392px; bottom: calc(var(--nav-h) + 24px); border: 1px solid var(--line-strong); border-radius: 14px; max-height: calc(100% - var(--nav-h) - 40px - var(--top-h, 0px)); }
  .nav { left: 16px; right: auto; width: 392px; bottom: 16px; border: 1px solid var(--line-strong); border-radius: 14px; height: var(--nav-h); padding: 0; }
  body.hide-nav .sheet { bottom: 16px; }
  .leaflet-bottom.leaflet-right { bottom: 0; }
  .locate { bottom: 24px; right: 16px; }
  .grab { display: none; }
  .sheet-body { padding-top: 14px; }
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-strong); font-weight: 650; font-size: 15px; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.live { background: var(--live); border-color: var(--live); color: #fff; }
.btn.quiet { background: none; }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }
.iconbtn.bare { background: none; border-color: transparent; }
.btnrow { display: flex; gap: 8px; }
.btnrow > .btn { flex: 1; }
.linkbtn { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }

/* segmented control (RSVP, visibility) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border-radius: 7px; font-weight: 650; font-size: 14px; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--surface-3); color: var(--text); }
.seg button.on[data-v="going"] { background: var(--going); color: #04170c; }
.seg button.on[data-v="maybe"] { background: var(--maybe); color: #1d1503; }
.seg button.on[data-v="declined"] { background: var(--surface-3); color: var(--text); }

/* ---------- avatars & photos ---------- */
.av { --s: 32px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: 50%; overflow: hidden; display: inline-grid; place-items: center; background: hsl(var(--h, 30) 28% 30%); color: #fff; font: 700 calc(var(--s) * .36)/1 var(--f-body); vertical-align: middle; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.more { background: var(--surface-3); color: var(--text-2); }
.av i { font-style: normal; }
.stack { display: inline-flex; }
.stack .av { box-shadow: 0 0 0 2px var(--surface); }
.stack .av + .av { margin-left: calc(var(--s) * -.28); }
.ph { position: relative; display: block; overflow: hidden; background: hsl(var(--h, 30) 30% 16%); background-image: radial-gradient(circle at 30% 70%, hsl(var(--h, 30) 70% 45% / .5), transparent 45%), radial-gradient(circle at 75% 25%, hsl(calc(var(--h, 30) + 40) 70% 55% / .35), transparent 40%); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- lists ---------- */
.section { padding-top: 18px; }
.section > .label { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; min-width: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row > .i:last-child { color: var(--text-3); }
.empty { padding: 24px 0; color: var(--text-2); }

/* ---------- map markers ---------- */
/* venue pin: one circle, layered states */
.vpin { position: relative; width: 28px; height: 28px; display: grid; place-items: center; transition: transform .15s; }
.vpin .core { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line-strong); color: var(--text-2); box-shadow: 0 2px 6px rgba(0,0,0,.55); }
.vpin.c-pub .core { color: #e9b86a; } .vpin.c-bar .core { color: #ef9a83; } .vpin.c-club .core { color: #86bdf0; } .vpin.c-food .core { color: #a6d18f; } .vpin.c-gig .core { color: #e9a4cb; } .vpin.c-spot .core { color: #e8e2d4; }
.vpin.hot .core { width: 28px; height: 28px; border: 2px solid var(--hot); box-shadow: 0 0 0 3px rgba(255,123,71,.22), 0 2px 8px rgba(0,0,0,.6); }
.vpin.on { transform: scale(1.22); z-index: 2; }
.vpin.on .core { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.vf { position: absolute; left: 15px; top: -11px; display: flex; align-items: center; }
.vf .av { box-shadow: 0 0 0 2px var(--ink); }
.vf b { margin-left: -4px; font: 700 9.5px/1 var(--f-body); background: var(--ink); color: var(--text); border: 1px solid var(--line-strong); border-radius: 8px; padding: 2px 4px; }
.vev { position: absolute; right: -3px; bottom: -2px; width: 10px; height: 10px; background: var(--event); border: 2px solid var(--ink); transform: rotate(45deg); border-radius: 2px; }
.vph { position: absolute; left: -8px; bottom: -6px; width: 16px; height: 16px; border-radius: 4px; overflow: hidden; border: 1.5px solid var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.6); }
.vph .ph { position: absolute; inset: 0; }
.vlabel { position: absolute; left: 33px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 1px; white-space: nowrap; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 10px #000; }
.vlabel b { font: 650 12px/1.15 var(--f-body); color: var(--text); }
.vlabel em { font: 600 10.5px/1.1 var(--f-body); font-style: normal; color: var(--text-2); }
.vpin.hot .vlabel em { color: #ffb08f; }
.vpin.st .vlabel em { display: block; }
#map.z-labels .vlabel, .vpin.on .vlabel { display: flex; }
#map.z-mid .vpin.plain { display: none; }
#map.z-far .fpin .flabel { display: none; }
#map:not(.z-far) .cl { display: none; }
#map.mode-events .vpin { opacity: .35; }
#map.mode-events .vpin .vf, #map.mode-events .vpin .vph, #map.mode-events .fpin { display: none; }
#map.mode-focus .fpin, #map.mode-focus .cl, #map.mode-pick .fpin, #map.mode-pick .cl { display: none; }
#map.mode-focus .vpin .vf, #map.mode-focus .vpin .vph { display: none; }

/* public event: diamond */
.evpin { position: relative; width: 24px; height: 24px; display: grid; place-items: center; }
.evpin .d { width: 20px; height: 20px; display: grid; place-items: center; background: var(--ink); border: 2px solid var(--event); border-radius: 5px; transform: rotate(45deg); color: var(--event); box-shadow: 0 3px 8px rgba(0,0,0,.6); }
.evpin .d svg { transform: rotate(-45deg); }
.evpin.now .d { background: var(--event); color: #04161a; }
.evpin.on .d { background: var(--event); color: #04161a; transform: rotate(45deg) scale(1.2); }
.elabel { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 1px; white-space: nowrap; pointer-events: none; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 10px #000; }
.elabel b { font: 650 12px/1.15 var(--f-body); }
.elabel em { font: 600 10.5px/1.1 var(--f-mono); font-style: normal; color: var(--event); }
#map.z-elabels .elabel, #map.mode-events .elabel, .evpin.on .elabel { display: flex; }

/* friends' outings: host face, ring = state */
.fpin { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.fpin > .av { box-shadow: 0 0 0 2.5px var(--text), 0 4px 12px rgba(0,0,0,.6); }
.fpin.pub > .av { box-shadow: 0 0 0 2.5px var(--text-2), 0 4px 12px rgba(0,0,0,.6); }
.fpin.live > .av { box-shadow: 0 0 0 2.5px var(--live), 0 4px 12px rgba(0,0,0,.6); }
.fpin.live::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--live); animation: pulse 2s ease-out infinite; }
.fpin .oe { position: absolute; right: -6px; bottom: -5px; width: 19px; height: 19px; display: grid; place-items: center; font-size: 11px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; }
.flabel { position: absolute; left: 42px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; padding: 4px 8px 5px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; white-space: nowrap; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
.flabel b { font: 700 12px/1.1 var(--f-body); }
.flabel em { font: 600 10px/1.1 var(--f-mono); font-style: normal; color: var(--text-2); }
.fpin.live .flabel em { color: #ff8a7d; }
#map.z-mid .flabel { display: none; }

/* suburb clusters when zoomed out */
.cl { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 6px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 9px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.55); cursor: pointer; }
.cl > span:last-child { display: flex; flex-direction: column; gap: 2px; padding-left: 2px; }
.cl.f { border-color: var(--accent); }
.cl b { font: 800 12px/1 var(--f-display); font-stretch: 106%; }
.cl em { font: 600 10px/1 var(--f-body); font-style: normal; color: var(--text-2); }
.cl.f em { color: var(--accent); }
.cl .stack .av { box-shadow: 0 0 0 1.5px var(--ink); }
#map.z-far .fpin { transform: scale(.62); }
#map.mode-events .cl { display: none; }
#map.z-far.mode-events .evpin { display: grid; }

/* photo just taken, floating up */
.pop { position: relative; width: 48px; height: 60px; border-radius: 8px; border: 2px solid var(--text); overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.6); animation: popup 4.2s cubic-bezier(.2,.8,.2,1) forwards; }
.pop .ph { position: absolute; inset: 0; }
.pop .av { position: absolute; left: 3px; bottom: 3px; box-shadow: 0 0 0 1.5px #000; }
@keyframes popup { 0% { transform: translateY(20px) scale(.6); opacity: 0; } 12% { transform: none; opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(77,163,255,.22); }

.spin { position: relative; width: 30px; height: 30px; }
.spin .n { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 900 15px/1 var(--f-display); border: 2px solid var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.55); }
.spin .slabel { position: absolute; left: 36px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 5px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.5); pointer-events: none; }
.spin .slabel b { font: 700 12.5px/1.1 var(--f-body); color: var(--text); }
.spin .slabel em { font: 600 10.5px/1 var(--f-mono); font-style: normal; color: var(--accent); }
.spin.mini { width: 22px; height: 22px; }
.spin.mini .n { border-radius: 7px; font-size: 12px; opacity: .92; }
.spin.mini .slabel { left: 28px; padding: 3px 6px; }
.spin.done .n { background: var(--surface-3); color: var(--text-2); border-color: var(--line-strong); }
.spin.done .slabel { opacity: .6; }
.spin.later .n { background: var(--ink); color: var(--accent); border-color: var(--accent); }
.spin.now .n { background: var(--live); color: #fff; }
.spin.now::before { content: ""; position: absolute; inset: -8px; border-radius: 14px; border: 2px solid var(--live); animation: pulse 1.8s ease-out infinite; }
.spin .tag { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font: 700 9px/1 var(--f-mono); font-style: normal; padding: 2px 4px; border-radius: 3px; background: var(--live); color: #fff; letter-spacing: .06em; }
.spin.next .tag { background: var(--accent); color: var(--accent-ink); }
@keyframes pulse { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.spin.photo { width: 46px; height: 46px; }
.spin.photo .ph { position: absolute; inset: 0; border-radius: 10px; border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(0,0,0,.6); }
.spin.photo .n { inset: auto; left: -7px; top: -7px; width: 20px; height: 20px; font-size: 11px; border-radius: 6px; }
.spin.photo .pc { position: absolute; right: -6px; bottom: -6px; font: 600 10px/1 var(--f-mono); padding: 3px 4px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 4px; }
.spin.photo .slabel { left: 54px; }
.chev { width: 12px; height: 12px; display: grid; place-items: center; }
.chev::before { content: ""; border-left: 7px solid var(--accent); border-top: 5px solid transparent; border-bottom: 5px solid transparent; filter: drop-shadow(0 0 2px #000); }
.chev.done::before { border-left-color: #59606c; }
.r-casing { stroke: #050607; } .r-line { stroke: var(--accent); } .r-done { stroke: #4b515c; }
.opin { position: relative; display: flex; align-items: center; gap: 0; }
.opin .e { width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; background: var(--ink); border: 2px solid var(--accent); border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.6); }
.opin.public .e { border-color: var(--text); }
.opin::after { content: ""; position: absolute; left: 12px; top: 33px; border: 5px solid transparent; border-top-color: var(--accent); }
.opin.public::after { border-top-color: var(--text); }
.opin .t { position: absolute; left: 40px; display: flex; flex-direction: column; padding: 3px 7px 4px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 6px; white-space: nowrap; }
.opin .t b { font: 700 12px/1.2 var(--f-body); } .opin .t em { font: 600 10px/1.1 var(--f-mono); color: var(--accent); font-style: normal; }

/* ---------- home: next-up strip ---------- */
.nextup { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 4px 0 6px; }
.nextup .emo { width: 46px; height: 46px; flex: none; border-radius: 11px; display: grid; place-items: center; font-size: 24px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.nextup .t { font: 800 18px/1.1 var(--f-display); font-stretch: 106%; }
.nextup .s { color: var(--text-2); font-size: 13px; margin-top: 3px; }
.livepill { display: inline-flex; align-items: center; gap: 6px; font: 700 10.5px/1 var(--f-mono); letter-spacing: .08em; color: var(--live); }
.livepill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- venue sheet ---------- */
.vhero { margin: 0 calc(var(--gutter) * -1); height: 150px; position: relative; }
.vhero .ph { position: absolute; inset: 0; }
.vhero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--surface), transparent 55%); }
.vhead { margin-top: -26px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 5px; }
.cat { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; font-weight: 600; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 14px 0; }
.facts > div { background: var(--surface); padding: 9px 11px; }
.facts b { display: block; font-size: 14px; font-weight: 650; }
.facts span { color: var(--text-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.friends-been { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13.5px; margin-bottom: 14px; }
.addto { display: flex; flex-direction: column; gap: 8px; }

/* ---------- outing sheet ---------- */
.ohead { display: flex; gap: 14px; align-items: flex-start; padding-top: 2px; }
.ohead .emo { width: 56px; height: 56px; flex: none; border-radius: 13px; display: grid; place-items: center; font-size: 30px; background: var(--surface-2); border: 1px solid var(--line-strong); overflow: hidden; position: relative; }
.ohead .emo .ph { position: absolute; inset: 0; }
.ohead .when { color: var(--accent); font: 600 13px/1.2 var(--f-mono); margin-top: 6px; }
.ohead .sub { color: var(--text-2); font-size: 13px; margin-top: 4px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 0; text-align: left; }
.who .grow { flex: 1; }
.who b { font-weight: 700; }
.stops { counter-reset: s; border-top: 1px solid var(--line); }
.stop { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; }
.stop .num { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 900 14px/1 var(--f-display); }
.stop .grow { flex: 1; min-width: 0; }
.stop .t { font-weight: 650; }
.stop .s { color: var(--text-2); font-size: 12.5px; }
.stop input[type="time"] { background: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; font: 600 12.5px var(--f-mono); color: var(--accent); width: 116px; }
.stop .handle { touch-action: none; cursor: grab; color: var(--text-3); width: 30px; height: 40px; display: grid; place-items: center; }
.stop.lifted { z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.6); border: 1px solid var(--accent); border-radius: 10px; padding-left: 8px; padding-right: 4px; }
.walk { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; padding: 4px 0 4px 40px; border-bottom: 1px solid var(--line); }
.addstop { display: flex; align-items: center; gap: 12px; padding: 12px 0; width: 100%; color: var(--accent); font-weight: 650; }
.addstop .num { width: 28px; height: 28px; border-radius: 8px; border: 1.5px dashed var(--accent); display: grid; place-items: center; }
.activity { display: flex; flex-direction: column; }
.act { display: flex; gap: 10px; align-items: center; padding: 8px 0; font-size: 14px; }
.act .grow { flex: 1; min-width: 0; }
.act time { color: var(--text-3); font: 500 11.5px var(--f-mono); white-space: nowrap; }
.act .ico { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); flex: none; font-size: 14px; }
.cta { position: sticky; bottom: -18px; margin: 16px calc(var(--gutter) * -1) -18px; padding: 12px var(--gutter) 16px; background: linear-gradient(to top, var(--surface) 75%, transparent); display: flex; gap: 8px; }
.cta .btn { flex: 1; }

/* pick mode banner */
.pickbar { display: flex; align-items: center; gap: 12px; padding: 2px 0 6px; }
.pickbar .grow { flex: 1; min-width: 0; }
.pickchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 6px 0 2px; }
.pickchips span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; font-weight: 600; padding: 4px 8px 4px 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; }
.pickchips span b { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 900 11px var(--f-display); }

/* outings list */
.orow { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.orow .emo { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--surface-2); border: 1px solid var(--line-strong); }
.orow .t { font: 800 17px/1.15 var(--f-display); font-stretch: 105%; }
.orow .when { color: var(--accent); font: 600 12px/1.3 var(--f-mono); margin-top: 3px; }
.orow .s { color: var(--text-2); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orow .grow { min-width: 0; }
.route-mini { width: 54px; height: 40px; }
.route-mini path { stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-dasharray: 2 3; }
.route-mini circle { fill: var(--accent); }
.invite { padding: 14px 0; border-bottom: 1px solid var(--line); }
.invite .from { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-bottom: 10px; }

/* ---------- create form ---------- */
.form { display: flex; flex-direction: column; gap: 18px; padding-top: 4px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.bigname { width: 100%; background: none; border: 0; border-bottom: 2px solid var(--line-strong); padding: 6px 0 10px; font: 800 28px/1.1 var(--f-display); font-stretch: 110%; outline: none; }
.bigname:focus { border-color: var(--accent); }
.bigname::placeholder { color: var(--text-3); }
.emojis { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.emojis button { width: 46px; height: 46px; flex: none; border-radius: 10px; font-size: 22px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; position: relative; }
.emojis button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.emojis .ph { position: absolute; inset: 0; }
.datetime { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
.input { height: 46px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; font-weight: 600; outline: none; width: 100%; min-width: 0; }
.input:focus { border-color: var(--accent); }
.quick { display: flex; gap: 6px; }
.quick button { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 6px 10px; border-radius: 7px; border: 1px solid var(--line); }
.quick button.on { color: var(--text); border-color: var(--text-2); }
.vis { display: grid; gap: 8px; }
.vis button { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--line); }
.vis button.on { border-color: var(--accent); background: var(--accent-soft); }
.vis b { display: block; font-weight: 650; }
.vis span { color: var(--text-2); font-size: 13px; }

/* ---------- live ---------- */
.livebar { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 14px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.livebar .grow { flex: 1; min-width: 0; }
.livebar .t { font: 800 16px/1.1 var(--f-display); font-stretch: 106%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livebar .clock { font: 600 15px var(--f-mono); color: var(--text); }
.nowcard { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; margin-top: 2px; }
.nowcard > div { padding: 11px 12px; min-width: 0; }
.nowcard > div + div { border-left: 1px solid var(--line-strong); background: var(--surface-2); }
.nowcard .label { margin-bottom: 5px; }
.nowcard .v { font: 800 18px/1.1 var(--f-display); font-stretch: 104%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowcard .m { color: var(--text-2); font-size: 12.5px; margin-top: 3px; display: flex; gap: 4px; align-items: center; white-space: nowrap; }
.nowcard .label.red { color: var(--live); }
.shutter-row { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; }
.shutter { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--text); border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--text); display: grid; place-items: center; color: var(--ink); }
.shutter .i { width: 26px; height: 26px; stroke-width: 2; }
.shutter-row .roll { flex: 1; height: 52px; }
.strip { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter); }
.strip .ph { width: 92px; height: 116px; flex: none; border-radius: 6px; }
.strip button { flex: none; position: relative; }
.strip .by { position: absolute; left: 5px; bottom: 5px; }
.strip .newdot { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.demo { margin-top: 22px; padding-top: 12px; border-top: 1px dashed var(--line-strong); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.demo .label { width: 100%; }

/* ---------- full-screen layers ---------- */
.layer { position: absolute; inset: 0; z-index: 800; background: var(--ink); display: flex; flex-direction: column; animation: up .26s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.layer-head { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 12px 10px; border-bottom: 1px solid var(--line); }
.layer-head .grow { flex: 1; min-width: 0; }
.layer-head .t { font: 800 18px/1.1 var(--f-display); font-stretch: 106%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer-head .s { color: var(--text-2); font-size: 12.5px; }
.layer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.tabs { display: flex; gap: 18px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabs button { padding: 11px 0; font-weight: 650; font-size: 14px; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--accent); }
.album-group { padding: 16px 0 0; }
.album-group header { padding: 0 16px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.album-group header b { font: 800 16px/1.2 var(--f-display); font-stretch: 105%; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(5, 1fr); } }
.grid button { aspect-ratio: 1; position: relative; display: block; max-width: 100%; }
.grid .ph { position: absolute; inset: 0; }
.grid .lock { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: rgba(0,0,0,.6); }
.grid .fresh { position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--accent); animation: fade 4s forwards; }
@keyframes fade { 70% { opacity: 1; } to { opacity: 0; } }
.album-cta { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + var(--safe-b)); background: linear-gradient(to top, var(--ink) 70%, transparent); display: flex; gap: 8px; }
.album-cta .btn { flex: 1; }

.viewer { background: #000; }
.viewer .stage { flex: 1; position: relative; overflow: hidden; touch-action: pan-y; }
.viewer .stage .ph { position: absolute; inset: 0; background: #000; }
.viewer .stage .ph img { object-fit: contain; }
.viewer .vmeta { display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid #222; }
.viewer .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; display: grid; place-items: center; color: #fff; opacity: .7; }
.viewer .nav-arrow.l { left: 0; } .viewer .nav-arrow.r { right: 0; }

.compose .preview { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 3px; overflow-y: auto; align-content: start; }
.compose .preview.single { grid-template-columns: 1fr; }
.compose .preview img { width: 100%; display: block; object-fit: cover; aspect-ratio: 3/4; max-height: 60vh; }
.compose .preview.single img { aspect-ratio: auto; object-fit: contain; max-height: 100%; height: 100%; }
.compose .opts { padding: 14px 16px calc(14px + var(--safe-b)); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 550; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* wrap-up */
.wrap .mosaic { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 22vw; gap: 2px; max-height: 46vh; overflow: hidden; }
.wrap .mosaic .ph:first-child { grid-column: span 2; grid-row: span 2; }
@media (min-width: 700px) { .wrap .mosaic { grid-auto-rows: 130px; } }
.wrap .inner { padding: 22px 20px calc(20px + var(--safe-b)); display: flex; flex-direction: column; gap: 14px; }
.wrap .big { font: 900 44px/.95 var(--f-display); font-stretch: 118%; letter-spacing: -.02em; margin: 0; }
.stats { display: flex; gap: 22px; }
.stats div b { display: block; font: 800 26px/1 var(--f-display); font-stretch: 110%; }
.stats div span { color: var(--text-2); font-size: 12.5px; }

/* ---------- modal sheet ---------- */
.scrim { position: absolute; inset: 0; z-index: 900; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.msheet { width: 100%; max-width: 480px; max-height: 88%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 8px var(--gutter) calc(18px + var(--safe-b)); animation: up .25s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 700px) { .scrim { align-items: center; } .msheet { border-radius: 14px; border-bottom: 1px solid var(--line-strong); } }
.msheet .mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0 12px; }
.sharecard { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--ink); }
.sharecard .emo { width: 52px; height: 52px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 26px; flex: none; }
.sharecard .grow { min-width: 0; }
.sharecard .u { color: var(--text-3); font: 500 11.5px var(--f-mono); }
.linkbox { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
.linkbox code { flex: 1; min-width: 0; font: 500 13px var(--f-mono); color: var(--text); background: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: all; }
.apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 6px; }
.apps a, .apps button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); text-decoration: none; font-weight: 600; }
.apps .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font: 800 15px var(--f-display); color: #fff; }
.pickfriend { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.pickfriend .grow { flex: 1; min-width: 0; }
.pickfriend .tick { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--accent-ink); }
.pickfriend.on .tick { background: var(--accent); border-color: var(--accent); }
.pickfriend .st { font-size: 12px; color: var(--text-3); font-weight: 600; }

/* ---------- banners ---------- */
#banners { position: absolute; z-index: 1000; top: calc(var(--safe-t) + 8px); left: 8px; right: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.banner { pointer-events: auto; width: 100%; max-width: 420px; display: flex; align-items: center; gap: 11px; padding: 10px 12px; background: #23262d; border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.55); text-align: left; animation: drop .3s cubic-bezier(.2,.8,.2,1); }
.banner.out { animation: rise .25s forwards; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
@keyframes rise { to { transform: translateY(-30px); opacity: 0; } }
.banner .grow { flex: 1; min-width: 0; }
.banner b { display: block; font-size: 14px; font-weight: 650; }
.banner span { color: var(--text-2); font-size: 12.5px; }
.banner .thumbs { display: flex; gap: 2px; }
.banner .thumbs .ph { width: 32px; height: 40px; border-radius: 4px; }
.banner.toast { max-width: 360px; justify-content: center; padding: 10px 14px; }
#toasts { position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + var(--sheet-h, 120px) + 14px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; transition: bottom .25s; }
body.hide-nav #toasts { bottom: calc(var(--safe-b) + var(--sheet-h, 120px) + 14px); }
@media (min-width: 900px) { #toasts { left: 440px; bottom: 24px; } }
.slabel.hid, .flabel.hid, .elabel.hid, .area.hid, .fchip.hid { visibility: hidden; }
#map.z-far .slabel, #map.z-far .spin.mini, #map.z-far .opin .t { display: none; }

/* ---------- memories ---------- */
.remember { margin: 6px calc(var(--gutter) * -1) 0; position: relative; display: block; width: calc(100% + var(--gutter) * 2); text-align: left; }
.remember .ph { height: 210px; }
.remember .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px var(--gutter) 14px; background: linear-gradient(to top, rgba(0,0,0,.85), transparent); }
.remember .cap .label { color: var(--accent); }
.remember .cap .h1 { margin-top: 6px; }
.remember .cap .meta { margin-top: 4px; color: #d6d4cf; }
.year { font: 900 40px/1 var(--f-display); font-stretch: 120%; color: var(--surface-3); margin: 22px 0 6px; letter-spacing: -.02em; }
.mem { display: block; width: 100%; text-align: left; padding: 10px 0 14px; border-bottom: 1px solid var(--line); }
.mem .film { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 2px; height: 86px; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.mem .film .ph { height: 100%; }
.mem .t { font: 800 18px/1.15 var(--f-display); font-stretch: 106%; display: flex; gap: 8px; align-items: center; }
.mem .s { color: var(--text-2); font-size: 13px; margin-top: 3px; display: flex; flex-wrap: wrap; }
.stopphotos { padding: 12px 0; border-bottom: 1px solid var(--line); }
.stopphotos header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.stopphotos header .grow { flex: 1; min-width: 0; }

/* ---------- profile ---------- */
.prof { display: flex; gap: 14px; align-items: center; padding-top: 6px; }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; margin: 16px 0 4px; }
.pstats div { padding: 10px 12px; }
.pstats div + div { border-left: 1px solid var(--line); }
.pstats b { display: block; font: 800 22px/1 var(--f-display); font-stretch: 110%; }
.pstats span { color: var(--text-3); font-size: 12px; }
.people { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.people > div { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 62px; flex: none; text-align: center; }
.people b { font-size: 12.5px; font-weight: 650; }
.people span { color: var(--text-3); font-size: 11px; }
.row .ph.thumb { width: 48px; height: 48px; border-radius: 8px; flex: none; }
body[data-sheet="full"] .locate, body.hide-nav .locate { display: none; }
.pickfriend, .row, .stop { scroll-margin-bottom: 96px; }

/* ================= v2: Tonight, events, activity, camera ================= */
.fsep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--line-strong); flex: none; }
.filters .wo { color: var(--event); }
.filters .wo svg { width: 13px; height: 13px; }

/* Tonight layer */
.tonhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 0 4px; }
.tonhead .linkbtn { font-size: 13px; color: var(--event); }
.tonrows { display: flex; flex-direction: column; }
.tl { display: flex; align-items: center; gap: 10px; padding: 7px 0; width: 100%; text-align: left; border-bottom: 1px solid var(--line); min-width: 0; }
.tonrows > .tl:last-child { border-bottom: 0; }
.tlmain { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; text-align: left; }
.tl .grow { flex: 1; min-width: 0; }
.tl .t { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .s { color: var(--text-2); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.tl .s .livepill { flex: none; }
.tl > .i:last-child, .tlmain > .i:last-child { color: var(--text-3); }
.lead { position: relative; flex: none; width: 40px; height: 40px; display: grid; place-items: center; }
.lead.emo { border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line-strong); font-size: 21px; }
.lead > .av { box-shadow: 0 0 0 2px var(--text-2); }
.lead.live > .av { box-shadow: 0 0 0 2px var(--live); }
.lead i { position: absolute; right: -4px; bottom: -3px; font-style: normal; font-size: 11px; width: 18px; height: 18px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; }
.tlcam { width: 48px; height: 48px; flex: none; border-radius: 50%; background: var(--text); color: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--surface), 0 0 0 4.5px var(--text); }

/* event rows */
.erow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.erow .grow { flex: 1; min-width: 0; }
.erow .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.erow .s { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.et { flex: none; width: 50px; font: 600 12.5px/1 var(--f-mono); color: var(--event); text-transform: lowercase; }
.et.now { color: var(--live); text-transform: none; letter-spacing: .06em; font-size: 11px; }
.deal { color: var(--accent); font-size: 12px; font-weight: 600; font-style: normal; }
.sheethead { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 0 8px; }
.dayhead { margin: 16px 0 6px; }
.srcnote { font-size: 12px; margin: 14px 0 0; color: var(--text-3); }

/* event sheet */
.evhead { padding-top: 2px; }
.evwhen { color: var(--event); font-family: var(--f-mono); letter-spacing: .04em; font-size: 12px; margin-bottom: 6px; }
.onnow { color: var(--live); }
.evfacts { display: flex; flex-direction: column; margin: 12px 0 14px; border-top: 1px solid var(--line); }
.evfacts > * { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 550; text-align: left; width: 100%; }
.evfacts > * > svg, .evfacts .i { color: var(--event); flex: none; }
.evfacts span { flex: 1; min-width: 0; }
.herenow { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-2); padding: 10px 0; }
.herenow b { color: var(--text); }
.evfacts .herenow { color: var(--text-2); }
.btn3 { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; }
.btn3 .btn { padding: 0 8px; font-size: 14px; }
.evdetail { padding-top: 18px; }
.evhero { position: relative; height: 170px; margin: 0 calc(var(--gutter) * -1); }
.evhero .ph { position: absolute; inset: 0; }
.evblurb { font-size: 15px; line-height: 1.5; margin: 14px 0; color: var(--text); max-width: 60ch; }
.ico { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: var(--surface-2); flex: none; color: var(--text-2); }
.emo-sm { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font-size: 18px; flex: none; }
.row[disabled] { pointer-events: none; }
.evdot { display: inline-block; width: 8px; height: 8px; margin-right: 7px; background: var(--event); transform: rotate(45deg) translateY(-2px); border-radius: 1.5px; }

/* create around an event */
.planprev { border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.pp { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }

.pp .num { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 900 13px var(--f-display); flex: none; }
.pp.ev .num { background: var(--event); color: #04161a; }
.pp .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pp b { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pp span { color: var(--text-2); font-size: 12.5px; }

/* venue sheet */
.vhead2 { display: flex; gap: 12px; align-items: flex-start; padding-top: 2px; }
.vhead2 .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.vthumb { position: relative; width: 72px; height: 72px; flex: none; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-strong); }

.meter { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }

.meter i:nth-child(1) { height: 5px; } .meter i:nth-child(2) { height: 7px; } .meter i:nth-child(3) { height: 9px; } .meter i:nth-child(4) { height: 12px; }
.meter i.on { background: var(--text); }
.busyline.hot .meter i.on { background: var(--hot); }
.vlive { margin-top: 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.vaddr { font-size: 12.5px; margin: 14px 0 0; color: var(--text-3); }
.row .s.hotline { color: #ffb08f; }

/* camera */
.camfab { position: absolute; z-index: 690; right: 14px; bottom: calc(var(--sheet-h, 120px) + 14px); width: 64px; height: 64px; border-radius: 50%; background: var(--text); color: var(--ink); display: grid; place-items: center; box-shadow: 0 0 0 4px var(--ink), 0 0 0 6px var(--text), 0 10px 26px rgba(0,0,0,.6); transition: bottom .25s; }
