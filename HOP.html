    HOP.map.setMode('events', l);
    const pts = near(l);
    if (fit && pts.length) HOP.map.fitTo(pts, { maxZoom: 15.25 });
    document.querySelectorAll('.filters [data-act="evWhen"]').forEach((b) => b.classList.toggle('on', b.dataset.v === when));
    document.querySelectorAll('.filters [data-act="evGroup"]').forEach((b) => b.classList.toggle('on', b.dataset.v === group));
  }
  HOP.actions.whatson = (d) => { if (d.when) when = d.when; group = null; q = ''; HOP.app.go('whatson', {}); };
  HOP.actions.evWhen = (d) => { when = d.v; refresh(); };
  HOP.actions.evGroup = (d) => { group = group === d.v ? null : d.v; refresh(); };
  HOP.actions.closeWhatson = () => HOP.app.back();
  HOP.actions.openEvent = (d) => HOP.app.go('event', { id: d.id }, { replace: HOP.app.route.name === 'event' });

  // ---------------- EVENT SHEET ----------------
  HOP.screens.event = {
    nav: 'home', mapMode: 'events',
    render({ id }) {
      const e = EV.byId(id);
      const p = EV.placeOf(e);
      const fr = friendsOf(e);
      const here = S.friendsAtEvent(id).concat(e.venueId && EV.live(e) ? S.friendsAt(e.venueId) : []);
      const mine = e.friendIds.includes(S.meId);
      const pub = e.publisher;
      const sheet = `
        <div class="evhead" data-drag>
          <p class="label evwhen">${EV.live(e) ? '<span class="onnow">ON NOW</span> ' : ''}${eventWhen(e.startsAt)}${!EV.live(e) && e.startsAt - HOP.now() < 150 * 6e4 && e.startsAt > HOP.now() ? ` · <span class="amber">${HOP.util.startsIn(e.startsAt, e.endsAt)}</span>` : ''}</p>
          <h1 class="h1">${esc(e.title)}</h1>
        </div>
        <div class="evfacts">
          <button data-act="${e.venueId ? 'venue' : 'focusPlace'}" data-id="${e.venueId || e.id}">${I('pin', 16)}<span>${esc(p.name)}, ${esc(p.suburb)}</span></button>
          <div>${EV.svg(e.cat, 16)}<span>${esc(EV.CATS[e.cat].label)}${e.genre && e.genre !== EV.CATS[e.cat].label ? ` · ${esc(e.genre)}` : ''}</span></div>
          <div>${I('ticket', 16)}<span>${esc(e.priceLabel)}${e.deal ? ` <em class="deal">· ${esc(e.deal)}</em>` : ''}</span></div>
          <button data-act="evPeople" data-id="${id}">${I('users', 16)}<span>${e.interested.toLocaleString('en-AU')} interested${fr.length ? ` · ${esc(fr.slice(0, 2).map((u) => u.first).join(', '))}${fr.length > 2 ? ` +${fr.length - 2}` : ''}` : ''}</span>${fr.length ? avatarStack(fr, 4, 22) : ''}</button>
          ${here.length ? `<div class="herenow">${avatarStack(here.map((h) => h.user), 4, 22)}<span>${esc(here[0].user.first)}${here.length > 1 ? ` and ${here.length - 1} more are` : ' is'} there now</span></div>` : ''}
        </div>
        <button class="btn primary block" data-act="eventToOuting" data-id="${id}">${I('plus', 18)} Add to outing</button>
        <div class="btnrow three" style="margin-top:8px">
          <button class="btn" data-act="viewEvent">View</button>
          ${(() => { const sv = S.isSaved({ eventId: id }); return `<button class="btn ${sv ? 'savedbtn' : ''}" data-act="saveTo" data-e="${id}">${sv ? I('check', 17) + ' Saved' : I('bookmark', 17) + ' Save'}</button>`; })()}
          <button class="btn" data-act="shareEvent" data-id="${id}">${I('share', 17)} Share</button>
        </div>
        <button class="addstop" data-act="eventNewOuting" data-id="${id}"><span class="num">${I('plus', 16)}</span> Plan a night around this</button>
        <div class="evdetail" id="evdetail">
          ${e.img ? `<div class="evhero">${photoTag({ id: e.id, u: e.img }, 900, 400)}</div>` : ''}
          ${e.blurb ? `<p class="evblurb">${esc(e.blurb)}</p>` : ''}
          <div class="rows">
            <div class="row"><span class="ico">${I('clock', 18)}</span><div class="grow"><div class="t">${dayDate(e.startsAt)}, ${timeShort(e.startsAt)} – ${timeShort(e.endsAt)}</div><div class="s">${e.recurs === 'weekly' ? `Every ${HOP.util.DAYS_LONG[new Date(e.startsAt).getDay()]}` : 'One night only'}</div></div></div>
            <div class="row"><span class="ico">${pub.type === 'venue' ? I('check', 18) : I('link', 18)}</span><div class="grow"><div class="t">${esc(pub.name)}</div><div class="s">${pub.type === 'venue' ? (pub.verified ? 'Posted by the venue · verified' : 'Posted by the venue') : pub.type === 'community' ? 'Community listing' : 'From an events listing'}</div></div></div>
          </div>
          <div class="section"><button class="btn block ${mine ? 'primary' : ''}" data-act="evInterest" data-id="${id}">${mine ? `${I('check', 18)} You’re interested` : 'I’m interested'}</button></div>
        </div>`;
      return {
        top: `<div class="floatbar"><button class="fbtn" data-act="back" aria-label="Back">${I('back')}</button><button class="fbtn" data-act="shareEvent" data-id="${id}">${I('link', 18)} Send to friends</button></div>`,
        sheet, sizes: ['auto', 'full'],
        map() { HOP.map.showRoute(null); HOP.map.clearOutingPins(); HOP.map.setMode('events', [e]); HOP.map.setSelected(e.id); HOP.map.focus(p, Math.max(HOP.map.leaflet.getZoom(), 15.5)); setTimeout(() => HOP.map.setSelected(e.id), 60); },
      };
    },
  };
  HOP.actions.viewEvent = () => { ui.resizeSheet('full'); setTimeout(() => document.getElementById('evdetail')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300); };
  HOP.actions.focusPlace = (d) => HOP.map.focus(EV.placeOf(EV.byId(d.id)), 16.5);
  HOP.actions.evInterest = (d) => { const on = EV.toggleInterest(d.id); ui.toast(on ? 'Saved. We’ll show you who else is keen.' : 'Removed'); };
  HOP.actions.evPeople = (d) => {
    const e = EV.byId(d.id);
    const fr = friendsOf(e);
    ui.openModal(`<div class="mhead"><h2 class="h2">${e.interested.toLocaleString('en-AU')} interested</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      ${fr.length ? `<p class="label">Friends</p><div class="rows">${fr.map((u) => `<div class="row">${avatar(u, 36)}<div class="grow"><div class="t">${esc(u.name)}</div><div class="s">${esc(u.suburb)}</div></div></div>`).join('')}</div>` : '<p class="meta">None of your friends yet. Send it to the group chat.</p>'}
      <button class="btn primary block" style="margin-top:16px" data-act="shareEvent" data-id="${d.id}">${I('share', 18)} Send to friends</button>`);
  };

  // share an event (complements the group chat, doesn't replace it)
  HOP.actions.shareEvent = (d) => {
    const e = EV.byId(d.id);
    const url = `https://hop.app/e/${e.id.replace('ev_', '')}`;
    const msg = encodeURIComponent(`${e.title} — ${dayDate(e.startsAt)} ${hm(e.startsAt)} at ${EV.placeOf(e).name}. Keen? ${url}`);
    ui.openModal(`<div class="mhead"><h2 class="h2">Send it to friends</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <div class="sharecard"><span class="emo">${HOP.events.svg(e.cat, 22)}</span><div class="grow"><b>${esc(e.title)}</b><div class="meta">${dayDate(e.startsAt)} · ${hm(e.startsAt)} · ${esc(EV.placeOf(e).name)}</div><div class="u">hop.app/e/${esc(e.id.replace('ev_', ''))}</div></div></div>
      <div class="linkbox"><code>${esc(url)}</code><button class="btn primary" data-act="copyText" data-t="${esc(url)}">Copy</button></div>
      <div class="apps">
        <a href="sms:?&body=${msg}"><span class="ic" style="background:#2fbf4f">${I('share', 22)}</span>Messages</a>
        <a href="https://wa.me/?text=${msg}" target="_blank" rel="noopener"><span class="ic" style="background:#1fa855">WA</span>WhatsApp</a>
        <a href="fb-messenger://share/?link=${encodeURIComponent(url)}"><span class="ic" style="background:#2b7cff">M</span>Messenger</a>
        <button data-act="copyText" data-t="${esc(url)}"><span class="ic" style="background:var(--surface-3)">${I('link', 22)}</span>Instagram, more</button>
      </div>
      <div class="btnrow" style="margin-top:10px"><button class="btn" data-act="sendToOuting" data-e="${d.id}">${I('chat', 17)} Send to an outing</button><button class="btn" data-act="eventNewOuting" data-id="${d.id}">Make it a plan</button></div>`);
  };
  HOP.actions.copyText = async (d) => { const ok = await ui.copy(d.t); ui.toast(ok ? 'Link copied' : 'Select the link to copy it'); };

  // ---------------- event → outing ----------------
  HOP.actions.eventToOuting = (d) => {
    const e = EV.byId(d.id);
    const mine = S.state.outings.filter((o) => o.status === 'planning' && S.myAttendance(o.id)?.rsvp === 'going' && (S.isOrganiser(o) || true))
      .sort((a, b) => a.startsAt - b.startsAt);
    ui.openModal(`<div class="mhead"><h2 class="h2">Add to an outing</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <div class="sharecard" style="margin-bottom:8px"><span class="emo">${HOP.events.svg(e.cat, 22)}</span><div class="grow"><b>${esc(e.title)}</b><div class="meta">${dayDate(e.startsAt)} · ${hm(e.startsAt)} · ${esc(EV.placeOf(e).name)}</div></div></div>
      <div class="rows">${mine.map((o) => {
        const ok = HOP.util.sameNight(o.startsAt, e.startsAt);
        const has = S.stopsOf(o.id).some((s) => s.eventId === e.id);
        return `<button class="row" data-act="addEventTo" data-o="${o.id}" data-id="${e.id}" ${ok && !has ? '' : 'disabled'} style="${ok && !has ? '' : 'opacity:.45'}">
          <span class="emo-sm">${HOP.oicon(o)}</span><div class="grow"><div class="t">${esc(o.title)}</div>
          <div class="s">${has ? 'Already on the plan' : ok ? `Adds as a stop at ${timeShort(e.startsAt)} · ${plural(S.stopsOf(o.id).length, 'stop')} so far` : `Different night · ${dayDate(o.startsAt)}`}</div></div>${ok && !has ? I('plus', 18) : ''}</button>`;
      }).join('')}
        <button class="row" data-act="eventNewOuting" data-id="${e.id}"><span class="emo-sm">${I('plus', 18)}</span><div class="grow"><div class="t">New outing around this</div><div class="s">Dinner and drinks around ${timeShort(e.startsAt)}, then invite people</div></div></button>
      </div>`);
  };
  HOP.actions.addEventTo = (d, el) => {
    if (el.disabled) return;
    ui.closeModal();
    const s = S.addEventStop(d.o, d.id);
    const o = S.outing(d.o);
    if (s) ui.toast(`${esc(EV.byId(d.id).title)} is stop ${s.order + 1} of ${esc(o.title)}`);
    HOP.app.go('outing', { id: d.o });
  };
  HOP.actions.eventNewOuting = (d) => { ui.closeModal(); HOP.app.go('create', { event: d.id, fresh: 1 }); };

  // Dinner before, drinks before or after: the shape of a night built around one thing
  HOP.planAround = (e) => {
    const p = EV.placeOf(e);
    const near = (cats, not) => S.venues.filter((v) => cats.includes(v.cat) && v.id !== not && v.id !== e.venueId)
      .map((v) => ({ v, d: HOP.util.metres(p, v) - (HOP.seed.POP[v.id]?.[0] || 0.3) * 300 })).sort((a, b) => a.d - b.d)[0]?.v;
    const h = new Date(e.startsAt).getHours();
    const late = h >= 21 || h < 5;
    const round = (t) => Math.round(t / 18e5) * 18e5;
    const dinner = near(['food']);
    const drinks = near(['bar', 'pub'], dinner?.id);
    const plan = [];
    if (dinner) plan.push({ venueId: dinner.id, at: round(e.startsAt - (late ? 3 : 2) * 36e5), role: 'Dinner' });
    if (late && drinks) plan.push({ venueId: drinks.id, at: round(e.startsAt - 1.5 * 36e5), role: 'Drinks' });
    plan.push({ eventId: e.id, at: e.startsAt, role: EV.CATS[e.cat].label });
    if (!late && drinks && new Date(e.endsAt).getHours() >= 5) plan.push({ venueId: drinks.id, at: round(e.endsAt), role: 'Drinks after' });
    return plan;
  };
})();

</script>
<script>
/* HOP — Create an outing, outing plan view, stops, invites, RSVP, attendees */
(() => {
  const { esc, avatar, avatarStack, photoTag, when, time, timeShort, walkMins, metres, distLabel, plural, longDate } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;

  // ---------------- activity lines (shared with live + memories) ----------------
  HOP.actLine = (a) => {
    const u = S.userById[a.userId];
    const who = a.userId === S.meId ? 'You' : esc(u?.first || 'Someone');
    const v = a.venueId ? esc(S.venueById[a.venueId]?.name) : '';
    const text = {
      joined: `<b>${who}</b> ${a.userId === S.meId ? 'are' : 'is'} going`,
      going: `<b>${who}</b> ${a.userId === S.meId ? 'are' : 'is'} going`,
      maybe: `<b>${who}</b> might come`,
      declined: `<b>${who}</b> can’t make it`,
      invited: `<b>${who}</b> ${a.userId === S.meId ? 'were' : 'was'} invited`,
      stop: `<b>${who}</b> added ${v}`,
      photos: `<b>${who}</b> added ${plural(a.count, 'photo')}`,
      started: `<b>${who}</b> started the night`,
      moved: `Moved on to <b>${v}</b>`,
      ended: `<b>${who}</b> wrapped up the night`,
    }[a.type] || '';
    const lead = ['moved', 'ended'].includes(a.type) ? `<span class="ico">${a.type === 'moved' ? I('walk', 15) : I('flag', 15)}</span>` : avatar(u, 28);
    return `<div class="act">${lead}<div class="grow">${text}</div><time>${HOP.util.ago(a.at)}</time></div>`;
  };

  // ---------------- CREATE ----------------
  let draft = null;
  const EMOJI = ['cake', 'beer', 'cocktail', 'glass', 'disco', 'music', 'bowl', 'food', 'beach', 'party'];
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function nextDow(dow) { const d = new Date(HOP.now()); d.setHours(0, 0, 0, 0); while (d.getDay() !== dow) d.setDate(d.getDate() + 1); return d; }

  function newDraft(params = {}) {
    const src = params.edit ? S.outing(params.edit) : null;
    if (params.event) {
      const e = HOP.events.byId(params.event);
      const plan = HOP.planAround(e);
      const st = new Date(plan[0].at);
      return { edit: null, venue: null, event: e.id, plan, wrap: true, title: e.title.replace(/ — .*/, ''), emoji: HOP.eventIcon(e), cover: null,
        date: ymd(st), time: `${pad(st.getHours())}:${pad(st.getMinutes())}`, visibility: 'private' };
    }
    const d = src ? new Date(src.startsAt) : nextDow(6);
    return {
      edit: src ? src.id : null, venue: params.venue || null,
      title: src ? src.title : '', emoji: src ? HOP.oiconKey(src) : 'cake', cover: src ? src.cover : null,
      date: ymd(d), time: src ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '19:30', visibility: src ? src.visibility : 'private',
    };
  }

  HOP.screens.create = {
    nav: 'create', mapMode: 'default',
    render(params) {
      if (!draft || params.fresh) draft = newDraft(params);
      const placeholder = `${S.me().first}'s Birthday`;
      const v = draft.venue && S.venueById[draft.venue];
      const quick = [['Tonight', ymd(new Date(HOP.now()))], ['Fri', ymd(nextDow(5))], ['Sat', ymd(nextDow(6))]];
      return {
        top: '', sizes: ['full'],
        sheet: `<div class="form">
          <div style="display:flex;align-items:center;justify-content:space-between" data-drag>
            <h1 class="h1">${draft.edit ? 'Edit outing' : 'New outing'}</h1>
            <button class="iconbtn bare" data-act="cancelCreate" aria-label="Cancel">${I('close')}</button></div>
          <div class="field"><label class="label" for="oname">What’s the occasion?</label>
            <input id="oname" class="bigname" maxlength="48" placeholder="${esc(placeholder)}" value="${esc(draft.title)}" autocomplete="off"></div>
          <div class="field"><p class="label">Icon</p><div class="emojis" role="radiogroup">
            ${EMOJI.map((e) => `<button role="radio" data-act="pickEmoji" data-e="${e}" class="${!draft.cover && draft.emoji === e ? 'on' : ''}" aria-label="${e}">${HOP.oicon(e, 22)}</button>`).join('')}
            <button data-act="pickCover" class="${draft.cover ? 'on' : ''}" aria-label="Use a photo">${draft.cover ? photoTag({ id: 'cover', src: draft.cover }, 100) : I('image')}</button></div></div>
          <div class="field"><p class="label">When</p>
            <div class="quick">${quick.map(([l, d]) => `<button data-act="quickDate" data-d="${d}" class="${draft.date === d ? 'on' : ''}">${l}</button>`).join('')}</div>
            <div class="datetime"><input class="input" type="date" id="odate" value="${draft.date}" aria-label="Date"><input class="input" type="time" id="otime" value="${draft.time}" aria-label="Start time"></div></div>
          <div class="field"><p class="label">Who can see it</p><div class="vis">
            <button data-act="pickVis" data-v="private" class="${draft.visibility === 'private' ? 'on' : ''}">${I('lock')}<div><b>Private</b><span>Only people with the link</span></div></button>
            <button data-act="pickVis" data-v="public" class="${draft.visibility === 'public' ? 'on' : ''}">${I('globe')}<div><b>Public</b><span>Shows on the map so anyone nearby can join</span></div></button></div></div>
          ${draft.event ? `<div class="field"><p class="label">The plan</p><div class="planprev">${draft.plan.filter((x) => draft.wrap || x.eventId).map((x, i) => {
              const name = x.eventId ? HOP.events.byId(x.eventId).title : S.venueById[x.venueId].name;
              const where = x.eventId ? HOP.events.placeOf(HOP.events.byId(x.eventId)).name : S.venueById[x.venueId].suburb;
              return `<div class="pp ${x.eventId ? 'ev' : ''}"><span class="num">${i + 1}</span><div class="grow"><b>${esc(name)}</b><span>${esc(x.role)} · ${esc(where)}</span></div><span class="mono amber">${timeShort(x.at)}</span></div>`;
            }).join('')}</div>
            <label class="check"><input type="checkbox" id="wrapIn" ${draft.wrap ? 'checked' : ''}> Add dinner and drinks around it</label></div>` : ''}
          ${v ? `<p class="meta">First stop: <b style="color:var(--text)">${esc(v.name)}</b>, ${esc(v.suburb)}</p>` : ''}
          <div class="cta"><button class="btn primary" data-act="createGo">${draft.edit ? 'Save' : draft.event ? 'Create the plan' : v ? 'Create and add more stops' : 'Next: pick the stops'}</button></div>
        </div>`,
        map() { HOP.map.showRoute(null); HOP.map.clearOutingPins(); },
      };
    },
    mount() {
      const n = document.getElementById('oname'), d = document.getElementById('odate'), t = document.getElementById('otime');
      n.addEventListener('input', () => (draft.title = n.value));
      d.addEventListener('change', () => { draft.date = d.value; document.querySelectorAll('.quick button').forEach((b) => b.classList.toggle('on', b.dataset.d === d.value)); });
      t.addEventListener('change', () => (draft.time = t.value));
      const w = document.getElementById('wrapIn');
      if (w) w.addEventListener('change', () => { draft.wrap = w.checked; HOP.app.render({ keepScroll: true }); });
      if (!draft.edit && !ui.wide()) setTimeout(() => n.focus({ preventScroll: true }), 300);
    },
  };
  HOP.resetDraft = () => (draft = null);

  HOP.actions.pickEmoji = (d) => { draft.emoji = d.e; draft.cover = null; HOP.app.render({ keepScroll: true }); };
  HOP.actions.pickVis = (d) => { draft.visibility = d.v; HOP.app.render({ keepScroll: true }); };
  HOP.actions.quickDate = (d) => { draft.date = d.d; HOP.app.render({ keepScroll: true }); };
  HOP.actions.pickCover = () => {
    const inp = document.getElementById('coverIn');
    inp.onchange = async () => { const f = inp.files[0]; inp.value = ''; if (!f) return; draft.cover = await HOP.photos.shrink(f, 600); HOP.app.render({ keepScroll: true }); };
    inp.click();
  };
  HOP.actions.cancelCreate = () => { draft = null; HOP.app.back(); };
  HOP.actions.createGo = () => {
    const [y, m, dd] = draft.date.split('-').map(Number), [h, mi] = draft.time.split(':').map(Number);
    const startsAt = new Date(y, m - 1, dd, h, mi).getTime();
    const title = draft.title.trim() || `${S.me().first}'s Birthday`;
    if (draft.edit) {
      const o = S.outing(draft.edit);
      const delta = startsAt - o.startsAt;
      S.stopsOf(o.id).forEach((s) => (s.at += delta));
      S.updateOuting(o.id, { title, emoji: draft.emoji, cover: draft.cover, startsAt, visibility: draft.visibility });
      draft = null; HOP.app.back(); ui.toast('Saved'); return;
    }
    if (draft.event) {
      const plan = draft.plan.filter((x) => draft.wrap || x.eventId);
      const delta = startsAt - plan[0].at; // the user may have moved the start time
      const o = S.createOuting({ title, emoji: draft.emoji, cover: draft.cover, startsAt, visibility: draft.visibility });
      plan.forEach((x) => (x.eventId ? S.addEventStop(o.id, x.eventId) : S.addStop(o.id, x.venueId, x.at + delta)));
      draft = null;
      HOP.app.go('outing', { id: o.id }, { replace: true, resetTo: 'outings' });
      ui.toast(plan.length > 1 ? `${plan.map((x) => x.role.split(' ')[0]).join(' → ')}. Swap any stop, then invite people.` : 'Created. Add stops or invite people.');
      return;
    }
    const o = S.createOuting({ title, emoji: draft.emoji, cover: draft.cover, startsAt, visibility: draft.visibility });
    if (draft.venue) S.addStop(o.id, draft.venue);
    draft = null;
    HOP.app.startPicking(o.id, { replace: true });
  };

  // ---------------- picking stops ----------------
  HOP.actions.addStop = (d) => {
    const s = S.addStop(HOP.app.picking, d.venue);
    if (s) ui.toast(`Added ${esc(S.venueById[d.venue].name)} · ${timeShort(s.at)}`);
    HOP.app.go('pick', { id: HOP.app.picking }, { replace: true });
  };
  HOP.actions.addToOuting = (d) => {
    const s = S.addStop(d.outing, d.venue);
    if (s) ui.toast(`Added to ${esc(S.outing(d.outing).title)} as stop ${s.order + 1}`);
    HOP.app.go('outing', { id: d.outing });
  };
  HOP.actions.startHere = (d) => HOP.app.go('create', { venue: d.venue, fresh: 1 });
  HOP.actions.removeStop = (d) => {
    const s = S.state.stops.find((x) => x.id === d.id);
    const name = S.placeOf(s).name;
    S.removeStop(d.id);
    ui.toast(`Removed ${esc(name)}`);
    if (HOP.app.route.name === 'venue') HOP.app.go('pick', { id: HOP.app.picking }, { replace: true });
  };
  HOP.actions.donePicking = () => {
    const id = HOP.app.picking;
    HOP.app.picking = null; HOP.app.searching = false; HOP.clearQuery();
    HOP.app.go('outing', { id }, { resetTo: 'outings' });
  };
  HOP.actions.openOuting = (d) => {
    const o = S.outing(d.id);
    if (o.status === 'live') return HOP.app.go('live', { id: d.id });
    if (o.status === 'ended') return HOP.app.go('memory', { id: d.id });
    HOP.app.go('outing', { id: d.id });
  };

  // ---------------- OUTING (plan view) ----------------
  function stopsList(o, editable) {
    const stops = S.stopsOf(o.id);
    let html = '<div class="stops" id="stops">';
    stops.forEach((s, i) => {
      const p = S.placeOf(s);
      if (i > 0) {
        const prev = S.placeOf(stops[i - 1]);
        html += `<div class="walk">${I('walk', 14)} ${walkMins(prev, p)} min walk · ${distLabel(metres(prev, p) * 1.3)}</div>`;
      }
      const hhmm = `${String(new Date(s.at).getHours()).padStart(2, '0')}:${String(new Date(s.at).getMinutes()).padStart(2, '0')}`;
      html += `<div class="stop" data-stop="${s.id}">
        <span class="num">${i + 1}</span>
        ${s.eventId ? (() => { const e = S.eventOf(s); return `<button class="grow" style="text-align:left" data-act="openEvent" data-id="${e.id}"><div class="t"><i class="evdot"></i>${esc(e.title)}</div><div class="s">${esc(p.name)} · ${esc(e.priceLabel)}</div></button>`; })()
          : `<button class="grow" style="text-align:left" data-act="venueFromStop" data-id="${p.id}"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.suburb)} · ${(() => { const ar = HOP.activity.areaOfVenue(p); if (!ar || o.status !== 'planning') return esc(p.hours || ''); const l = HOP.activity.levelAt(ar.id, s.at); return `<span class="lvw lv${l.lv}">expected ${l.level.toLowerCase()}</span> then`; })()}</div></button>`}
        ${editable ? `<input type="time" value="${hhmm}" data-time="${s.id}" aria-label="Time at ${esc(p.name)}">
          <button class="handle" data-handle="${s.id}" aria-label="Reorder ${esc(p.name)}. Use arrow keys.">${I('grip', 18)}</button>`
          : `<span class="mono amber">${timeShort(s.at)}</span>`}
      </div>`;
    });
    html += '</div>';
    if (editable) html += `<button class="addstop" data-act="addStops" data-id="${o.id}"><span class="num">${I('plus', 16)}</span> Add a stop</button>`;
    return html;
  }

  HOP.screens.outing = {
    nav: 'outings',
    render({ id }) {
      const o = S.outing(id);
      if (!o) return HOP.screens.outings.render();
      const org = S.isOrganiser(o);
      const att = S.attendeesOf(id);
      const going = att.filter((a) => a.rsvp === 'going').map((a) => S.userById[a.userId]);
      const maybe = att.filter((a) => a.rsvp === 'maybe').length;
      const waiting = att.filter((a) => a.rsvp === 'invited').length;
      const stops = S.stopsOf(id);
      const area = stops[0] ? S.placeOf(stops[0]).suburb : 'No stops yet';
      const host = S.userById[o.organiserId];
      const mine = S.myAttendance(id);
      const sheet = `
        <div class="ohead" data-drag>
          <span class="emo">${o.cover ? photoTag({ id: o.id, src: o.cover }, 140) : HOP.oicon(o, 26)}</span>
          <div class="grow" style="min-width:0"><h1 class="h1">${esc(o.title)}</h1>
            <div class="when">${when(o.startsAt)}</div>
            <div class="sub">${esc(area)}<span class="sep"></span>${o.visibility === 'public' ? I('globe', 14) + ' Public' : I('lock', 14) + ' Private'}<span class="sep"></span>${org ? 'You’re hosting' : `Hosted by ${esc(host.first)}`}</div></div>
        </div>
        ${!org ? `<div style="margin-top:14px">${HOP.rsvpSeg(o)}</div>` : ''}
        <button class="who" data-act="attendees" data-id="${id}" style="border-bottom:1px solid var(--line)">
          ${avatarStack(going, 6, 30)}
          <div class="grow"><b>${going.length} ${going.length === 1 ? 'person is' : 'people are'} going</b><div class="meta">${[maybe && `${maybe} maybe`, waiting && `${waiting} haven’t replied`].filter(Boolean).join(' · ') || 'Everyone’s replied'}</div></div>${I('chev')}
        </button>
        <div class="section"><p class="label"><span>The plan</span>${stops.length ? `<span class="mono">${plural(stops.length, 'stop')}</span>` : ''}</p>
          ${stops.length ? stopsList(o, org) : `<p class="empty" style="padding:6px 0 10px">No stops yet.</p>${org ? `<button class="addstop" data-act="addStops" data-id="${id}"><span class="num">${I('plus', 16)}</span> Add a stop</button>` : ''}`}
        </div>
        <div class="section"><p class="label">Album</p><p class="meta" style="margin:0">Photos anyone takes on the night land here, sorted by stop. Starts when the night does.</p></div>
        ${o.activity?.length ? `<div class="section"><p class="label">Updates</p><div class="activity">${o.activity.slice(0, 6).map(HOP.actLine).join('')}</div></div>` : ''}
        ${org ? `<div class="section" style="display:flex;gap:16px"><button class="linkbtn" data-act="editOuting" data-id="${id}">${I('edit', 15)} Edit details</button><button class="linkbtn" style="color:var(--text-3)" data-act="deleteOuting" data-id="${id}">${I('trash', 15)} Delete</button></div>` : ''}
        <div class="cta">
          ${org ? `<button class="btn" data-act="invite" data-id="${id}">${I('share', 18)} Invite</button>
                   <button class="btn primary" data-act="startNight" data-id="${id}" ${stops.length ? '' : 'disabled'}>Start the night</button>`
            : `<button class="btn" data-act="invite" data-id="${id}">${I('share', 18)} Share outing</button>`}
        </div>`;
      return {
        top: `<div class="floatbar"><button class="fbtn" data-act="back" aria-label="Back">${I('back')}</button>
          <button class="fbtn" data-act="invite" data-id="${id}">${I('link', 18)} ${org ? 'Invite' : 'Share'}</button></div>`,
        sheet, sizes: ['half', 'full'],
        map() { HOP.map.setSelected(null); HOP.map.clearOutingPins(); HOP.map.showRoute(id, 'plan'); },
        mapUpdate() { HOP.map.showRoute(id, 'plan', { fit: false }); },
      };
    },
    mount({ id }) { bindStops(id); },
  };

  HOP.actions.venueFromStop = (d) => HOP.app.openVenue(d.id);
  HOP.actions.addStops = (d) => HOP.app.startPicking(d.id);
  HOP.actions.editOuting = (d) => HOP.app.go('create', { edit: d.id, fresh: 1 });
  HOP.actions.deleteOuting = (d) => {
    const o = S.outing(d.id);
    ui.openModal(`<div class="mhead"><h2 class="h2">Delete ${esc(o.title)}?</h2></div>
      <p class="meta" style="margin:0 0 16px">Everyone you invited will lose the plan. This can’t be undone.</p>
      <div class="btnrow"><button class="btn" data-act="closeModal">Keep it</button><button class="btn live" data-act="confirmDelete" data-id="${d.id}">Delete</button></div>`);
  };
  HOP.actions.confirmDelete = (d) => { ui.closeModal(); S.deleteOuting(d.id); HOP.app.go('outings', {}, { resetTo: 'outings' }); ui.toast('Outing deleted'); };
  HOP.actions.rsvp = (d) => {
    S.rsvp(d.id, d.v);
    ui.toast({ going: 'You’re going', maybe: 'Marked as maybe', declined: 'Let them know you can’t make it' }[d.v]);
  };

  // time edits + drag reorder
  function bindStops(id) {
    const wrap = document.getElementById('stops');
    if (!wrap) return;
    const o = S.outing(id);
    wrap.querySelectorAll('input[data-time]').forEach((inp) => inp.addEventListener('change', () => {
      if (!inp.value) return;
      const [h, m] = inp.value.split(':').map(Number);
      const base = new Date(o.startsAt);
      let at = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m).getTime();
      if (at < o.startsAt - 3 * 36e5) at += 864e5; // 1:00 AM belongs to the same night
      S.setStopTime(inp.dataset.time, at);
    }));
    wrap.querySelectorAll('[data-handle]').forEach((h) => {
      h.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
        e.preventDefault();
        const ids = S.stopsOf(id).map((s) => s.id);
        const i = ids.indexOf(h.dataset.handle), j = i + (e.key === 'ArrowUp' ? -1 : 1);
        if (j < 0 || j >= ids.length) return;
        [ids[i], ids[j]] = [ids[j], ids[i]];
        S.reorderStops(id, ids);
        setTimeout(() => document.querySelector(`[data-handle="${ids[j]}"]`)?.focus(), 30);
      });
      h.addEventListener('pointerdown', (e) => startDrag(e, h, wrap, id));
    });
  }
  function startDrag(e, handle, wrap, id) {
    e.preventDefault();
    const row = handle.closest('.stop');
    const rows = [...wrap.querySelectorAll('.stop')];
    wrap.querySelectorAll('.walk').forEach((w) => (w.style.display = 'none'));
    const startY = e.clientY;
    const startTop = row.offsetTop;
    row.classList.add('lifted');
    handle.setPointerCapture(e.pointerId);
    let order = rows.slice();
    const move = (ev) => {
      const dy = ev.clientY - startY;
      row.style.transform = `translateY(${dy}px)`;
      const y = startTop + dy + row.offsetHeight / 2;
      const others = order.filter((r) => r !== row);
      let idx = others.findIndex((r) => y < r.offsetTop + r.offsetHeight / 2 + (r.offsetTop > startTop ? 0 : 0));
      if (idx === -1) idx = others.length;
      const next = [...others.slice(0, idx), row, ...others.slice(idx)];
      if (next.some((r, i) => r !== order[i])) {
        order = next;
        const before = row.offsetTop;
        order.forEach((r) => wrap.appendChild(r));
        const shift = row.offsetTop - before;
        row.style.transform = `translateY(${dy - (row.offsetTop - startTop) + 0}px)`;
        void shift;
        order.forEach((r, i) => { const n = r.querySelector('.num'); if (n) n.textContent = i + 1; });
      }
    };
    const up = () => {
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
      row.classList.remove('lifted'); row.style.transform = '';
      S.reorderStops(id, order.map((r) => r.dataset.stop));
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  }

  // ---------------- attendees ----------------
  HOP.actions.attendees = (d) => {
    const o = S.outing(d.id);
    const att = S.attendeesOf(d.id);
    const groups = [['going', 'Going'], ['maybe', 'Maybe'], ['invited', 'Haven’t replied'], ['declined', 'Can’t go']];
    ui.openModal(`<div class="mhead"><h2 class="h2">Who’s coming</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      ${groups.map(([k, l]) => {
        const list = att.filter((a) => a.rsvp === k);
        if (!list.length) return '';
        return `<div class="section" style="padding-top:8px"><p class="label">${l} · ${list.length}</p><div class="rows">${list.map((a) => {
          const u = S.userById[a.userId];
          return `<div class="row">${avatar(u, 36)}<div class="grow"><div class="t">${esc(u.name)}${a.userId === S.meId ? ' (you)' : ''}</div><div class="s">${a.role === 'organiser' ? 'Organiser' : esc(u.suburb)}</div></div></div>`;
        }).join('')}</div></div>`;
      }).join('')}
      ${S.isOrganiser(o) ? `<button class="btn primary block" style="margin-top:16px" data-act="invite" data-id="${d.id}">${I('plus', 18)} Invite more people</button>` : ''}`);
  };

  // ---------------- invite / share ----------------
  const inviteSel = new Set();
  HOP.inviteUrl = (o) => `https://hop.app/i/${o.inviteCode}`;
  HOP.actions.invite = (d) => {
    inviteSel.clear();
    renderInvite(d.id);
  };
  function friendsByNights() {
    const count = {};
    S.state.outings.filter((o) => o.status === 'ended' && S.myAttendance(o.id)?.rsvp === 'going')
      .forEach((o) => S.going(o.id).forEach((a) => { if (a.userId !== S.meId) count[a.userId] = (count[a.userId] || 0) + 1; }));
    return S.users.filter((u) => u.id !== S.meId).map((u) => ({ u, n: count[u.id] || 0 })).sort((a, b) => b.n - a.n || a.u.name.localeCompare(b.u.name));
  }
  HOP.friendsByNights = friendsByNights;
  function renderInvite(id) {
    const o = S.outing(id);
    const url = HOP.inviteUrl(o);
    const stops = S.stopsOf(id).map((s) => S.stopName(s));
    const msg = `${o.title} — ${when(o.startsAt)}${stops.length ? ` · ${stops[0]}` : ''}. In or out? ${url}`;
    const enc = encodeURIComponent(msg);
    const already = new Set(S.attendeesOf(id).map((a) => a.userId));
    const sheet = ui.openModal(`
      <div class="mhead"><h2 class="h2">Get people in</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <div class="sharecard"><span class="emo">${HOP.oicon(o)}</span><div class="grow"><b>${esc(o.title)}</b><div class="meta">${when(o.startsAt)} · ${S.going(id).length} going</div><div class="u">hop.app/i/${esc(o.inviteCode)}</div></div></div>
      <div class="linkbox"><code id="inviteUrl">${esc(url)}</code><button class="btn primary" data-act="copyInvite" data-id="${id}">Copy</button></div>
      <div class="apps">
        <a href="sms:?&body=${enc}"><span class="ic" style="background:#2fbf4f">${I('share', 22)}</span>Messages</a>
        <a href="https://wa.me/?text=${enc}" target="_blank" rel="noopener"><span class="ic" style="background:#1fa855">WA</span>WhatsApp</a>
        <a href="fb-messenger://share/?link=${encodeURIComponent(url)}"><span class="ic" style="background:#2b7cff">M</span>Messenger</a>
        <button data-act="shareMore" data-id="${id}"><span class="ic" style="background:var(--surface-3)">${I('link', 22)}</span>Instagram, more</button>
      </div>
      <p class="meta" style="margin:4px 0 0">The link opens the plan and lets them reply Going, Maybe or Can’t go. No account needed to look.</p>
      <div class="section"><p class="label"><span>People you go out with</span><button class="linkbtn" data-act="previewInvite" data-id="${id}">See what they see</button></p>
        <div id="friendPick">${friendsByNights().sort((x, y) => already.has(x.u.id) - already.has(y.u.id)).slice(0, 16).map(({ u, n }) => {
          const a = S.attendeesOf(id).find((x) => x.userId === u.id);
          return `<button class="pickfriend ${inviteSel.has(u.id) ? 'on' : ''}" data-act="toggleFriend" data-u="${u.id}" data-id="${id}" ${already.has(u.id) ? 'disabled' : ''}>
            ${avatar(u, 36)}<div class="grow"><div style="font-weight:650">${esc(u.name)}</div><div class="meta" style="font-size:12px">${n ? `${plural(n, 'night')} out together` : esc(u.suburb)}</div></div>
            ${a ? `<span class="st">${{ going: 'Going', maybe: 'Maybe', invited: 'Invited', declined: 'Can’t go' }[a.rsvp]}</span>` : `<span class="tick">${inviteSel.has(u.id) ? I('check', 16) : ''}</span>`}</button>`;
        }).join('')}</div>
      </div>
      <div class="cta" style="margin-bottom:-18px"><button class="btn primary" data-act="sendInvites" data-id="${id}" ${inviteSel.size ? '' : 'disabled'}>${inviteSel.size ? `Invite ${plural(inviteSel.size, 'person', 'people')}` : 'Pick people to invite'}</button></div>`);
    return sheet;
  }
  HOP.actions.toggleFriend = (d, el) => {
    if (el.disabled) return;
    inviteSel.has(d.u) ? inviteSel.delete(d.u) : inviteSel.add(d.u);
    const sc = document.querySelector('.msheet').scrollTop;
    renderInvite(d.id);
    document.querySelector('.msheet').scrollTop = sc;
  };
  HOP.actions.sendInvites = (d) => {
    const ids = [...inviteSel];
    S.invite(d.id, ids);
    ui.closeModal();
    ui.toast(`Invited ${ids.map((i) => S.userById[i].first).slice(0, 3).join(', ')}${ids.length > 3 ? ` +${ids.length - 3}` : ''}`);
  };
  HOP.actions.copyInvite = async (d) => { const ok = await ui.copy(HOP.inviteUrl(S.outing(d.id))); ui.toast(ok ? 'Link copied. Paste it in the group chat.' : 'Select the link to copy it'); };
  HOP.actions.shareMore = async (d) => {
    const o = S.outing(d.id);
    const data = { title: o.title, text: `${o.title} — ${when(o.startsAt)}. In or out?`, url: HOP.inviteUrl(o) };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e.name === 'AbortError') return; } }
    const ok = await ui.copy(data.url);
    ui.toast(ok ? 'Link copied. Paste it into Instagram or anywhere.' : 'Select the link to copy it');
  };

  // What an invited friend sees when they open the link
  HOP.actions.previewInvite = (d) => {
    ui.closeModal();
    const o = S.outing(d.id);
    const stops = S.stopsOf(d.id);
    const host = S.userById[o.organiserId];
    const going = S.going(d.id).map((a) => S.userById[a.userId]);
    const firstStop = stops[0] && S.placeOf(stops[0]);
    const el = ui.openLayer(`
      <div class="layer-head"><button class="iconbtn bare" data-act="closeLayer" aria-label="Close">${I('close')}</button><div class="grow"><div class="t">hop.app/i/${esc(o.inviteCode)}</div><div class="s">Preview of the invite link</div></div></div>
      <div class="layer-body">
        <div style="position:relative;height:180px">${firstStop ? photoTag({ id: firstStop.id, u: firstStop.img }, 900, 360) : ''}<div style="position:absolute;inset:0;background:linear-gradient(to top,var(--ink),transparent 70%)"></div></div>
        <div style="padding:0 16px 30px;margin-top:-40px;position:relative;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;gap:10px;align-items:center">${avatar(host, 34)}<span class="meta"><b style="color:var(--text)">${esc(host.first)}</b> invited you</span></div>
          <h1 class="h1" style="font-size:36px">${esc(o.title)}</h1>
          <div class="when mono amber" style="font-size:14px">${when(o.startsAt)}</div>
          <div style="display:flex;align-items:center;gap:10px">${avatarStack(going, 7, 30)}<span class="meta">${going.length} going</span></div>
          <div class="rows">${stops.map((s, i) => `<div class="row"><span class="stop" style="padding:0;border:0;background:none"><span class="num">${i + 1}</span></span><div class="grow"><div class="t">${esc(S.stopName(s))}</div><div class="s">${esc(S.placeOf(s).suburb)}</div></div><span class="mono amber">${timeShort(s.at)}</span></div>`).join('')}</div>
          <div class="seg"><button data-act="previewTap" data-v="going">Going</button><button data-act="previewTap" data-v="maybe">Maybe</button><button data-act="previewTap" data-v="declined">Can’t go</button></div>
          <p class="meta" style="margin:0;text-align:center">Opens in the app if they have it. Otherwise this page works in any browser.</p>
        </div>
      </div>`);
    return el;
  };
  HOP.actions.previewTap = (d, el) => { el.parentNode.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); el.dataset.v && (el.dataset.v = el.dataset.v); };

  HOP.actions.back = () => HOP.app.back();
})();

</script>
<script>
/* HOP — Live outing mode, camera + uploads, shared album, photo viewer, wrap-up */
(() => {
  const { esc, avatar, avatarStack, photoTag, photoSrc, time, timeShort, walkMins, plural, longDate } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;

  // ---------------- photo helpers ----------------
  HOP.photos = {
    // downscale on device before storing/sending (a real backend would upload the original too)
    shrink(file, max = 1280, q = 0.82) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const im = new Image();
        im.onload = () => {
          const k = Math.min(1, max / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', q));
        };
        im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
        im.src = url;
      });
    },
    async saveToRoll(files) {
      // Phones: the share sheet has "Save image". Desktop: a normal download.
      try {
        if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); return true; }
      } catch (e) { if (e.name === 'AbortError') return false; }
      files.forEach((f, i) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(f); a.download = f.name || `hop-${Date.now()}-${i}.jpg`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      });
      return true;
    },
  };

  const clockFor = (o) => {
    const st = S.stopsOf(o.id)[o.live.current];
    return st.at + (HOP.now() - o.live.arrivedAt);
  };
  HOP.liveClock = clockFor;

  // ---------------- LIVE ----------------
  HOP.screens.live = {
    nav: 'outings',
    render({ id }) {
      const o = S.outing(id);
      if (!o || o.status !== 'live') return HOP.screens.outing.render({ id });
      const org = S.isOrganiser(o);
      const goingMe = S.myAttendance(id)?.rsvp === 'going';
      const stops = S.stopsOf(id);
      const cur = stops[o.live.current], nx = stops[o.live.current + 1];
      const cp = S.placeOf(cur), np = nx && S.placeOf(nx);
      const photos = S.photosOf(id);
      const going = S.going(id).map((a) => S.userById[a.userId]);
      const recent = photos.slice(-14).reverse();
      const sheet = `
        <div class="nowcard" data-drag>
          <div><p class="label red">Now</p><div class="v">${esc(S.stopName(cur))}</div><div class="m">${I('clock', 13)} since ${timeShort(cur.at)}</div></div>
          <div>${np ? `<p class="label">Next stop</p><div class="v">${esc(S.stopName(nx))}</div><div class="m">${timeShort(nx.at)} · ${I('walk', 13)} ${walkMins(cp, np)} min</div>`
            : `<p class="label">Last stop</p><div class="v">Home time</div><div class="m">${o.live.current + 1} of ${stops.length} stops</div>`}</div>
        </div>
        ${!goingMe ? `<div class="shutter-row"><button class="btn roll primary" data-act="joinOuting" data-id="${id}">Join them at ${esc(S.stopName(cur))}</button><button class="btn roll" data-act="back">Not tonight</button></div>` : `<div class="shutter-row">
          <button class="btn roll" data-act="roll" data-id="${id}">${I('image', 18)} Camera roll</button>
          ${org ? (np ? `<button class="btn roll primary" data-act="advance" data-id="${id}">${I('walk', 18)} Go to ${esc(S.stopName(nx).split(' ')[0].replace(/'s$/, '’s'))}</button>`
            : `<button class="btn roll live" data-act="endNight" data-id="${id}">End the night</button>`) : ''}
        </div>`}
        <div class="section"><p class="label"><span>Album · ${plural(photos.length, 'photo')}</span>${photos.length ? `<button class="linkbtn" data-act="album" data-id="${id}">See all</button>` : ''}</p>
          ${photos.length ? `<div class="strip">${recent.map((p) => `<button data-act="viewPhoto" data-id="${id}" data-p="${p.id}">${photoTag(p, 200, 250)}<span class="by">${avatar(S.userById[p.userId], 20)}</span>${HOP.fresh.has(p.id) ? '<span class="newdot"></span>' : ''}</button>`).join('')}</div>`
            : `<p class="meta" style="margin:0">Nothing yet. Photos from everyone on the outing show up here as they’re taken.</p>`}
        </div>
        ${goingMe && HOP.whereNextSection ? HOP.whereNextSection(o) : ''}
        <button class="who" data-act="attendees" data-id="${id}" style="border-bottom:1px solid var(--line);margin-top:10px">${avatarStack(going, 7, 30)}<div class="grow"><b>${going.length} out tonight</b></div>${I('chev')}</button>
        ${S.canChat(o) ? `<div class="section"><p class="label"><span>Latest in the chat</span><button class="linkbtn" data-act="otab" data-t="chat">Open chat</button></p>
          <div class="activity">${S.messagesOf(id).slice(-4).map((m) => `<button class="act" data-act="otab" data-t="chat">${m.userId ? avatar(S.userById[m.userId], 28) : `<span class="ico" style="width:28px;height:28px">${I('check', 14)}</span>`}<div class="grow" style="text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(HOP.chatPreview(m))}</div><time>${HOP.util.ago(m.at)}</time></button>`).join('')}</div></div>` : ''}
        ${org && np ? `<div class="section"><button class="btn block" data-act="endNight" data-id="${id}">${I('flag', 18)} End the night early</button></div>` : ''}
        <div class="demo" ${goingMe ? '' : 'hidden'}><p class="label">Prototype · simulate the group</p>
          <button class="btn sm" data-act="simPhoto" data-id="${id}">A friend posts</button>
          <button class="btn sm" data-act="simBurst" data-id="${id}">Photo rush</button>
          <button class="btn sm" data-act="openAs" data-u="u_jack">Open as Jack</button></div>`;
      return {
        top: `<div class="livebar"><button class="iconbtn bare" data-act="back" aria-label="Back">${I('back')}</button>
          <div class="grow"><span class="livepill">LIVE</span><div class="t">${esc(o.title)}</div></div>
          <span class="clock" data-clock="${id}">${time(clockFor(o))}</span>
          <button class="iconbtn bare" data-act="album" data-id="${id}" aria-label="Album">${I('memories')}</button></div>`,
        sheet, sizes: ['half', 'full'],
        map() {
          HOP.map.setSelected(null); HOP.map.clearOutingPins();
          HOP.map.showRoute(id, 'live', { fit: false });
          HOP.map.fitTo([cp, np || (stops[o.live.current - 1] && S.placeOf(stops[o.live.current - 1]))].filter(Boolean));
        },
        mapUpdate() { HOP.map.showRoute(id, 'live', { fit: false }); },
      };
    },
  };

  HOP.actions.openLive = (d) => HOP.app.go('live', { id: d.id });
  HOP.actions.startNight = (d) => {
    const o = S.outing(d.id);
    ui.openModal(`<div class="mhead"><h2 class="h2">Start ${esc(o.title)}?</h2></div>
      <p class="meta" style="margin:0 0 16px">Everyone going gets a heads-up and the shared album opens. The map switches to tonight’s route.</p>
      <div class="btnrow"><button class="btn" data-act="closeModal">Not yet</button><button class="btn primary" data-act="confirmStart" data-id="${d.id}">Start the night</button></div>`);
  };
  HOP.actions.confirmStart = (d) => { ui.closeModal(); S.startOuting(d.id); HOP.app.go('live', { id: d.id }, { replace: true }); };
  HOP.actions.advance = (d) => {
    S.advance(d.id);
    const o = S.outing(d.id), st = S.stopsOf(d.id), p = S.placeOf(st[o.live.current]);
    ui.toast(`Moving on to ${esc(p.name)}`);
    const nx = st[o.live.current + 1];
    HOP.map.fitTo([p, nx ? S.placeOf(nx) : S.placeOf(st[o.live.current - 1])].filter(Boolean));
  };
  HOP.actions.endNight = (d) => {
    const o = S.outing(d.id);
    ui.openModal(`<div class="mhead"><h2 class="h2">Wrap up ${esc(o.title)}?</h2></div>
      <p class="meta" style="margin:0 0 16px">It moves to Memories with the route, the people and every photo. Anyone can still add the ones on their camera roll.</p>
      <div class="btnrow"><button class="btn" data-act="closeModal">Keep going</button><button class="btn live" data-act="confirmEnd" data-id="${d.id}">End the night</button></div>`);
  };
  HOP.actions.confirmEnd = (d) => { ui.closeModal(); S.endOuting(d.id); showWrap(d.id); };
  HOP.actions.simPhoto = (d) => HOP.sim.friendPost(d.id, { delay: 0 });
  HOP.actions.simBurst = (d) => { HOP.sim.burst(d.id); ui.toast('Five friends start posting…'); };
  HOP.actions.openAs = (d) => {
    const u = location.href.split('#')[0] + '#as=' + d.u;
    const w = window.open(u, '_blank');
    if (!w) ui.toast('Allow pop-ups, or open this page in a second tab');
  };

  // ---------------- capture + upload ----------------
  // ---------------- one-tap camera ----------------
  // In-app viewfinder where the browser allows it; otherwise the phone's own camera via a file input.
  // Every shot is posted straight away: tagged with the outing, the current stop, you and the time.
  let saveRoll = false;
  try { saveRoll = localStorage.getItem('hop.saveRoll') === '1'; } catch (e) {}
  let camVis = 'outing';
  HOP.actions.camera = (d) => {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) openCamera(d.id);
    else nativeCapture(d.id);
  };
  function nativeCapture(outingId) {
    const inp = document.getElementById('camIn');
    inp.onchange = async () => {
      const f = inp.files[0]; inp.value = '';
      if (!f) return;
      const [src, thumb] = await Promise.all([HOP.photos.shrink(f, 1280), HOP.photos.shrink(f, 360, 0.7)]);
      const [p] = S.addPhotos(outingId, [{ src, thumb }], { source: 'camera', visibility: camVis });
      confirmShot(outingId, p);
    };
    inp.click();
  }
  function confirmShot(outingId, p) {
    const o = S.outing(outingId);
    const st = S.state.stops.find((x) => x.id === p.stopId);
    ui.toast(`${p.visibility === 'private' ? 'Saved privately' : `Added to ${esc(o.title)}`} · ${st ? esc(S.stopName(st)) + ' · ' : ''}${time(p.takenAt)}`);
  }
  async function openCamera(outingId) {
    const o = S.outing(outingId);
    let stream = null, facing = 'environment';
    const el = ui.openLayer('', 'camera', () => { if (stream) stream.getTracks().forEach((t) => t.stop()); HOP.app.render({ keepScroll: true }); });
    const ctx = () => {
      const st = S.stopsOf(outingId)[o.live ? o.live.current : 0];
      return `${st ? `at ${esc(S.stopName(st))} · ` : ''}${time(HOP.now())}`;
    };
    const shots = [];
    const draw = () => {
      const last = shots[shots.length - 1];
      el.innerHTML = `<video playsinline autoplay muted></video><div class="flash"></div>
        <div class="camtop"><button class="iconbtn bare" data-act="closeLayer" aria-label="Close camera">${I('close', 24)}</button>
          <div class="camctx"><b>${esc(o.title)}</b><span id="camctx">${ctx()}</span></div>
          <button class="iconbtn bare" data-act="camFlip" aria-label="Switch camera">${I('repeat', 22)}</button></div>
        <div class="camerr" hidden></div>
        <div class="cambottom">
          <div class="seg camvis"><button data-act="camVis" data-v="outing" class="${camVis === 'outing' ? 'on' : ''}">${I('users', 15)} Outing</button><button data-act="camVis" data-v="private" class="${camVis === 'private' ? 'on' : ''}">${I('lock', 15)} Just me</button></div>
          <div class="camrow">
            <button class="lastshot" data-act="${shots.length ? 'camAlbum' : 'camRoll'}" aria-label="${shots.length ? 'See photos' : 'Choose from library'}">${last ? HOP.util.photoTag(last, 120) + `<b>${shots.length}</b>` : I('image', 24)}</button>
            <button class="shutter big" data-act="snap" aria-label="Take photo"></button>
            <label class="saveroll"><input type="checkbox" id="saveRoll" ${saveRoll ? 'checked' : ''}><span>Save to camera roll</span></label>
          </div>
        </div>`;
      const v = el.querySelector('video');
      if (stream) v.srcObject = stream;
      el.querySelector('#saveRoll').onchange = (e) => { saveRoll = e.target.checked; try { localStorage.setItem('hop.saveRoll', saveRoll ? '1' : '0'); } catch (er) {} };
    };
    async function start() {
      try {
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
        const v = el.querySelector('video'); if (v) v.srcObject = stream;
      } catch (e) {
        // No camera or permission refused: hand over to the phone's camera / file picker instead
        ui.closeLayer();
        nativeCapture(outingId);
      }
    }
    draw(); await start();
    const tick = setInterval(() => { const c = el.querySelector('#camctx'); if (!el.isConnected) return clearInterval(tick); if (c) c.innerHTML = ctx(); }, 15000);

    HOP.actions.camFlip = () => { facing = facing === 'environment' ? 'user' : 'environment'; start(); };
    HOP.actions.camVis = (d) => { camVis = d.v; el.querySelectorAll('.camvis button').forEach((b) => b.classList.toggle('on', b.dataset.v === camVis)); };
    HOP.actions.camRoll = () => { ui.closeLayer(); HOP.actions.roll({ id: outingId }); };
    HOP.actions.camAlbum = () => { ui.closeLayer(); HOP.openAlbum(outingId); };
    HOP.actions.snap = async () => {
      const v = el.querySelector('video');
      if (!v || !v.videoWidth) return;
      const k = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
      const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const src = c.toDataURL('image/jpeg', 0.85);
      const t = document.createElement('canvas'); const tk = 360 / Math.max(c.width, c.height); t.width = Math.round(c.width * tk); t.height = Math.round(c.height * tk);
      t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
      const [p] = S.addPhotos(outingId, [{ src, thumb: t.toDataURL('image/jpeg', 0.7) }], { source: 'camera', visibility: camVis });
      shots.push(p);
      const fl = el.querySelector('.flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      const ls = el.querySelector('.lastshot'); ls.dataset.act = 'camAlbum'; ls.innerHTML = HOP.util.photoTag(p, 120) + `<b>${shots.length}</b>`;
      confirmShot(outingId, p);
      if (saveRoll) c.toBlob((b) => b && HOP.photos.saveToRoll([new File([b], `hop-${p.id}.jpg`, { type: 'image/jpeg' })]), 'image/jpeg', 0.9);
    };
  }
  HOP.actions.roll = (d) => pickFiles('rollIn', d.id, 'upload');
  function pickFiles(inputId, outingId, source) {
    const inp = document.getElementById(inputId);
    inp.onchange = () => { const files = [...inp.files]; inp.value = ''; if (files.length) compose(outingId, files, source); };
    inp.click();
  }

  let draft = null;
  function compose(outingId, files, source) {
    const o = S.outing(outingId);
    const st = S.stopsOf(outingId);
    const stop = o.live ? st[o.live.current] : st[st.length - 1];
    draft = { outingId, files, source, visibility: 'outing', save: source === 'camera', stopId: stop?.id, urls: files.map((f) => URL.createObjectURL(f)) };
    const el = ui.openLayer('', 'compose', () => { draft && draft.urls.forEach(URL.revokeObjectURL); draft = null; });
    renderCompose(el);
  }
  function renderCompose(el = ui.topLayer()) {
    const o = S.outing(draft.outingId);
    const stopName = draft.stopId ? S.placeOf(S.state.stops.find((s) => s.id === draft.stopId)).name : '';
    el.innerHTML = `
      <div class="layer-head"><button class="iconbtn bare" data-act="closeLayer" aria-label="Cancel">${I('close')}</button>
        <div class="grow"><div class="t">${draft.files.length > 1 ? plural(draft.files.length, 'photo') : 'New photo'}</div><div class="s">${esc(o.title)}${stopName ? ` · at ${esc(stopName)}` : ''}</div></div></div>
      <div class="preview ${draft.files.length === 1 ? 'single' : ''}">${draft.urls.map((u) => `<img src="${u}" alt="">`).join('')}</div>
      <div class="opts">
        <div class="seg" role="radiogroup" aria-label="Who sees this">
          <button data-act="composeVis" data-v="outing" class="${draft.visibility === 'outing' ? 'on' : ''}">${I('users', 16)} The outing</button>
          <button data-act="composeVis" data-v="private" class="${draft.visibility === 'private' ? 'on' : ''}">${I('lock', 16)} Just me</button>
        </div>
        ${draft.source === 'camera' ? `<label class="check"><input type="checkbox" id="saveRoll" ${draft.save ? 'checked' : ''}> Also save to my camera roll</label>` : ''}
        <button class="btn primary block" data-act="postPhotos">${draft.visibility === 'outing' ? `Add to ${esc(o.title)}` : 'Keep it private'}</button>
      </div>`;
    const cb = el.querySelector('#saveRoll');
    if (cb) cb.onchange = () => (draft.save = cb.checked);
  }
  HOP.actions.composeVis = (d) => { draft.visibility = d.v; renderCompose(); };
  HOP.actions.postPhotos = async (d, btn) => {
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      const items = [];
      for (const f of draft.files) {
        const [src, thumb] = await Promise.all([HOP.photos.shrink(f, 1280), HOP.photos.shrink(f, 360, 0.7)]);
        items.push({ src, thumb });
      }
      const { outingId, visibility, source, stopId, save, files } = draft;
      S.addPhotos(outingId, items, { visibility, source, stopId });
      ui.closeLayer();
      ui.toast(visibility === 'outing' ? `Added to the album · ${plural(items.length, 'photo')}` : 'Saved to your private photos');
      if (save) HOP.photos.saveToRoll(files);
      if (!S.storageOk) ui.toast('Phone storage is full. These photos stay until you close the app.');
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Try again';
      ui.toast(esc(e.message));
    }
  };

  // ---------------- ALBUM ----------------
  let albumTab = 'all';
  HOP.actions.album = (d) => openAlbum(d.id);
  function openAlbum(id) {
    albumTab = 'all';
    const el = ui.openLayer('', 'album', () => (HOP.app.albumOpen = null));
    HOP.app.albumOpen = id;
    renderAlbum(id, el);
  }
  HOP.openAlbum = openAlbum;
  function renderAlbum(id, el) {
    const o = S.outing(id);
    const all = S.photosOf(id);
    const list = albumTab === 'mine' ? all.filter((p) => p.userId === S.meId) : all;
    const stops = S.stopsOf(id);
    const body = el.querySelector('.layer-body');
    const sc = body ? body.scrollTop : 0;
    const contributors = new Set(all.map((p) => p.userId)).size;
    el.innerHTML = `
      <div class="layer-head"><button class="iconbtn bare" data-act="closeLayer" aria-label="Back">${I('back')}</button>
        <div class="grow"><div class="t">${esc(o.title)}</div><div class="s">${plural(all.length, 'photo')} from ${plural(contributors, 'person', 'people')}</div></div></div>
      <div class="tabs"><button data-act="albumTab" data-t="all" data-id="${id}" class="${albumTab === 'all' ? 'on' : ''}">Everyone</button><button data-act="albumTab" data-t="mine" data-id="${id}" class="${albumTab === 'mine' ? 'on' : ''}">Mine</button></div>
      <div class="layer-body" style="padding-bottom:${o.status === 'ended' ? 20 : 90}px">
        ${stops.map((s, i) => {
          const ps = list.filter((p) => p.stopId === s.id);
          if (!ps.length) return '';
          return `<section class="album-group"><header><b>${i + 1}. ${esc(S.stopName(s))}</b><span class="mono dim">${timeShort(s.at)} · ${ps.length}</span></header>
            <div class="grid">${ps.map((p) => `<button data-act="viewPhoto" data-id="${id}" data-p="${p.id}" aria-label="Photo by ${esc(S.userById[p.userId].first)}">${photoTag(p, 300)}${p.visibility === 'private' ? `<span class="lock">${I('lock', 12)}</span>` : ''}${HOP.fresh.has(p.id) ? '<span class="fresh"></span>' : ''}</button>`).join('')}</div></section>`;
        }).join('') || `<p class="empty" style="padding:30px 16px">${albumTab === 'mine' ? 'You haven’t added any photos to this one.' : 'No photos yet.'}</p>`}
      </div>
      <div class="album-cta"><button class="btn" data-act="roll" data-id="${id}">${I('image', 18)} Add from camera roll</button>${o.status === 'live' ? `<button class="btn primary" data-act="camera" data-id="${id}">${I('camera', 18)} Take a photo</button>` : ''}</div>`;
    el.querySelector('.layer-body').scrollTop = sc;
  }
  HOP.renderAlbum = renderAlbum;
  HOP.actions.albumTab = (d) => { albumTab = d.t; renderAlbum(d.id, ui.topLayer()); };

  // ---------------- VIEWER ----------------
  HOP.actions.viewPhoto = (d) => {
    const list = d.vp ? S.venuePhotos(d.vp) : S.photosOf(d.id).filter((p) => albumTab !== 'mine' || p.userId === S.meId || !HOP.app.albumOpen);
    let i = Math.max(0, list.findIndex((p) => p.id === d.p));
    const el = ui.openLayer('', 'viewer', () => document.removeEventListener('keydown', key));
    const draw = () => {
      const p = list[i];
      const u = S.userById[p.userId];
      const st = d.vp ? { venueId: d.vp } : S.state.stops.find((s) => s.id === p.stopId);
      el.innerHTML = `
        <div class="layer-head" style="border-color:#222"><button class="iconbtn bare" data-act="closeLayer" aria-label="Close">${I('close')}</button>
          <div class="grow"><div class="t" style="font-size:15px">${i + 1} of ${list.length}</div><div class="s">${st ? esc(d.vp ? S.venueById[d.vp].name : S.placeOf(st).name) : ''} · ${d.vp ? HOP.util.ago(p.takenAt) : time(p.takenAt)}</div></div>
          <button class="iconbtn bare" data-act="savePhoto" data-p="${p.id}" aria-label="Save">${I('download')}</button></div>
        <div class="stage">${photoTag(p, 1400, 1800)}
          ${i > 0 ? `<button class="nav-arrow l" data-act="vPrev" aria-label="Previous">${I('back', 28)}</button>` : ''}
          ${i < list.length - 1 ? `<button class="nav-arrow r" data-act="vNext" aria-label="Next">${I('chev', 28)}</button>` : ''}</div>
        ${!u ? `<div class="vmeta"><div class="grow"><b>Shared publicly</b><div class="meta" style="font-size:12.5px">Posted at ${esc(S.venueById[p.venueId]?.name || '')} · ${HOP.util.ago(p.takenAt)}${p.demo ? ' · demo data' : ''}</div></div></div>` : `<div class="vmeta">${avatar(u, 34)}<div class="grow"><b>${p.userId === S.meId ? 'You' : esc(u.name)}</b><div class="meta" style="font-size:12.5px">${p.source === 'camera' ? 'Taken in HOP' : 'From camera roll'} · ${HOP.util.dayDate(p.takenAt)}</div></div>
          ${p.userId === S.meId ? `<button class="btn sm" data-act="photoVis" data-p="${p.id}">${p.visibility === 'private' ? `${I('lock', 15)} Just me` : `${I('users', 15)} Shared`}</button>` : ''}</div>`}`;
      const stage = el.querySelector('.stage');
      let x0 = null;
      stage.addEventListener('pointerdown', (e) => (x0 = e.clientX));
      stage.addEventListener('pointerup', (e) => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (dx < -50 && i < list.length - 1) { i++; draw(); } else if (dx > 50 && i > 0) { i--; draw(); } });
    };
    const key = (e) => { if (e.key === 'ArrowRight' && i < list.length - 1) { i++; draw(); } if (e.key === 'ArrowLeft' && i > 0) { i--; draw(); } };
    document.addEventListener('keydown', key);
    HOP.actions.vPrev = () => { i--; draw(); };
    HOP.actions.vNext = () => { i++; draw(); };
    HOP.actions.photoVis = (dd) => { const p = list[i]; S.setPhotoVisibility(p.id, p.visibility === 'private' ? 'outing' : 'private'); draw(); ui.toast(p.visibility === 'private' ? 'Only you can see this one' : 'Shared with the outing'); };
    draw();
  };
  HOP.actions.savePhoto = async (d) => {
    const p = S.state.photos.find((x) => x.id === d.p) || (S.state.venuePhotos || []).find((x) => x.id === d.p);
    try {
      const res = await fetch(photoSrc(p, 2000, 2000));
      const blob = await res.blob();
      await HOP.photos.saveToRoll([new File([blob], `hop-${p.id}.jpg`, { type: blob.type || 'image/jpeg' })]);
    } catch (e) { window.open(photoSrc(p, 2000, 2000), '_blank'); }
  };

  // ---------------- WRAP-UP ----------------
  function showWrap(id) {
    const o = S.outing(id);
    const photos = S.photosOf(id);
    const pick = photos.length > 6 ? Array.from({ length: 6 }, (_, k) => photos[Math.floor((k * photos.length) / 6)]) : photos;
    HOP.app.go('memory', { id }, { resetTo: 'memories', silent: true });
    ui.openLayer(`
      <div class="layer-head"><button class="iconbtn bare" data-act="closeLayer" aria-label="Close">${I('close')}</button><div class="grow"><div class="t">${esc(o.title)}</div><div class="s">${longDate(o.startsAt)}</div></div></div>
      <div class="layer-body">
        ${pick.length ? `<div class="mosaic">${pick.map((p) => photoTag(p, 500)).join('')}</div>` : ''}
        <div class="inner">
          <h1 class="big">That’s a wrap.</h1>
          <div class="stats"><div><b>${photos.length}</b><span>photos</span></div><div><b>${S.going(id).length}</b><span>people</span></div><div><b>${S.stopsOf(id).length}</b><span>stops</span></div></div>
          <p class="meta" style="margin:0">Saved to Memories. Everyone who came can open it, and add the photos still sitting on their phones.</p>
          <button class="btn primary block" data-act="closeLayer">Open the memory</button>
          <button class="btn block" data-act="planNext" data-id="${id}">${I('repeat', 18)} Plan the next one</button>
        </div>
      </div>`, 'wrap');
  }
  HOP.actions.planNext = () => { ui.closeAllLayers(); HOP.app.go('create', { fresh: 1 }); };
})();

</script>
<script>
/* HOP — Memories, a single memory, Profile */
(() => {
  const { esc, avatar, avatarStack, photoTag, timeShort, plural, longDate, ago } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;

  const statLine = (o) => {
    const p = S.photosOf(o.id).length, n = S.going(o.id).length, st = S.stopsOf(o.id).length;
    return [plural(p, 'photo'), plural(n, 'person', 'people'), st > 1 ? plural(st, 'stop') : null].filter(Boolean);
  };
  // spread picks across the night so the strip shows the whole story
  const spread = (list, n) => (list.length <= n ? list : Array.from({ length: n }, (_, k) => list[Math.floor(((k + 0.5) * list.length) / n)]));

  function memRow(o) {
    const film = spread(S.photosOf(o.id), 4);
    return `<button class="mem" data-act="openOuting" data-id="${o.id}">
      ${film.length ? `<div class="film">${film.map((p, i) => photoTag(p, i ? 200 : 400, 200)).join('')}</div>` : ''}
      <div class="t"><span>${HOP.oicon(o)}</span>${esc(o.title)}</div>
      <div class="s"><span>${longDate(o.startsAt)}</span></div>
      ${S.stopsOf(o.id).length > 1 ? `<div class="recap">${esc(S.stopsOf(o.id).map((s) => S.stopName(s)).join(' → '))}</div>` : ''}
      <div class="s">${statLine(o).join(' · ')}</div></button>`;
  }
  function byYear(list) {
    const years = {};
    list.forEach((o) => (years[new Date(o.startsAt).getFullYear()] ||= []).push(o));
    return Object.keys(years).sort((a, b) => b - a).map((y) => `<div class="year">${y}</div>${years[y].map(memRow).join('')}`).join('');
  }

  HOP.screens.memories = {
    nav: 'memories',
    render() {
      const { memories } = S.myOutings();
      const hero = memories.find((o) => HOP.now() - (o.endedAt || o.startsAt) > 2 * 864e5);
      const heroPhotos = hero ? S.photosOf(hero.id) : [];
      const best = heroPhotos[Math.floor(heroPhotos.length * 0.6)];
      return {
        top: '', sizes: ['full'],
        sheet: `<div data-drag style="padding-top:4px"><h1 class="h1">Memories</h1></div>
          ${hero ? `<button class="remember" data-act="openOuting" data-id="${hero.id}">
            ${best ? photoTag(best, 900, 420) : ''}
            <div class="cap"><p class="label">${ago(hero.startsAt)}</p><div class="h1">Remember ${esc(hero.title)}?</div><div class="meta">${longDate(hero.startsAt)} · ${statLine(hero).join(' · ')}</div></div></button>` : ''}
          ${memories.length ? byYear(memories) : `<p class="empty">When a night ends it lands here: the route, the people and every photo.</p>`}`,
        map() {
          HOP.map.setSelected(null); HOP.map.clearOutingPins();
          if (hero) HOP.map.showRoute(hero.id, 'memory');
        },
      };
    },
  };
  HOP.memRow = memRow;
  HOP.byYear = byYear;

  HOP.screens.memory = {
    nav: 'memories',
    render({ id }) {
      const o = S.outing(id);
      if (!o) return HOP.screens.memories.render();
      const stops = S.stopsOf(id);
      const people = S.going(id).map((a) => S.userById[a.userId]);
      const others = people.filter((u) => u.id !== S.meId);
      const photos = S.photosOf(id);
      const sheet = `
        <div data-drag>
          <p class="label">${ago(o.startsAt)}</p>
          <h1 class="h1" style="margin-top:6px">${esc(o.title)}</h1>
          <div class="meta" style="margin-top:6px">${longDate(o.startsAt)} · with ${esc(others.slice(0, 2).map((u) => u.first).join(', '))}${others.length > 2 ? ` and ${others.length - 2} others` : ''}</div>
          ${stops.length > 1 ? `<p class="recap big">${esc(stops.map((s) => S.stopName(s)).join(' → '))}</p>` : ''}
        </div>
        <div class="pstats"><div><b>${photos.length}</b><span>photos</span></div><div><b>${people.length}</b><span>people</span></div><div><b>${stops.length}</b><span>${stops.length === 1 ? 'stop' : 'stops'}</span></div>${S.messagesOf(id).filter((m) => m.kind !== 'system').length ? `<div><b>${S.messagesOf(id).filter((m) => m.kind !== 'system').length}</b><span>messages</span></div>` : ''}</div>
        <button class="who" data-act="attendees" data-id="${id}" style="border-bottom:1px solid var(--line)">${avatarStack(people, 8, 30)}<div class="grow"></div>${I('chev')}</button>
        <div class="section"><p class="label"><span>The night</span>${photos.length ? `<button class="linkbtn" data-act="album" data-id="${id}">All ${photos.length} photos</button>` : ''}</p>
          ${stops.map((s, i) => {
            const ps = S.photosOf(id, s.id);
            const p = S.placeOf(s);
            return `<div class="stopphotos"><header><span class="stop" style="padding:0;border:0;background:none"><span class="num">${i + 1}</span></span>
              <div class="grow"><b>${esc(S.stopName(s))}</b><div class="meta" style="font-size:12.5px">${esc(p.suburb)} · ${timeShort(s.at)}</div></div><span class="mono dim">${ps.length}</span></header>
              ${ps.length ? `<div class="strip">${spread(ps, 10).map((ph) => `<button data-act="viewPhoto" data-id="${id}" data-p="${ph.id}">${photoTag(ph, 200, 250)}</button>`).join('')}</div>` : ''}</div>`;
          }).join('')}
        </div>
        <div class="cta">
          <button class="btn" data-act="roll" data-id="${id}">${I('image', 18)} Add photos</button>
          <button class="btn primary" data-act="planAgain" data-id="${id}">${I('repeat', 18)} Do it again</button>
        </div>`;
      return {
        top: `<div class="floatbar"><button class="fbtn" data-act="back" aria-label="Back">${I('back')}</button>${photos.length ? `<button class="fbtn" data-act="album" data-id="${id}">${I('memories', 18)} Album</button>` : ''}</div>`,
        sheet, sizes: ['half', 'full'],
        map() { HOP.map.setSelected(null); HOP.map.clearOutingPins(); HOP.map.showRoute(id, 'memory'); },
        mapUpdate() { HOP.map.showRoute(id, 'memory', { fit: false }); },
      };
    },
  };
  HOP.actions.planAgain = (d) => {
    const src = S.outing(d.id);
    const sat = new Date(HOP.now()); sat.setHours(new Date(src.startsAt).getHours(), new Date(src.startsAt).getMinutes(), 0, 0);
    while (sat.getDay() !== new Date(src.startsAt).getDay() || sat.getTime() < HOP.now()) sat.setDate(sat.getDate() + 1);
    const o = S.duplicate(d.id, sat.getTime());
    S.updateOuting(o.id, { title: src.title.includes('again') ? src.title : `${src.title} again` });
    HOP.app.go('outing', { id: o.id }, { resetTo: 'outings' });
    ui.toast('Same route, new date. Change anything you like.');
  };

  // ---------------- PROFILE ----------------
  HOP.screens.profile = {
    nav: 'profile', mapMode: 'default',
    render() {
      const me = S.me();
      const { memories } = S.myOutings();
      const year = new Date(HOP.now()).getFullYear();
      const thisYear = memories.filter((o) => new Date(o.startsAt).getFullYear() === year);
      const photoCount = thisYear.reduce((n, o) => n + S.photosOf(o.id).length, 0);
      const people = new Set(); thisYear.forEach((o) => S.going(o.id).forEach((a) => a.userId !== S.meId && people.add(a.userId)));
      const friends = HOP.friendsByNights().filter((f) => f.n > 0).slice(0, 10);
      return {
        top: '', sizes: ['full'],
        sheet: `
          <div class="prof" data-drag>${avatar(me, 64)}<div class="grow"><h1 class="h1">${esc(me.name)}</h1><div class="meta" style="margin-top:4px">@${esc(me.handle)} · ${esc(me.suburb)}</div></div></div>
          <div class="pstats"><div><b>${thisYear.length}</b><span>nights in ${year}</span></div><div><b>${photoCount}</b><span>photos</span></div><div><b>${people.size}</b><span>people</span></div></div>
          ${friends.length ? `<div class="section"><p class="label">Who you go out with</p><div class="people">${friends.map(({ u, n }) => `<div>${avatar(u, 52)}<b>${esc(u.first)}</b><span>${plural(n, 'night')}</span></div>`).join('')}</div></div>` : ''}
          <div class="section"><p class="label">Your outings</p>${memories.length ? byYear(memories) : '<p class="empty">Nothing yet.</p>'}</div>
          <div class="demo"><p class="label">Prototype</p>
            <div style="width:100%"><p class="meta" style="margin:0 0 8px">Viewing as. Open a second tab as someone else to watch photos arrive live.</p>
            <div class="seg">${['u_ollie', 'u_jack', 'u_sarah'].map((id) => `<button data-act="viewAs" data-u="${id}" class="${S.meId === id ? 'on' : ''}">${esc(S.userById[id].first)}</button>`).join('')}</div></div>
            <button class="btn sm" data-act="openAs" data-u="u_jack">Open Jack in a new tab</button>
            <button class="btn sm" data-act="clearBirthday">Remove Ollie’s Birthday (to create it fresh)</button>
            <button class="btn sm" data-act="resetDemo">Reset demo data</button>
            <div style="width:100%"><p class="meta" style="margin:8px 0 8px">Preview how Home changes through the day.</p>
            <div class="seg">${[['', 'Now'], ['10', 'Morning'], ['15', 'Afternoon'], ['19', 'Evening'], ['24', 'Late']].map(([h, l]) => `<button data-act="previewPhase" data-h="${h}">${l}</button>`).join('')}</div></div>
            <button class="btn sm" data-act="toggleClock">${HOP.clock.realtime ? 'Use demo time (Friday 7 PM)' : 'Use real time'}</button>
          </div>`,
        map() { HOP.map.setSelected(null); HOP.map.showRoute(null); HOP.map.clearOutingPins(); },
      };
    },
  };
  HOP.actions.viewAs = (d) => { S.setMe(d.u); ui.toast(`Viewing as ${S.userById[d.u].first}`); };
  HOP.actions.previewPhase = (d) => { HOP.setPreviewHour(d.h === '' ? null : +d.h % 24 === 0 ? 0 : +d.h); HOP.app.go('home', { go: 'home' }); ui.toast(d.h === '' ? 'Back to now' : 'Previewing Home at that time of day'); };
  HOP.actions.toggleClock = () => S.setRealtime(!HOP.clock.realtime);
  HOP.actions.resetDemo = () => { S.reset(); HOP.app.go('home', {}, { resetTo: 'home' }); ui.toast('Demo data reset'); };
  HOP.actions.clearBirthday = () => {
    const o = S.state.outings.find((x) => x.title === "Ollie's Birthday" && x.status !== 'ended');
    if (o) S.deleteOuting(o.id);
    HOP.app.go('home', {}, { resetTo: 'home' });
    ui.toast('Gone. Tap + to plan it from scratch.');
  };
})();

</script>
<script>
/* HOP — Outing chat. One small group chat per outing, for coordinating that night only.
   External apps get people into the outing; this chat runs the night once they're in.
   Photos stay in the outing album: chat lines only point at them. */
(() => {
  const { esc, avatar, avatarStack, photoTag, time, hm, plural, dayDate, longDate, ago, metres, distLabel, walkMins } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;

  let replyTo = null, selected = null, attachOpen = false, draft = {}, stuckToBottom = true, chatFocused = false;
  const REACTIONS = ['up', 'heart', 'haha', 'fire', 'wow'];
  const nameOf = (id) => (id === S.meId ? 'You' : S.userById[id]?.first || 'Someone');
  const placeName = (sys) => (sys.eventId ? HOP.events.byId(sys.eventId)?.title : S.venueById[sys.venueId]?.name) || 'a new spot';

  function sysText(m) {
    const s = m.sys, who = s.userId ? nameOf(s.userId) : '';
    switch (s.type) {
      case 'joined': return `<b>${esc(who)}</b> ${s.userId === S.meId ? 'joined' : 'joined the outing'}`;
      case 'stop': return `<b>${esc(who)}</b> added ${esc(placeName(s))} to the route`;
      case 'moved': return `The group is now at <b>${esc(placeName(s))}</b>`;
      case 'next': return `Next stop changed to <b>${esc(placeName(s))}</b>${s.at ? ` · ${time(s.at)}` : ''}`;
      case 'started': return `<b>${esc(who)}</b> started the night`;
      case 'ended': return 'The night’s wrapped. It’s saved in Memories';
      case 'photos': return `<b>${esc(who)}</b> added ${plural(s.count, 'photo')}`;
      case 'poll': return `${s.count} ${s.count === 1 ? 'person' : 'people'} voted for <b>${esc(placeName(s))}</b>`;
      default: return '';
    }
  }
  const sysIcon = { joined: 'check', stop: 'pin', moved: 'walk', next: 'walk', started: 'flag', ended: 'flag', photos: 'image', poll: 'users' };
  HOP.chatPreview = (m) => {
    if (!m) return '';
    if (m.kind === 'system') return sysText(m).replace(/<[^>]+>/g, '');
    const who = m.userId === S.meId ? 'You' : S.userById[m.userId].first;
    const body = { text: m.text, place: `shared ${m.place?.eventId ? HOP.events.byId(m.place.eventId)?.title : S.venueById[m.place?.venueId]?.name}`, location: 'shared a location', poll: `asked: ${m.poll?.q}`, photo: 'sent a photo' }[m.kind] || '';
    return `${who}: ${m.kind === 'text' ? m.text : body}`;
  };

  // ---------------- tabs: Plan / Chat / Photos ----------------
  HOP.outingTabs = (o, tab) => {
    const n = S.canChat(o) ? S.unread(o.id) : 0;
    const photos = S.photosOf(o.id).length;
    return `<div class="otabs" data-drag role="tablist">
      ${[['plan', o.status === 'ended' ? 'The night' : 'Plan'], ['chat', 'Chat'], ['photos', 'Photos']].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-act="otab" data-t="${k}">${l}${k === 'chat' && n ? `<i class="ub">${n}</i>` : ''}${k === 'photos' && photos ? `<em>${photos}</em>` : ''}</button>`).join('')}
    </div>`;
  };
  HOP.actions.otab = (d) => {
    const r = HOP.app.route;
    if ((r.params.tab || 'plan') === d.t) return;
    r.params.tab = d.t; selected = null; attachOpen = false; stuckToBottom = true;
    HOP.app.render({ resize: true });
  };

  // ---------------- chat body ----------------
  function chatBody(o) {
    if (!S.canChat(o)) {
