@media (min-width: 900px) { .camfab { right: 24px; bottom: 90px !important; } }
.layer.camera { background: #000; }
.layer.camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.camtop { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 10px) 10px 26px; background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent); }
.camtop .iconbtn { color: #fff; }
.camctx { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.camctx b { font: 800 15px/1.2 var(--f-display); font-stretch: 105%; }
.camctx span { color: #ddd; font: 600 11.5px/1.3 var(--f-mono); }
.cambottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 16px calc(20px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 16px; background: linear-gradient(to top, rgba(0,0,0,.7), transparent); }
.camvis { width: 100%; max-width: 280px; background: rgba(0,0,0,.5); }
.camrow { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.shutter.big { width: 78px; height: 78px; background: #fff; border: 5px solid #000; box-shadow: 0 0 0 3px #fff; }
.shutter.big:active { transform: scale(.94); }
.lastshot { justify-self: start; position: relative; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; border: 2px solid #fff; display: grid; place-items: center; color: #fff; background: rgba(255,255,255,.12); }
.lastshot .ph { position: absolute; inset: 0; }
.lastshot b { position: absolute; right: 2px; bottom: 2px; font: 700 11px/1 var(--f-body); background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 2px 4px; }
.saveroll { justify-self: end; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #ddd; max-width: 110px; line-height: 1.2; }
.saveroll input { accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

/* ================= v3: outing chat ================= */
.otabs { position: sticky; top: -1px; z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); margin: -2px calc(var(--gutter) * -1) 12px; padding: 0 var(--gutter); background: var(--surface); border-bottom: 1px solid var(--line); }
.otabs button { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 0 11px; font-weight: 650; font-size: 14px; color: var(--text-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.otabs button.on { color: var(--text); border-color: var(--accent); }
.otabs em { font: 600 11px var(--f-mono); font-style: normal; color: var(--text-3); }
.ub { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 700 11px/18px var(--f-body); font-style: normal; text-align: center; }
.lead .ub, .orow .ub { position: absolute; top: -5px; right: -6px; box-shadow: 0 0 0 2px var(--surface); }
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-3); font-size: 12px; font-weight: 550; margin: -2px 0 6px; }
.chathead > span { display: flex; align-items: center; gap: 6px; min-width: 0; }
.bell { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; color: var(--text-2); flex: none; }
.bell em { font-style: normal; font-size: 12px; font-weight: 600; }
.msgs { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; }
.chatday { align-self: center; margin: 14px 0 8px; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.newline { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--accent); font: 700 10.5px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.newline::before, .newline::after { content: ""; flex: 1; height: 1px; background: rgba(255,173,31,.35); }
.m { display: flex; align-items: flex-end; gap: 8px; max-width: 100%; }
.m.first { margin-top: 8px; }
.m.me { justify-content: flex-end; }
.mav { width: 28px; flex: none; }
.mb { display: flex; flex-direction: column; align-items: flex-start; max-width: 78%; min-width: 0; }
.m.me .mb { align-items: flex-end; }
.mname { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 0 0 3px 10px; }
.mtap { max-width: 100%; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.m.me .mtap { align-items: flex-end; }
.bubble { padding: 8px 12px 9px; background: var(--surface-3); border-radius: 16px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.m.them.first .bubble { border-top-left-radius: 6px; }
.m.me .bubble { background: #4a3812; color: #fff4de; }
.m.me.first .bubble { border-top-right-radius: 6px; }
.m.sel .bubble, .m.sel .card { box-shadow: 0 0 0 2px var(--accent); }
.flashmsg .bubble { box-shadow: 0 0 0 2px var(--event); transition: box-shadow .3s; }
.mention { color: var(--event); font-weight: 650; }
.mention.me { color: var(--accent); }
.mt { font: 500 10.5px var(--f-mono); color: var(--text-3); margin: 3px 8px 0; }
.quote { display: block; max-width: 100%; text-align: left; font-size: 12.5px; color: var(--text-2); padding: 5px 10px; margin-bottom: 2px; border-left: 2px solid var(--line-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quote b { color: var(--text); font-weight: 650; }
.rx { display: flex; gap: 4px; margin-top: -4px; padding: 0 6px; flex-wrap: wrap; position: relative; z-index: 1; }
.rx button { font-size: 12.5px; padding: 1px 6px; border-radius: 10px; background: var(--ink); border: 1px solid var(--line-strong); color: var(--text-2); font-weight: 600; }
.rx button.mine { border-color: var(--accent); color: var(--text); }
.msgbar { display: flex; align-items: center; gap: 2px; margin-top: 6px; padding: 3px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.msgbar button { font-size: 19px; width: 36px; height: 34px; border-radius: 8px; }
.msgbar button:hover { background: var(--surface-3); }
.msgbar .rp { width: auto; font-size: 13px; font-weight: 650; padding: 0 10px; display: flex; align-items: center; gap: 4px; color: var(--text-2); border-left: 1px solid var(--line); border-radius: 0 8px 8px 0; }
.msys { align-self: center; display: flex; align-items: center; gap: 6px; max-width: 92%; margin: 8px 0 2px; color: var(--text-3); font-size: 12.5px; text-align: center; }
.msys b { color: var(--text-2); font-weight: 600; }
.msys time { font: 500 10.5px var(--f-mono); }
.msys .i { flex: none; }
.sysph { align-self: center; display: flex; gap: 2px; border-radius: 8px; overflow: hidden; margin: 2px 0 6px; position: relative; }
.sysph .ph { width: 52px; height: 52px; }
.sysph b { position: absolute; right: 4px; bottom: 4px; font: 700 11px var(--f-body); background: rgba(0,0,0,.65); color: #fff; border-radius: 5px; padding: 1px 5px; }
.photomsg { display: grid; gap: 2px; border-radius: 14px; overflow: hidden; width: 220px; max-width: 100%; }
.photomsg.n1 .ph { aspect-ratio: 4/5; }
.photomsg.n2, .photomsg.n3, .photomsg.n4 { grid-template-columns: 1fr 1fr; }
.photomsg .ph { aspect-ratio: 1; }
.card { width: 260px; max-width: 100%; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 14px; overflow: hidden; }
.card .ctop { display: flex; gap: 10px; align-items: center; padding: 10px; }
.card .ctop > .ph { width: 52px; height: 52px; border-radius: 9px; flex: none; }
.card .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card .grow b { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .grow span { color: var(--text-2); font-size: 12.5px; }
.card .keen { display: flex; align-items: center; gap: 6px; color: var(--accent) !important; font-weight: 600; margin-top: 2px; }
.cbtns { display: flex; border-top: 1px solid var(--line-strong); }
.cbtns button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 9px 6px; font-size: 13px; font-weight: 650; color: var(--text); }
.cbtns button + button { border-left: 1px solid var(--line-strong); }
.cbtns button.pri { color: var(--accent); }
.cbtns button[disabled] { color: var(--text-3); }
.card.ev .ctop > .ph { border: 2px solid var(--event); }
.card.loc .minimap { height: 74px; position: relative; display: grid; place-items: center; background: #14171c; background-image: linear-gradient(32deg, transparent 46%, #262a31 46% 50%, transparent 50%), linear-gradient(-58deg, transparent 47%, #2c3038 47% 51%, transparent 51%), linear-gradient(90deg, transparent 70%, #20242a 70% 73%, transparent 73%); }
.card.loc .pinme .av { box-shadow: 0 0 0 3px var(--blue), 0 0 0 9px rgba(77,163,255,.2); }
.card.loc.off { opacity: .6; }
.card.loc.off .pinme .av { box-shadow: 0 0 0 3px var(--line-strong); filter: grayscale(1); }
.card.poll { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.card.poll .cbtns { margin: 4px -10px -10px; }
.pq { font-size: 14.5px; font-weight: 700; margin-bottom: 2px; }
.opt { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; text-align: left; font-size: 13.5px; font-weight: 600; }
.opt i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.07); }
.opt.mine { border-color: var(--accent); }
.opt.mine i { background: var(--accent-soft); }
.opt span { flex: 1; position: relative; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .stack, .opt em { position: relative; }
.opt em { font: 600 12px var(--f-mono); font-style: normal; color: var(--text-2); }
.pclosed { font-size: 11.5px; color: var(--text-3); }
.composer { position: sticky; bottom: -18px; z-index: 3; margin: 6px calc(var(--gutter) * -1) -18px; padding: 8px var(--gutter) calc(10px + var(--safe-b)); background: var(--surface); border-top: 1px solid var(--line); }
.composer.closed p { margin: 4px 0; color: var(--text-3); font-size: 13px; text-align: center; }
.crow { display: flex; align-items: center; gap: 8px; }
.crow input { flex: 1; min-width: 0; height: 42px; padding: 0 14px; border-radius: 21px; background: var(--ink); border: 1px solid var(--line-strong); outline: none; font-size: 15px; }
.crow input:focus { border-color: var(--accent); }
.cplus { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text); flex: none; transition: transform .2s; }
.cplus.on { transform: rotate(45deg); background: var(--accent); color: var(--accent-ink); }
.csend { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); flex: none; }
.replying { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 0 6px; font-size: 12.5px; color: var(--text-2); }
.replying span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid var(--accent); padding-left: 8px; }
.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; padding: 2px 0 10px; }
.tray button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 600; color: var(--text-2); text-align: center; }
.tray button .i { color: var(--accent); }
.chatgate { padding: 20px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.chatempty { text-align: center; }
.pickgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.pickgrid button { position: relative; aspect-ratio: 1; }
.pickgrid .ph { position: absolute; inset: 0; }
.pickgrid i { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #fff; display: grid; place-items: center; background: rgba(0,0,0,.35); color: var(--accent-ink); }
.pickgrid button.on i { background: var(--accent); border-color: var(--accent); }
.pickgrid button.on .ph { opacity: .75; }
.phhead { display: flex; justify-content: space-between; align-items: center; }
.grid.inset { margin: 0 calc(var(--gutter) * -1); }
.lastmsg { display: flex; gap: 8px; align-items: baseline; margin-top: 5px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.lastmsg time { font: 500 11px var(--f-mono); color: var(--text-3); flex: none; }
.lastmsg.fresh { color: var(--text); font-weight: 600; }
.lastmsg span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.unread { display: flex; flex-direction: column; align-items: center; gap: 2px; font: 800 16px/1 var(--f-display); color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 7px 8px 6px; min-width: 46px; }
.unread em { font: 600 9.5px var(--f-body); font-style: normal; text-transform: uppercase; letter-spacing: .06em; }
.tlwhen { font: 600 11.5px var(--f-mono); color: var(--accent); margin-left: 4px; }
.tl .s .lm { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 550; }
.locpin { position: relative; width: 34px; height: 34px; display: grid; place-items: center; }
.locpin .av { box-shadow: 0 0 0 3px var(--blue), 0 4px 12px rgba(0,0,0,.6); }
.locpin::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: rgba(77,163,255,.18); animation: pulse 2.2s ease-out infinite; }
.loclabel { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; padding: 3px 7px 4px; background: var(--ink); border: 1px solid var(--blue); border-radius: 6px; white-space: nowrap; pointer-events: none; }
.loclabel b { font: 700 12px/1.2 var(--f-body); } .loclabel em { font: 600 10px var(--f-body); font-style: normal; color: var(--text-2); }

/* ================= v4: living map ================= */
/* zoom tiers: far = neighbourhoods; area = + friend groups, major events; mid = + busy venues; near = all */
#map.z-far .vpin:not(.on), #map.z-area .vpin:not(.on) { display: none; }
#map.z-far .evpin:not(.major) { display: none; }
#map.z-area .evpin.atvenue:not(.major) { display: none; }
#map:not(.z-far):not(.z-area) .evpin.atvenue { display: none; }
#map:not(.z-far):not(.z-area) .area, #map.mode-focus .area, #map.mode-events .area, #map.mode-pick .area { display: none; }
#map:not(.z-area) .fchip, #map.mode-focus .fchip, #map.mode-events .fchip, #map.mode-pick .fchip { display: none; }
#map.z-area .fpin .flabel, #map.z-area .spin.mini .slabel { display: none; }

/* neighbourhood energy: set like map labels, not pins */
.area { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; text-align: center; padding: 2px 4px; text-shadow: 0 0 4px #000, 0 0 10px #000, 0 0 16px rgba(0,0,0,.8); cursor: pointer; }
.area b { font: 800 13px/1 var(--f-display); font-stretch: 122%; letter-spacing: .14em; text-transform: uppercase; color: var(--text); }
.area em { font: 650 11.5px/1.1 var(--f-body); font-style: normal; color: var(--text-2); }
.area.lv1 em { color: #e9cf9a; } .area.lv2 em { color: #ffc35a; } .area.lv3 em { color: var(--accent); }
.area.lv3 b { color: #fff6e6; }
.area .ai { display: flex; align-items: center; gap: 5px; font: 600 11px/1 var(--f-body); color: var(--text-2); margin-top: 1px; }
.area .ai .stack .av { box-shadow: 0 0 0 1.5px var(--ink); }
.area.quiet { opacity: .55; }
.area.quiet b { font-size: 11px; color: var(--text-2); }
#map.z-area .area { opacity: .92; }
#map.z-area .area.quiet { display: none; }

/* friends grouped by place */
.fchip { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; background: var(--ink); border: 1px solid var(--line-strong); border-radius: 18px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.55); cursor: pointer; }
.fchip .stack .av { box-shadow: 0 0 0 1.5px var(--ink); }
.fchip > span:last-child { display: flex; flex-direction: column; gap: 1px; }
.fchip b { font: 700 12px/1.1 var(--f-body); }
.fchip em { font: 600 10px/1.1 var(--f-body); font-style: normal; color: var(--text-2); }

/* heat sits under the street labels */
.heatcanvas { position: absolute; left: 0; top: 0; pointer-events: none; transition: opacity .4s; }
#map.mode-focus .heatcanvas { opacity: .35; }
#map:not(.z-far):not(.z-area):not(.z-mid) .heatcanvas { opacity: .7; }
.leaflet-zoom-anim .heatcanvas { opacity: 0; transition: none; }

/* activity control */
.layerbtn { position: absolute; z-index: 550; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + var(--sheet-h, 120px) + 66px); transition: bottom .25s; flex-direction: column; gap: 1px; height: 46px; padding: 0 8px; font-size: 10px; font-weight: 700; color: var(--text-2); }
.layerbtn.on { color: var(--accent); border-color: rgba(255,173,31,.55); }
.heatbar { position: absolute; z-index: 550; left: 12px; right: 70px; bottom: calc(var(--nav-h) + var(--safe-b) + var(--sheet-h, 120px) + 12px); transition: bottom .25s; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.heatbar > * { pointer-events: auto; }
.heatbar .seg { background: rgba(13,14,17,.92); grid-auto-columns: auto; box-shadow: 0 6px 18px rgba(0,0,0,.45); padding: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.heatbar .seg::-webkit-scrollbar { display: none; }
.heatbar .seg button { height: 30px; padding: 0 10px; font-size: 12.5px; white-space: nowrap; }
.heatbar .seg button.on { background: var(--accent-soft); color: var(--accent); }
body[data-sheet="full"] .heatbar, body[data-sheet="full"] .layerbtn, body.hide-nav .heatbar, body.hide-nav .layerbtn { display: none; }
@media (min-width: 900px) { .layerbtn { bottom: 84px !important; right: 16px; } .heatbar { left: 424px; right: auto; bottom: 24px !important; } }

/* movement: only when something changes */
.bump { animation: bump .9s cubic-bezier(.2,.8,.2,1); }
@keyframes bump { 0% { color: var(--accent); transform: scale(1.12); } 100% { transform: none; } }
.newrow { animation: newrow .5s cubic-bezier(.2,.8,.2,1); }
@keyframes newrow { from { opacity: 0; transform: translateY(6px); } }
body:not(.mapbrowse) .heatbar, body:not(.mapbrowse) .layerbtn { display: none; }
.tlsub { font-weight: 550; color: var(--text-2); font-size: 13px; }
.glance { margin: 3px 0 0; font-size: 13px; color: var(--text); font-weight: 550; }
.tonhead { align-items: flex-start; }
.tl .s .stack { margin-right: 2px; }
.lvm { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; flex: none; }
.lvm i { width: 4px; border-radius: 1px; background: var(--line-strong); }
.lvm i:nth-child(1) { height: 4px; } .lvm i:nth-child(2) { height: 6px; } .lvm i:nth-child(3) { height: 9px; } .lvm i:nth-child(4) { height: 12px; }
.lvm i.on { background: var(--text-2); }
.lvm.lv2 i.on { background: #ffc35a; } .lvm.lv3 i.on { background: var(--accent); }
.row .lvm { width: 36px; justify-content: center; }
.lvw { font-weight: 650; font-size: 12.5px; color: var(--text-2); }
.lvw.lv2 { color: #ffc35a; } .lvw.lv3 { color: var(--accent); }
.arealine { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
.arealine b { font-size: 14px; }
.arealink { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 3px 0; }
.stripmeta { font-size: 12px; margin: 8px 0 0; }
.quietnote { padding: 6px 0 0; }
.ctxline { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 13px; color: var(--text-2); }
.btnrow.three > .btn { padding: 0 8px; font-size: 14px; }
.savedbtn { border-color: var(--accent); color: var(--accent); }
.startlink { align-self: center; padding: 8px; }
#map.z-far .spin.mini, #map.z-area .spin.mini, #map.z-far .opin, #map.z-area .opin { display: none; }
#map.z-far .loclabel, #map.z-area .loclabel { display: none; }
/* hidden markers must not catch taps: hide their Leaflet wrappers too */
#map.z-far .leaflet-marker-icon:has(> .vpin:not(.on)), #map.z-area .leaflet-marker-icon:has(> .vpin:not(.on)), #map.z-mid .leaflet-marker-icon:has(> .vpin.plain:not(.on)),
#map.z-far .leaflet-marker-icon:has(> .evpin:not(.major)), #map.z-area .leaflet-marker-icon:has(> .evpin.atvenue:not(.major)), #map:not(.z-far):not(.z-area) .leaflet-marker-icon:has(> .evpin.atvenue),
#map:not(.z-far):not(.z-area) .leaflet-marker-icon:has(> .area), #map.mode-focus .leaflet-marker-icon:has(> .area), #map.mode-events .leaflet-marker-icon:has(> .area), #map.mode-pick .leaflet-marker-icon:has(> .area),
#map.z-area .leaflet-marker-icon:has(> .area.quiet),
#map:not(.z-area) .leaflet-marker-icon:has(> .fchip), #map.mode-focus .leaflet-marker-icon:has(> .fchip), #map.mode-events .leaflet-marker-icon:has(> .fchip), #map.mode-pick .leaflet-marker-icon:has(> .fchip),
#map.z-far .leaflet-marker-icon:has(> .spin.mini), #map.z-area .leaflet-marker-icon:has(> .spin.mini), #map.z-far .leaflet-marker-icon:has(> .opin), #map.z-area .leaflet-marker-icon:has(> .opin),
.leaflet-marker-icon:has(> .area.hid), .leaflet-marker-icon:has(> .fchip.hid) { display: none !important; }

/* ===================== v5: a live social layer ===================== */
/* Five activity levels, one colour each. Same values as the heat ramp in map.js. */
:root { --lv0: #3fb6e8; --lv1: #3ecf8e; --lv2: #f2d24b; --lv3: #ff8f2e; --lv4: #ff4438; }
.lvm i:nth-child(5) { height: 14px; }
.lvm { height: 14px; }
.lvm.lv0 i.on { background: var(--lv0); } .lvm.lv1 i.on { background: var(--lv1); } .lvm.lv2 i.on { background: var(--lv2); } .lvm.lv3 i.on { background: var(--lv3); } .lvm.lv4 i.on { background: var(--lv4); }
.lvw.lv0 { color: var(--lv0); } .lvw.lv1 { color: var(--lv1); } .lvw.lv2 { color: var(--lv2); } .lvw.lv3 { color: var(--lv3); } .lvw.lv4 { color: var(--lv4); }
.lvbox { display: grid; place-items: center; }
.iconbtn.lvbox { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.area em { color: var(--text-2); }
.area.lv0 em { color: #8fd3f0; } .area.lv1 em { color: #8fe3bb; } .area.lv2 em { color: var(--lv2); } .area.lv3 em { color: var(--lv3); } .area.lv4 em { color: #ff7a6e; }
.area.lv3 b, .area.lv4 b { color: #fff6e6; }
/* venue pin rings follow the level colour */
.vpin.hot.lv2 .core { border-color: var(--lv2); box-shadow: 0 0 0 3px rgba(242,210,75,.2), 0 2px 8px rgba(0,0,0,.6); }
.vpin.hot.lv3 .core { border-color: var(--lv3); box-shadow: 0 0 0 3px rgba(255,143,46,.22), 0 2px 8px rgba(0,0,0,.6); }
.vpin.hot.lv4 .core { border-color: var(--lv4); box-shadow: 0 0 0 3px rgba(255,68,56,.24), 0 2px 8px rgba(0,0,0,.6); }
.vpin.hot.lv2 .vlabel em { color: var(--lv2); } .vpin.hot.lv3 .vlabel em { color: #ffb27a; } .vpin.hot.lv4 .vlabel em { color: #ff8a80; }

/* outing icons (vector, no emoji) */
.oico { display: block; flex: none; }
.lead.emo .oico, .emo .oico, .emo-sm .oico { width: 20px; height: 20px; color: var(--accent); }
.orow .emo .oico, .ohead .emo .oico { width: 26px; height: 26px; }
.lead i .oico, .fpin .oe .oico { width: 12px; height: 12px; color: var(--accent); }
.mem .t .oico { width: 18px; height: 18px; color: var(--accent); }
.rx button { display: inline-flex; align-items: center; gap: 4px; }
.rx button svg { width: 14px; height: 14px; }
.rx button em { font-style: normal; font-size: 12px; }

/* legend */
.heatbar { flex-direction: column; align-items: flex-start; gap: 6px; }
.legend { display: flex; align-items: center; gap: 7px; padding: 5px 6px 5px 10px; background: rgba(13,14,17,.92); border: 1px solid var(--line); border-radius: 9px; font-size: 11px; color: var(--text-2); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.legend b { font: 800 10px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--text); font-stretch: 122%; }
.legend em { font-style: normal; }
.legend .ramp { width: 72px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--lv0), var(--lv1) 32%, var(--lv2) 55%, var(--lv3) 76%, var(--lv4)); }
.legend.fc .ramp { opacity: .65; }
.legend span { padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2); font-weight: 650; }
.legend button { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text-3); }

/* map lenses: TONIGHT / FRIENDS / PLACES / EVENTS */
.lenses { display: flex; gap: 0; align-self: stretch; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.lenses button { flex: 1; height: 30px; border-radius: 7px; font: 800 11px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; font-stretch: 118%; color: var(--text-3); }
.lenses button.on { background: var(--surface-3); color: var(--accent); }
.filters.subs { box-shadow: none; }
#map.lens-friends .leaflet-marker-icon:has(> .evpin), #map.lens-places .leaflet-marker-icon:has(> .evpin),
#map.lens-places .leaflet-marker-icon:has(> .fchip), #map.lens-places .leaflet-marker-icon:has(> .fpin),
#map.lens-friends.sub-outings .leaflet-marker-icon:has(> .fchip) { display: none !important; }
#map.lens-friends.mode-default:not(.sub-outings) .leaflet-marker-icon:has(> .fchip:not(.hid)) { display: block !important; }
#map.lens-friends.mode-default:not(.sub-outings) .fchip { display: flex; }
#map.lens-places.z-area .leaflet-marker-icon:has(> .vpin.st) { display: block !important; }
#map.lens-places.z-area .vpin.st { display: block; }

/* Tonight peek: three one-line rows */
.pkrows { display: flex; flex-direction: column; }
.pk { display: flex; align-items: center; gap: 6px; min-height: 36px; border-bottom: 1px solid var(--line); }
.pk:last-child { border-bottom: 0; }
.pkmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 36px; text-align: left; }
.pkmain > .i { color: var(--text-3); flex: none; }
.pklead { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); color: var(--accent); }
.pklead svg { width: 15px; height: 15px; }
.pklead.av { background: none; border: 0; }
.pklead.lvbox .lvm { transform: scale(.85); }
.pkstack { flex: none; width: 46px; display: flex; }
.pkt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.pkt b { font-weight: 700; }
.pkt em { font-style: normal; color: var(--text-2); font-size: 13px; }
.pkun { color: var(--accent); font-weight: 650; }
.pkcam { width: 36px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--text); color: var(--ink); }
.tonhead { align-items: center; padding: 0 0 2px; }
.tonhead .label { margin: 0; }
.glance { margin: 10px 0 0; }

/* venue: live card */
.busyline b { font: 800 12px/1 var(--f-display); letter-spacing: .1em; font-stretch: 118%; color: var(--text); }
.busyline.lv0 b { color: var(--lv0); } .busyline.lv1 b { color: var(--lv1); } .busyline.lv2 b { color: var(--lv2); } .busyline.lv3 b { color: var(--lv3); } .busyline.lv4 b { color: var(--lv4); }
.vsub { font-size: 12.5px; color: var(--text-2); margin-top: 5px; }
.vsub b { color: var(--event); font-weight: 650; }
.reports { margin: 12px 0 2px; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px 8px; background: var(--surface-2); }
.reports.empty { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }
.reports .rgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.reports .rgrid div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.reports .rgrid span { font: 800 9.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-stretch: 118%; }
.reports .rgrid b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reports .rfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-3); }
.reports .linkbtn { font-size: 12.5px; color: var(--accent); }
.btn.off { opacity: .45; }
.rgroup { margin: 0 0 12px; }
.rgroup .label { margin: 0 0 6px; }
.rchips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchips button { height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.rchips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.colrow.on .colic { color: var(--accent); }
.colic { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex: none; color: var(--text-2); }
.colchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.colchips button { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); min-width: 112px; text-align: left; }
.colchips b { font-size: 13.5px; } .colchips span { font-size: 12px; color: var(--text-2); }

/* search discovery */
.sublabel { margin: 14px 0 4px !important; }
.recents { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 4px; }
.recents button { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.erow .s .soon { color: var(--accent); font-weight: 650; }

/* area: why it's busy */
.areah { margin-top: 4px; }
.peakline { margin: 6px 0 0; font-size: 13px; }
.why { margin: 8px 0 0; font-size: 13.5px; color: var(--text); }
.afacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.afacts span { padding: 4px 9px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--text-2); }

/* where next */
.wn { display: flex; flex-direction: column; }
.wnrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wnrow:last-child { border-bottom: 0; }
.wnmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.wnmain .t { font-weight: 700; font-size: 14.5px; }
.wnmain .s { font-size: 12.5px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wnmain .s.dim { color: var(--text-3); }
.wnact { display: flex; flex-direction: column; gap: 5px; flex: none; }
.wnact .btn { min-width: 78px; }

/* nav: camera during your live outing */
#nav .create.cam { background: var(--text); color: var(--ink); }

/* memories recap */
.recap { font-size: 12.5px; color: var(--accent); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.recap.big { font-size: 14px; margin: 8px 0 0; white-space: normal; }
.pstats { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.sublabel { display: flex; justify-content: space-between; align-items: center; }
.pkstack { width: auto; }

</style>
</head>

<div id="app">
  <div id="map" aria-label="Map"></div>
  <header id="top" class="top"></header>
  <section id="sheet" class="sheet" data-size="mini" aria-live="polite">
    <div class="grab" data-drag><span></span></div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div id="layers"></div>
  <div id="modal"></div>
  <div id="banners" aria-live="polite"></div>
  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="rollIn" accept="image/*" multiple hidden>
  <input type="file" id="coverIn" accept="image/*" hidden>
</div>

<script>
/* HOP — small shared helpers. Plain scripts (no modules) so the app runs from file:// */
window.HOP = window.HOP || {};

/* Demo clock. The prototype opens at "Friday, 7:04 PM" so the map shows a real Friday night.
   The offset is stored with the demo data, so time keeps moving forward across reloads. */
HOP.clock = (() => {
  let offset = 0;
  function demoOffset() {
    const real = new Date();
    const t = new Date(real); t.setHours(19, 4, 0, 0);
    while (t.getDay() !== 5) t.setDate(t.getDate() + 1);
    return t.getTime() - real.getTime();
  }
  let realtime = false;
  try { realtime = localStorage.getItem('hop.realtime') === '1'; } catch (e) {}
  return { set: (o) => (offset = o || 0), get offset() { return offset; }, demoOffset, get realtime() { return realtime; } };
})();
HOP.now = () => Date.now() + HOP.clock.offset;

HOP.util = (() => {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Deterministic PRNG so seeded content is stable between reloads
  function rng(seed) {
    let s = 0;
    for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9);

  // ---- Dates ---------------------------------------------------------------
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  const time = (d) => {
    d = new Date(d);
    let h = d.getHours(), m = d.getMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  };
  const timeShort = (d) => time(d).replace(':00', '').replace(' ', ' ').toLowerCase();
  const dayDate = (d) => { d = new Date(d); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  const longDate = (d) => { d = new Date(d); return `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS_LONG[d.getMonth()]}`; };

  // "Saturday, 7:30 PM" when within the coming week, otherwise "Sat 17 Oct · 7:30 PM"
  function when(d, now = HOP.now()) {
    const dt = new Date(d);
    const days = Math.round((startOfDay(dt) - startOfDay(new Date(now))) / 864e5);
    if (days === 0) return `Tonight, ${time(dt)}`;
    if (days === 1) return `Tomorrow, ${time(dt)}`;
    if (days > 1 && days < 7) return `${DAYS_LONG[dt.getDay()]}, ${time(dt)}`;
    return `${dayDate(dt)} · ${time(dt)}`;
  }
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

  function ago(ts, now = HOP.now()) {
    if (ts > now) return 'soon';
    const s = Math.max(0, Math.round((now - ts) / 1000));
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.round(h / 24);
    if (d < 7) return `${d}d ago`;
    const w = Math.round(d / 7);
    if (d < 45) return `${w} week${w > 1 ? 's' : ''} ago`;
    const mo = Math.round(d / 30);
    return `${mo} month${mo > 1 ? 's' : ''} ago`;
  }

  // ---- Geo -----------------------------------------------------------------
  function metres(a, b) {
    const R = 6371e3, toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const walkMins = (a, b) => Math.max(1, Math.round((metres(a, b) * 1.3) / 80)); // 1.3 = street grid fudge
  const distLabel = (m) => (m < 1000 ? `${Math.round(m / 10) * 10} m` : `${(m / 1000).toFixed(1)} km`);

  // ---- Imagery -------------------------------------------------------------
  // Seeded photos reference Unsplash images with a focal-point crop, so one source
  // can produce several distinct-looking frames. Uploaded photos carry a data: URL.
  function img(u, w = 400, h = w) {
    if (!u) return '';
    if (typeof u === 'string') return u;
    const fp = u.fx != null ? `&crop=focalpoint&fp-x=${u.fx}&fp-y=${u.fy}&fp-z=${u.fz}` : '';
    return `https://images.unsplash.com/photo-${u.id}?w=${w}&h=${h}&fit=crop${fp}&q=70&auto=format`;
  }
  const photoSrc = (p, w, h) => (p.src ? p.src : img(p.u, w, h));

  const initials = (name) => name.split(/\s+/).map((x) => x[0]).slice(0, 2).join('').toUpperCase();
  const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 33 + c.charCodeAt(0)) % 360; return h; };

  function avatar(user, size = 32, extra = '') {
    if (!user) return '';
    return `<span class="av ${extra}" style="--s:${size}px;--h:${hue(user.id)}" title="${esc(user.name)}"><i>${esc(initials(user.name))}</i>${user.avatar ? `<img src="${esc(user.avatar)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
  }
  function avatarStack(users, max = 5, size = 28) {
    const shown = users.slice(0, max);
    const more = users.length - shown.length;
    return `<span class="stack">${shown.map((u) => avatar(u, size)).join('')}${more > 0 ? `<span class="av more" style="--s:${size}px"><i>+${more}</i></span>` : ''}</span>`;
  }
  // Photo tile with a tinted fallback if the network image can't load
  function photoTag(p, w = 300, h = w, cls = '') {
    return `<span class="ph ${cls}" style="--h:${hue(p.id)}"><img src="${esc(photoSrc(p, w, h))}" alt="" loading="lazy" onerror="this.remove()"></span>`;
  }

  // "FRIDAY 2 OCT · 8PM"
  function eventWhen(ts) {
    const d = new Date(ts);
    const t = time(d).replace(':00', '').replace(' ', '');
    return `${DAYS_LONG[d.getDay()].toUpperCase()} ${d.getDate()} ${MONTHS[d.getMonth()].toUpperCase()} · ${t}`;
  }
  // "8pm" / "7:30pm"
  const hm = (ts) => time(ts).replace(':00', '').replace(' ', '').toLowerCase();
  const sameNight = (a, b) => { const x = new Date(a - 5 * 36e5), y = new Date(b - 5 * 36e5); return x.toDateString() === y.toDateString(); };

  const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  // "On now" / "Starts in 20m" / "Starts in 1h 10m" / "9pm"
  function startsIn(start, end, now = HOP.now()) {
    if (now >= start && (!end || now < end)) return 'On now';
    const m = Math.round((start - now) / 6e4);
    if (m > 0 && m <= 150) return `Starts in ${m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '')}`;
    return hm(start);
  }
  return { startsIn, esc, rng, pick, uid, eventWhen, hm, sameNight, DAYS_LONG, time, timeShort, dayDate, longDate, when, ago, metres, walkMins, distLabel, img, photoSrc, initials, hue, avatar, avatarStack, photoTag, plural, clamp, DAYS, MONTHS };
})();

  function demoCity(now) {
    const r = HOP.util.rng(77);
    const MIN = 6e4;
    const hourNow = new Date(now).getHours() + new Date(now).getMinutes() / 60;

    const CROWD = ['quiet', 'moderate', 'busy', 'packed'], QUEUE = ['none', 'short', 'medium', 'long'];
    venues.forEach((v) => {
      const [pop, peak] = POP[v.id] || [0.3, 21];
      const busy = pop * Math.exp(-(((hourNow - peak) / 3.2) ** 2));
      if (v.cat === 'spot' || busy < 0.3) return;
      const n = Math.round(busy * 7 + r() * 2);
      const lvl = Math.min(3, Math.floor(busy * 4.2));
      for (let k = 0; k < n; k++) {
        const at = now - Math.round(3 + r() * 80) * MIN;
        const jitter = r() < 0.25 ? (r() < 0.5 ? -1 : 1) : 0;
        reports.push({ id: `dr_${v.id}_${k}c`, venueId: v.id, kind: 'crowd', value: CROWD[Math.max(0, Math.min(3, lvl + jitter))], at, userId: null, demo: true });
        if (r() < 0.6) reports.push({ id: `dr_${v.id}_${k}q`, venueId: v.id, kind: 'queue', value: QUEUE[Math.max(0, Math.min(3, lvl - 1 + jitter))], at, userId: null, demo: true });

      for (let k = 0; k < np; k++) venuePhotos.push({ id: `vp_${v.id}_${k}`, venueId: v.id, u: pool[Math.floor(r() * pool.length)], takenAt: now - Math.round(2 + r() * 150) * MIN, visibility: 'public', userId: null, demo: true });
    });
    return { reports, venuePhotos };
  }

  // Saved collections (per person). Items: { venueId } or { eventId }.
  const collections = () => ({ u_ollie: [

<script>
/* HOP — Public Events.
   Events are things anyone can discover (club nights, gigs, markets, run clubs…), as opposed
   to Outings, which friends create. Every event is normalised to one shape so it can come from:
     1. 'seed'   — the demo data below (today)
     2. 'feed'   — an external listings feed (later: ticketing / what's-on APIs)
     3. 'venue'  — published directly by a verified venue (later: business accounts, deals, promotion)
   Add a source to HOP.events.sources and the map, What's on and outing planning all pick it up. */

HOP.events = (() => {
  const CATS = {
    club: { label: 'Club night', groups: ['nightlife', 'music'] },
    live: { label: 'Live music', groups: ['music'] },
    dj: { label: 'DJ set', groups: ['music', 'nightlife'] },
    pub: { label: 'Pub event', groups: ['nightlife'] },
    trivia: { label: 'Trivia', groups: ['nightlife'] },
    happyhour: { label: 'Happy hour', groups: ['nightlife', 'food'] },
    festival: { label: 'Festival', groups: ['music', 'food'] },
    market: { label: 'Market', groups: ['food'] },
    run: { label: 'Run club', groups: ['sport'] },
    comedy: { label: 'Comedy', groups: ['nightlife', 'comedy'] },
    exhibition: { label: 'Exhibition', groups: [] },
    sport: { label: 'Sports screening', groups: ['sport'] },
    food: { label: 'Food event', groups: ['food'] },
  };
  const GLYPH = {
    club: '<path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 12h-.5"/>',
    dj: '<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/>',
    live: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
    festival: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    pub: '<path d="M7 5h9v13a2 2 0 01-2 2H9a2 2 0 01-2-2zM16 8h1.5a2 2 0 012 2v3a2 2 0 01-2 2H16"/>',
    trivia: '<path d="M9 9a3 3 0 115 2.2c-1.2.8-2 1.5-2 2.8M12 17.5v.5"/>',
    happyhour: '<path d="M5 5h14l-7 8zM12 13v6M8.5 19.5h7"/>',
    market: '<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>',
    run: '<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6.5 2.5 2.5V21M8 12l2-4.5 3.5 1 2.5 3.5M12 14.5L10.5 9"/>',
    comedy: '<rect x="9" y="3.5" width="6" height="10" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v3.5"/>',
    exhibition: '<rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 15l4.5-4 4 3.5 3-2.5L20 15"/>',
    sport: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>',
    food: '<path d="M7 4v7a2 2 0 002 2v7M11 4v7M9 4v5M16 20V4c-2 1.5-2.5 4-2.5 7H16"/>',
  };
  const svg = (cat, size = 12) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${GLYPH[cat] || GLYPH.festival}</svg>`;

  function normalize(raw, source) {
    return {
      id: raw.id, title: raw.title, cat: raw.cat,
      venueId: raw.venueId || null, place: raw.place || null, // place = { name, suburb, lat, lng } for parks, streets, foreshores
      startsAt: raw.startsAt, endsAt: raw.endsAt || raw.startsAt + 3 * 36e5,
      price: raw.price || 0, priceLabel: raw.priceLabel || (raw.price ? `$${raw.price}` : 'Free'),
      genre: raw.genre || CATS[raw.cat]?.label || '', blurb: raw.blurb || '', img: raw.img ? { id: raw.img } : null,
      interested: raw.interested || 0, friendIds: raw.friendIds || [],
      publisher: raw.publisher || { type: source.id === 'seed' ? 'feed' : source.id, name: source.name, verified: false },
      deal: raw.deal || null, promoted: false, recurs: raw.recurs || null, ticketUrl: raw.ticketUrl || null,
      source: source.id,
    };
  }

  // ---- sources ---------------------------------------------------------------
  const sources = [
    { id: 'seed', name: 'HOP picks', load: (now) => HOP.seed.events(now) },
    // { id: 'feed', name: 'What’s On Sydney', load: async (now) => (await fetch('/api/events?near=sydney')).json() },
    // { id: 'venue', name: 'Verified venues', load: async () => … }  // venues publishing directly
  ];
  const loadAll = (now) => sources.flatMap((src) => (src.load(now) || []).map((r) => normalize(r, src)));

  // ---- queries ---------------------------------------------------------------
  const S = () => HOP.store;
  const all = () => S().state.events || [];
  const byId = (id) => all().find((e) => e.id === id);
  const placeOf = (e) => (e.venueId ? S().venueById[e.venueId] : e.place);
  const live = (e, now = HOP.now()) => e.startsAt <= now && e.endsAt > now;
  const upcoming = (now = HOP.now()) => all().filter((e) => e.endsAt > now).sort((a, b) => a.startsAt - b.startsAt);

  function dayKey(ts) { const d = new Date(ts - 5 * 36e5); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  // when: tonight | tomorrow | weekend | any   ·   group: music | nightlife | food | sport | free | null
  function filter({ when = 'tonight', group = null } = {}, now = HOP.now()) {
    const today = dayKey(now);
    return upcoming(now).filter((e) => {
      const k = dayKey(e.startsAt), days = Math.round((k - today) / 864e5);
      if (when === 'tonight' && days !== 0) return false;
      if (when === 'tomorrow' && days !== 1) return false;
      if (when === 'weekend') { const dow = new Date(k).getDay(); if (days > 6 || ![5, 6, 0].includes(dow) || (days === 0 && false)) return false; }
      if (group === 'free') return !e.price;
      if (group) return CATS[e.cat]?.groups.includes(group);
      return true;
    });
  }
  const atVenue = (venueId, now = HOP.now()) => upcoming(now).filter((e) => e.venueId === venueId);
  const tonightAt = (venueId, now = HOP.now()) => atVenue(venueId, now).filter((e) => dayKey(e.startsAt) === dayKey(now));

  function toggleInterest(id) {
    const e = byId(id);
    const me = S().meId;
    const on = e.friendIds.includes(me);
    e.friendIds = on ? e.friendIds.filter((x) => x !== me) : [me, ...e.friendIds];
    e.interested += on ? -1 : 1;
    S().touch('event:interest', { id });
    return !on;
  }

  return { CATS, svg, normalize, sources, loadAll, all, byId, placeOf, live, upcoming, filter, atVenue, tonightAt, toggleInterest, dayKey };
})();

<script>
/* HOP — the data layer.
   Five core entities: User, Outing, Attendee, Stop, Photo. Venues are reference data.
   State persists to localStorage and syncs between open tabs (BroadcastChannel), which is
   how "photos appear live" works in this prototype. Swap persist()/channel for a real
   backend (Supabase/Firebase/etc.) without touching the screens. */

HOP.store = (() => {
  const { uid } = HOP.util;
  const KEY = 'hop.state.v6';
  const TAB = uid('tab');
  const listeners = new Set();
  let state;
  let storageOk = true;

  const venues = HOP.seed.venues;
  const venueById = Object.fromEntries(venues.map((v) => [v.id, v]));
  const userById = Object.fromEntries(HOP.seed.users.map((u) => [u.id, u]));

  function fresh() {
    const offset = HOP.clock.realtime ? 0 : HOP.clock.demoOffset();
    HOP.clock.set(offset);
    const now = HOP.now();
    return { v: 6, clockOffset: offset, ...HOP.seed.build(now), ...HOP.seed.demoCity(now), collections: HOP.seed.collections(), events: HOP.events.loadAll(now), chatPrefs: {} };
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { state = JSON.parse(raw); HOP.clock.set(state.clockOffset); return; }
    } catch (e) { /* storage blocked */ }
    state = fresh();
    persist();
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) {
      // Usually quota: drop full-size uploaded images from storage, keep them in memory
      storageOk = false;
      try {
        const slim = { ...state, photos: state.photos.map((p) => (p.src && p.src.length > 60000 ? { ...p, src: p.thumb || null } : p)) };
        localStorage.setItem(KEY, JSON.stringify(slim));
      } catch (e2) { /* give up quietly — app keeps working in memory */ }
    }
  }

  // ---- identity (per tab, so two tabs can be two different friends) -------
  let meId = 'u_ollie';
  try { meId = sessionStorage.getItem('hop.me') || 'u_ollie'; } catch (e) {}
  const me = () => userById[meId];
  function setMe(id, silent) { meId = id; try { sessionStorage.setItem('hop.me', id); } catch (e) {} if (!silent) emit('me'); }

  // ---- events + cross-tab sync --------------------------------------------
  let channel = null;
  try { channel = new BroadcastChannel('hop'); } catch (e) {}
  if (channel) channel.onmessage = (ev) => {
    if (!ev.data || ev.data.tab === TAB) return;
    try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}
    emit(ev.data.type, { ...ev.data.payload, remote: true });
  };
  const on = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  function emit(type, payload = {}) { listeners.forEach((fn) => fn(type, payload)); }
  function commit(type, payload = {}) {
    persist();
    if (channel) { try { channel.postMessage({ tab: TAB, type, payload }); } catch (e) {} }
    emit(type, payload);
  }

  // ---- selectors ----------------------------------------------------------
  const outing = (id) => state.outings.find((o) => o.id === id);
  const stopsOf = (id) => state.stops.filter((s) => s.outingId === id).sort((a, b) => a.order - b.order);
  const attendeesOf = (id) => state.attendees.filter((a) => a.outingId === id);
  const going = (id) => attendeesOf(id).filter((a) => a.rsvp === 'going');
  const myAttendance = (id) => attendeesOf(id).find((a) => a.userId === meId);
  const isOrganiser = (o) => o && o.organiserId === meId;
  const eventOf = (stop) => (stop.eventId ? HOP.events.byId(stop.eventId) : null);
  const stopName = (stop) => { const e = eventOf(stop); return e ? e.title : placeOf(stop).name; };
  const placeOf = (stop) => venueById[stop.venueId] || (stop.eventId ? HOP.events.placeOf(eventOf(stop)) : stop.place);

  // Photos I can see: everything shared with the outing, plus my private ones
  const photosOf = (id, stopId) => state.photos
    .filter((p) => p.outingId === id && (p.visibility !== 'private' || p.userId === meId) && (!stopId || p.stopId === stopId))
    .sort((a, b) => a.takenAt - b.takenAt);

  function myOutings() {
    const mine = (o) => { const a = myAttendance(o.id); return a && a.rsvp !== 'declined'; };
    const list = state.outings.filter(mine);
    return {
      live: list.filter((o) => o.status === 'live' && myAttendance(o.id).rsvp === 'going'),
      invites: list.filter((o) => o.status !== 'ended' && myAttendance(o.id).rsvp === 'invited'),
      upcoming: list.filter((o) => o.status === 'planning' && myAttendance(o.id).rsvp !== 'invited').sort((a, b) => a.startsAt - b.startsAt),
      memories: list.filter((o) => o.status === 'ended' && myAttendance(o.id).rsvp === 'going').sort((a, b) => b.startsAt - a.startsAt),
    };
  }
  const publicOutings = () => state.outings.filter((o) => o.visibility === 'public' && o.status !== 'ended');

  // ---- tonight: who's out, where, and what it's like ----------------------
  const nightOf = (ts) => HOP.events.dayKey(ts);
  // Outings happening tonight that I can see: mine, ones I'm invited to, public ones
  function tonightOutings() {
    const k = nightOf(HOP.now());
    return state.outings.filter((o) => o.status !== 'ended' && nightOf(o.status === 'live' ? HOP.now() : o.startsAt) === k
      && (myAttendance(o.id) || o.visibility === 'public'))
      .sort((a, b) => (b.status === 'live') - (a.status === 'live') || a.startsAt - b.startsAt);
  }
  // Where each friend is right now: from live outings (current stop) and location sharing
  function friendsOut() {
    const out = new Map();
    state.outings.filter((o) => o.status === 'live' && (myAttendance(o.id) || o.visibility === 'public')).forEach((o) => {
      const st = stopsOf(o.id)[o.live.current];
      if (!st) return;
      going(o.id).forEach((a) => { if (a.userId !== meId) out.set(a.userId, { user: userById[a.userId], venueId: st.venueId, eventId: st.eventId || null, outingId: o.id, since: o.live.arrivedAt }); });
    });
    (state.presence || []).forEach((p) => { if (!out.has(p.userId) && p.userId !== meId) out.set(p.userId, { user: userById[p.userId], venueId: p.venueId, eventId: p.eventId, outingId: null, since: p.since }); });
    return [...out.values()].sort((a, b) => b.since - a.since);
  }
  const friendsAt = (venueId) => friendsOut().filter((f) => f.venueId === venueId);
  const friendsAtEvent = (eventId) => friendsOut().filter((f) => f.eventId === eventId);

  // How busy a place is right now (demo model: popularity × distance from its peak hour)
  function activity(venueId) {
    const [pop, peak] = HOP.seed.POP[venueId] || [0.32, 21];
    const d = new Date(HOP.now());
    let h = d.getHours() + d.getMinutes() / 60; if (h < 6) h += 24;
    const friends = friendsAt(venueId);
    const at = (hh) => Math.min(1, pop * Math.exp(-(((hh - peak) / 3.2) ** 2)) * 1.15 + friends.length * 0.03);
    const busy = at(h), soon = at(h + 0.75);
    const trend = soon - busy > 0.04 ? 'rising' : busy - soon > 0.04 ? 'easing' : 'steady';
    const label = HOP.activity ? HOP.activity.level(busy) : 'Quiet';
    const lv = HOP.activity ? HOP.activity.levelIdx(busy) : 0;
    const liveHere = state.outings.filter((o) => o.status === 'live' && (myAttendance(o.id) || o.visibility === 'public') && stopsOf(o.id)[o.live.current]?.venueId === venueId);
    const tonightPhotos = liveHere.flatMap((o) => photosOf(o.id, stopsOf(o.id)[o.live.current].id));
    return { busy, label, lv, trend, hot: busy >= 0.6, onHop: Math.round(busy * 64 + friends.length), friends, liveHere, tonightPhotos };
  }
  // My photos from past nights at this venue
  const memoryPhotosAt = (venueId) => state.stops.filter((s) => s.venueId === venueId && outing(s.outingId)?.status === 'ended' && myAttendance(s.outingId)?.rsvp === 'going')
    .flatMap((s) => photosOf(s.outingId, s.id));

  // ---- mutations ----------------------------------------------------------
  // Activity feeds the outing's updates list, and the meaningful parts also land in the chat as quiet lines
  const SYS_TYPES = new Set(['joined', 'stop', 'moved', 'started', 'ended']);
  function log(o, entry) {
    o.activity = [{ id: uid('ac'), at: HOP.now(), ...entry }, ...(o.activity || [])].slice(0, 80);
    if (SYS_TYPES.has(entry.type)) pushMsg(o.id, { kind: 'system', userId: null, sys: { ...entry } });
  }

  // ---- outing chat ---------------------------------------------------------
  // One temporary group chat per outing, for its attendees. Not a general messenger:
  // it opens with the plan, is busiest on the night, and closes 48 hours after it ends.
  const CHAT_OPEN_AFTER = 48 * 36e5;
  const messagesOf = (outingId) => (state.messages || []).filter((m) => m.outingId === outingId).sort((a, b) => a.at - b.at);
  const canChat = (o) => { const a = myAttendance(o.id); return !!a && a.rsvp !== 'declined'; };
  function chatPhase(o) {
    if (o.status === 'live') return 'during';
    if (o.status !== 'ended') return 'before';
    return HOP.now() - (o.endedAt || o.startsAt) < CHAT_OPEN_AFTER ? 'after' : 'closed';
  }
  const chatClosesAt = (o) => (o.endedAt || o.startsAt) + CHAT_OPEN_AFTER;
  function pushMsg(outingId, m) {
    state.messages ||= [];
    const msg = { id: uid('m'), outingId, at: HOP.now(), reactions: {}, ...m };
    state.messages.push(msg);
    return msg;
  }
  function postMessage(outingId, m, userId = meId) {
    const msg = pushMsg(outingId, { userId, kind: 'text', ...m });
    if (userId === meId) markRead(outingId, true);
    commit('chat:post', { outingId, id: msg.id, userId, kind: msg.kind });
    return msg;
  }
  function react(msgId, emoji, userId = meId) {
    const m = state.messages.find((x) => x.id === msgId);
    const list = (m.reactions[emoji] ||= []);
    const i = list.indexOf(userId);
    if (i >= 0) list.splice(i, 1); else list.push(userId);
    if (!list.length) delete m.reactions[emoji];
    commit('chat:react', { outingId: m.outingId, id: msgId });
  }
  // place cards: "I'm keen" is a lightweight vote; polls: one vote per person
  function keen(msgId, userId = meId) {
    const m = state.messages.find((x) => x.id === msgId);
    m.keen ||= [];
    const i = m.keen.indexOf(userId);
    if (i >= 0) m.keen.splice(i, 1); else m.keen.push(userId);
    commit('chat:react', { outingId: m.outingId, id: msgId });
  }
  function vote(msgId, idx, userId = meId) {
    const m = state.messages.find((x) => x.id === msgId);
    if (m.poll.closed) return;
    m.poll.options.forEach((op, k) => { op.votes = op.votes.filter((u) => u !== userId); if (k === idx) op.votes.push(userId); });
    commit('chat:react', { outingId: m.outingId, id: msgId });
  }
  function closePoll(msgId) {
    const m = state.messages.find((x) => x.id === msgId);
    m.poll.closed = true;
    const win = m.poll.options.slice().sort((a, b) => b.votes.length - a.votes.length)[0];
    pushMsg(m.outingId, { kind: 'system', userId: null, sys: { type: 'poll', count: win.votes.length, venueId: win.venueId } });
    commit('chat:post', { outingId: m.outingId, id: m.id, userId: null, kind: 'system' });
    return win;
  }
  function stopSharing(msgId) {
    const m = state.messages.find((x) => x.id === msgId);
    if (m && m.loc) { m.loc.until = HOP.now(); commit('chat:react', { outingId: m.outingId, id: msgId }); }
  }
  const activeLocations = () => (state.messages || []).filter((m) => m.kind === 'location' && m.loc.until > HOP.now() && m.userId !== meId && canChat(outing(m.outingId) || {}));

  // read state and notification settings are per person
  // ---- saved collections (per person): Want to go, Good pubs, Restaurants… -----------
  function collections() {
    state.collections ||= {};
    if (!state.collections[meId]) {
      const old = (state.saved && state.saved[meId]) || [];
      state.collections[meId] = meId === 'u_ollie' && !old.length ? HOP.seed.collections().u_ollie
        : [['want', 'Want to go'], ['pubs', 'Good pubs'], ['food', 'Restaurants'], ['late', 'Late night'], ['date', 'Date night']].map(([id, name]) => ({ id, name, items: id === 'want' ? old.map((venueId) => ({ venueId })) : [] }));
    }
    return state.collections[meId];
  }
  const refKey = (r) => (r.venueId ? 'v:' + r.venueId : 'e:' + r.eventId);
  const collectionsOf = (ref) => collections().filter((c) => c.items.some((i) => refKey(i) === refKey(ref)));
  const isSaved = (ref) => collectionsOf(ref).length > 0;
  // all saved venue ids, newest first (Saved sections, search)
  const saved = () => [...new Set(collections().flatMap((c) => c.items.filter((i) => i.venueId).map((i) => i.venueId)))];
  const savedEvents = () => [...new Set(collections().flatMap((c) => c.items.filter((i) => i.eventId).map((i) => i.eventId)))];
  function setSaved(ref, colId, on) {
    const c = collections().find((x) => x.id === colId); if (!c) return;
    const i = c.items.findIndex((x) => refKey(x) === refKey(ref));
    if (on && i < 0) c.items.unshift(ref); if (!on && i >= 0) c.items.splice(i, 1);
    commit('saved', ref);
  }
  function toggleSave(venueId) { const ref = { venueId }; const on = !isSaved(ref); if (on) setSaved(ref, 'want', true); else collectionsOf(ref).forEach((c) => setSaved(ref, c.id, false)); return on; }

  // ---- crowd reports (structured, anonymous, decaying) ----------------------------
  const REPORT_KINDS = {
    crowd: { label: 'Crowd', opts: [['quiet', 'Quiet'], ['moderate', 'Moderate'], ['busy', 'Busy'], ['packed', 'Packed']] },
    queue: { label: 'Queue', opts: [['none', 'None'], ['short', 'Short'], ['medium', 'Medium'], ['long', 'Long']] },
    entry: { label: 'Entry', opts: [['free', 'Free'], ['cover', 'Cover']] },
    vibe: { label: 'Music / vibe', opts: [['chatty', 'Chatty'], ['loud', 'Loud'], ['live', 'Live music'], ['dj', 'DJ'], ['dancing', 'Dancing']] },
  };
  // The current read per category: recency-weighted vote, so no single report swings it
  function reportsAt(venueId, t = HOP.now()) {
    const rs = (state.reports || []).filter((r) => r.venueId === venueId && t - r.at < 90 * 6e4 && t >= r.at);
    const out = {};
    Object.keys(REPORT_KINDS).forEach((k) => {
      const l = rs.filter((r) => r.kind === k); if (!l.length) return;
      const tally = {}; l.forEach((r) => { tally[r.value] = (tally[r.value] || 0) + Math.exp(-(t - r.at) / (45 * 6e4)); });
      const value = Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
      out[k] = { value, label: REPORT_KINDS[k].opts.find((x) => x[0] === value)?.[1] || value, n: l.length, last: Math.max(...l.map((r) => r.at)) };
    });
    return out;
  }
  // You can only report where you are: near the venue, or at your outing's current stop
  function canReport(venueId) {
    const v = venueById[venueId]; if (!v) return { ok: false, why: '' };
    const atStop = state.outings.some((o) => o.status === 'live' && myAttendance(o.id)?.rsvp === 'going' && stopsOf(o.id)[o.live.current]?.venueId === venueId);
    const d = HOP.map ? HOP.util.metres(HOP.map.ME, v) : 1e9;
    if (atStop || d <= 600) return { ok: true };
    return { ok: false, why: `Reports come from people there. You’re ${HOP.util.distLabel ? HOP.util.distLabel(d) : Math.round(d) + ' m'} away.` };
  }
  function addReport(venueId, picks) {
    state.reports ||= [];
    const at = HOP.now();
    Object.entries(picks).forEach(([kind, value]) => state.reports.push({ id: uid('rp'), venueId, kind, value, at, userId: meId }));
    state.reports = state.reports.filter((r) => at - r.at < 6 * 36e5);
    commit('report', { venueId });
  }
  const myLastReport = (venueId) => (state.reports || []).filter((r) => r.venueId === venueId && r.userId === meId).sort((a, b) => b.at - a.at)[0];
  // Public photos at a venue tonight (shared publicly; no names attached)
  const venuePhotos = (venueId, t = HOP.now()) => (state.venuePhotos || []).filter((p) => p.venueId === venueId && t - p.takenAt < 8 * 36e5 && p.takenAt <= t).sort((a, b) => b.takenAt - a.takenAt);
  function markRead(outingId, silent) {
    state.reads ||= {};
    (state.reads[meId] ||= {})[outingId] = HOP.now();
    if (!silent) { persist(); emit('chat:read', { outingId }); }
  }
  const lastRead = (outingId) => state.reads?.[meId]?.[outingId] || 0;
  const unread = (outingId) => messagesOf(outingId).filter((m) => m.userId && m.userId !== meId && m.at > lastRead(outingId)).length;
  const lastMessage = (outingId) => messagesOf(outingId).filter((m) => m.kind !== 'system' || m.sys.type === 'photos').pop();
  const chatPref = (outingId) => state.chatPrefs?.[meId]?.[outingId] || (myAttendance(outingId)?.rsvp === 'going' ? 'all' : 'mentions');
  function setChatPref(outingId, v) { state.chatPrefs ||= {}; (state.chatPrefs[meId] ||= {})[outingId] = v; commit('chat:pref', { outingId }); }
  const mentionsMe = (m) => !!m.text && new RegExp('@' + me().first + '\\b', 'i').test(m.text);

  function createOuting({ title, emoji, startsAt, visibility, cover }) {
    const id = uid('o');
    const o = {
      id, title: title.trim() || 'Night out', emoji: emoji || 'party', cover: cover || null, kind: 'night', visibility: visibility || 'private',
      organiserId: meId, status: 'planning', startsAt, createdAt: HOP.now(), live: null, endedAt: null,
      inviteCode: title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) + '-' + Math.random().toString(36).slice(2, 6),
      activity: [],
    };
    state.outings.push(o);
    state.attendees.push({ id: uid('a'), outingId: id, userId: meId, rsvp: 'going', role: 'organiser', invitedBy: meId, respondedAt: HOP.now(), shareLocation: false });
    commit('outing:create', { id });
    return o;
  }
  function updateOuting(id, patch) { Object.assign(outing(id), patch); commit('outing:update', { id }); }
  function deleteOuting(id) {
    state.outings = state.outings.filter((o) => o.id !== id);
    state.stops = state.stops.filter((s) => s.outingId !== id);
    state.attendees = state.attendees.filter((a) => a.outingId !== id);
    state.photos = state.photos.filter((p) => p.outingId !== id);
    state.messages = (state.messages || []).filter((m) => m.outingId !== id);
    commit('outing:delete', { id });
  }

  // at: optional explicit time; then the stop is slotted into the night in time order
  function addStop(outingId, venueId, atTime) {
    const o = outing(outingId);
    const list = stopsOf(outingId);
    if (list.some((s) => s.venueId === venueId && !s.eventId)) return null;
    const last = list[list.length - 1];
    const at = atTime || (last ? last.at + 90 * 6e4 : o.startsAt);
    const s = { id: uid('s'), outingId, venueId, order: list.length, at };
    state.stops.push(s);
    if (atTime) state.stops.filter((x) => x.outingId === outingId).sort((a, b) => a.at - b.at).forEach((x, i) => (x.order = i));
    log(o, { type: 'stop', userId: meId, venueId });
    commit('stop:add', { outingId, id: s.id });
    return s;
  }
  // An event becomes a stop at its own start time, slotted into the night in time order
  function addEventStop(outingId, eventId) {
    const e = HOP.events.byId(eventId);
    if (stopsOf(outingId).some((s) => s.eventId === eventId)) return null;
    const s = { id: uid('s'), outingId, venueId: e.venueId || null, eventId, order: 99, at: e.startsAt };
    state.stops.push(s);
    state.stops.filter((x) => x.outingId === outingId).sort((a, b) => a.at - b.at).forEach((x, i) => (x.order = i));
    const o = outing(outingId);
    if (s.order === 0) o.startsAt = s.at;
    log(o, { type: 'stop', userId: meId, venueId: e.venueId, eventId });
    commit('stop:add', { outingId, id: s.id });
    return s;
  }
  function touch(type, payload) { commit(type, payload); }
  function removeStop(stopId) {
    const s = state.stops.find((x) => x.id === stopId);
    if (!s) return;
    const times = stopsOf(s.outingId).map((x) => x.at);
    state.stops = state.stops.filter((x) => x.id !== stopId);
    stopsOf(s.outingId).forEach((x, i) => { x.order = i; x.at = times[i]; });
    commit('stop:remove', { outingId: s.outingId });
  }
  // Reorder keeps the time slots in place: stop #2 is still "9:30 PM" whichever venue it is
  function reorderStops(outingId, orderedIds) {
    const o0 = outing(outingId);
    const nextBefore = o0.live ? stopsOf(outingId)[o0.live.current + 1]?.id : null;
    const list = stopsOf(outingId);
    const times = list.map((x) => x.at);
    orderedIds.forEach((id, i) => { const s = list.find((x) => x.id === id); s.order = i; s.at = times[i]; });
    const nx = o0.live ? stopsOf(outingId)[o0.live.current + 1] : null;
    if (nx && nx.id !== nextBefore) pushMsg(outingId, { kind: 'system', userId: null, sys: { type: 'next', userId: meId, venueId: nx.venueId, eventId: nx.eventId || null, at: nx.at } });
    commit('stop:reorder', { outingId });
  }
  function setStopTime(stopId, at) {
    const s = state.stops.find((x) => x.id === stopId);
    s.at = at;
    if (s.order === 0) outing(s.outingId).startsAt = at;
    commit('stop:update', { outingId: s.outingId });
  }

  function rsvp(outingId, value, userId = meId) {
    const o = outing(outingId);
    let a = attendeesOf(outingId).find((x) => x.userId === userId);
    if (!a) { a = { id: uid('a'), outingId, userId, role: 'guest', invitedBy: o.organiserId, shareLocation: false }; state.attendees.push(a); }
    const was = a.rsvp;
    a.rsvp = value; a.respondedAt = HOP.now();
    if (was !== value) log(o, { type: value === 'going' ? 'joined' : value, userId });
    commit('rsvp', { outingId, userId, value });
  }
  function invite(outingId, userIds) {
    userIds.forEach((userId) => {
      if (attendeesOf(outingId).some((a) => a.userId === userId)) return;
      state.attendees.push({ id: uid('a'), outingId, userId, rsvp: 'invited', role: 'guest', invitedBy: meId, respondedAt: null, shareLocation: false });
    });
    commit('invite', { outingId, userIds });
  }

  // ---- live ---------------------------------------------------------------
  function startOuting(id) {
    const o = outing(id);
    o.status = 'live';
    o.live = { current: 0, startedAt: HOP.now(), arrivedAt: HOP.now() };
    log(o, { type: 'started', userId: meId });
    commit('live:start', { id });
  }
  function advance(id) {
    const o = outing(id);
    const list = stopsOf(id);
    if (o.live.current >= list.length - 1) return;
    o.live.current += 1; o.live.arrivedAt = HOP.now();
    log(o, { type: 'moved', userId: meId, venueId: list[o.live.current].venueId });
    commit('live:advance', { id });
  }
  function endOuting(id) {
    const o = outing(id);
    o.status = 'ended'; o.endedAt = HOP.now();
    log(o, { type: 'ended', userId: meId });
    commit('live:end', { id });
  }

  // ---- photos -------------------------------------------------------------
  function addPhotos(outingId, items, { userId = meId, visibility = 'outing', source = 'upload', stopId } = {}) {
    const o = outing(outingId);
    const list = stopsOf(outingId);
    const sid = stopId || (o.live ? list[o.live.current]?.id : list[0]?.id);
    const added = items.map((it, i) => ({
      id: uid('p'), outingId, stopId: sid, userId, takenAt: HOP.now() + i, visibility, source,
      ...(typeof it === 'string' ? { src: it } : it),
    }));
    state.photos.push(...added);
    if (visibility === 'outing') {
      log(o, { type: 'photos', userId, count: added.length });
      // one quiet line per burst: "Grace added 6 photos", with a preview that opens the album
      const last = messagesOf(outingId).pop();
      if (last && last.kind === 'system' && last.sys.type === 'photos' && last.sys.userId === userId && HOP.now() - last.at < 10 * 6e4) {
        last.sys.photoIds.push(...added.map((p) => p.id)); last.sys.count += added.length; last.at = HOP.now();
      } else pushMsg(outingId, { kind: 'system', userId: null, sys: { type: 'photos', userId, count: added.length, photoIds: added.map((p) => p.id) } });
    }
    commit('photos:add', { outingId, userId, count: added.length, visibility, ids: added.map((p) => p.id) });
    return added;
  }
  function setPhotoVisibility(photoId, visibility) {
    const p = state.photos.find((x) => x.id === photoId);
    if (p && p.userId === meId) { p.visibility = visibility; commit('photos:update', { outingId: p.outingId }); }
  }

  function duplicate(id, startsAt) {
    const src = outing(id);
    const o = createOuting({ title: src.title, emoji: src.emoji, startsAt, visibility: src.visibility });
    const delta = startsAt - src.startsAt;
    stopsOf(id).forEach((s, i) => state.stops.push({ id: uid('s'), outingId: o.id, venueId: s.venueId, eventId: s.eventId || null, order: i, at: s.at + delta }));
    commit('stop:add', { outingId: o.id });
    return o;
  }

  function reset() { state = fresh(); commit('reset'); }
  function setRealtime(on) { try { localStorage.setItem('hop.realtime', on ? '1' : '0'); localStorage.removeItem(KEY); } catch (e) {} location.reload(); }

  load();

  return {
    get state() { return state; }, get storageOk() { return storageOk; }, TAB,
    venues, venueById, users: HOP.seed.users, userById, me, setMe, get meId() { return meId; },
    on, emit,
    outing, stopsOf, attendeesOf, going, myAttendance, isOrganiser, placeOf, eventOf, stopName, photosOf, myOutings, publicOutings,
    tonightOutings, friendsOut, friendsAt, friendsAtEvent, activity, memoryPhotosAt, addEventStop, touch, setRealtime,
