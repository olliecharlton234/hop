<script>
/* HOP — City activity. Answers one question: where is it busy, now and later?

   Heat(area, time) = Σ weight × signal(area, time), saturated to 0..1, then put into words
   (Quiet · Moderate · Busy · Very busy · Packed). Each signal is a pluggable source, so the scoring
   model can improve without touching the map.

   Privacy rules, enforced here and nowhere else:
   - The map only ever receives AREA-level heat plus PUBLIC points (public events, venues).
     Private outings, their stops, routes and people never reach the heat layer.
   - User-generated signals (anonymous presence, private plans) only count once a bucket
     (area × time window) passes a minimum size. Small groups contribute nothing visible.
   - Seeing friends on the map stays a separate, explicit opt-in (store.friendsOut).

   PROTOTYPE: the anonymous city population (DEMO_*) is simulated. Real friends' outings and
   public events from the demo data also feed in, the same way production data would. */

HOP.activity = (() => {
  const S = () => HOP.store;
  const EV = () => HOP.events;
  const { metres } = HOP.util;

  // Neighbourhoods are the unit of aggregation
  const AREAS = [
    { id: 'cbd', name: 'CBD', lat: -33.8728, lng: 151.2048, r: 900, suburbs: ['CBD', 'Sydney', 'The Rocks'] },
    { id: 'surryhills', name: 'Surry Hills', lat: -33.8845, lng: 151.2108, r: 700, suburbs: ['Surry Hills'] },
    { id: 'darlinghurst', name: 'Darlinghurst', lat: -33.8790, lng: 151.2172, r: 560, suburbs: ['Darlinghurst'] },
    { id: 'newtown', name: 'Newtown', lat: -33.8962, lng: 151.1808, r: 760, suburbs: ['Newtown', 'Enmore'] },
    { id: 'pottspoint', name: 'Potts Point', lat: -33.8727, lng: 151.2238, r: 520, suburbs: ['Potts Point', 'Elizabeth Bay'] },
    { id: 'chippendale', name: 'Chippendale', lat: -33.8878, lng: 151.1980, r: 520, suburbs: ['Chippendale', 'Eveleigh'] },
    { id: 'redfern', name: 'Redfern', lat: -33.8925, lng: 151.2055, r: 520, suburbs: ['Redfern'] },
    { id: 'moorepark', name: 'Moore Park', lat: -33.8925, lng: 151.2250, r: 560, suburbs: ['Moore Park'] },
    { id: 'paddington', name: 'Paddington', lat: -33.8848, lng: 151.2292, r: 600, suburbs: ['Paddington'] },
    { id: 'glebe', name: 'Glebe', lat: -33.8800, lng: 151.1860, r: 520, suburbs: ['Glebe'] },
    { id: 'bondi', name: 'Bondi', lat: -33.8915, lng: 151.2745, r: 720, suburbs: ['Bondi'] },
  ];
  const byId = Object.fromEntries(AREAS.map((a) => [a.id, a]));
  const areaOfSuburb = (sub) => AREAS.find((a) => a.suburbs.includes(sub));
  const areaOfPoint = (p) => AREAS.map((a) => ({ a, d: metres(a, p) })).filter((x) => x.d < x.a.r * 1.6).sort((x, y) => x.d - y.d)[0]?.a || null;
  const areaOfVenue = (v) => areaOfSuburb(v.suburb) || areaOfPoint(v);

  // ---- PROTOTYPE: simulated anonymous population -----------------------------
  // [people at peak on a Friday/Saturday, peak hour (24+ = after midnight), spread in hours, daytime base]
  const DEMO_POP = {
    cbd: [520, 19.5, 2.6, 160], surryhills: [430, 21.5, 2.6, 60], darlinghurst: [380, 23.5, 2.4, 30], newtown: [470, 21.5, 2.8, 90],
    pottspoint: [260, 23, 2.4, 20], chippendale: [180, 20.5, 2.4, 30], redfern: [140, 20.5, 2.4, 25], moorepark: [90, 20, 2, 20],
    paddington: [110, 18, 3, 70], glebe: [120, 19, 3, 60], bondi: [300, 15, 4, 220],
  };
  // groups who've planned something here (anonymous counts, all outings on the platform)
  const DEMO_PLANS = { cbd: 34, surryhills: 41, darlinghurst: 29, newtown: 38, pottspoint: 14, chippendale: 12, redfern: 9, moorepark: 6, paddington: 7, glebe: 6, bondi: 18 };

  // Privacy thresholds: below these, user-generated signals are dropped for that bucket
  const K_PEOPLE = 15;   // anonymous active people in an area
  const K_GROUPS = 3;    // private outings planned in an area within the window

  const hourOf = (t) => { const d = new Date(t); let h = d.getHours() + d.getMinutes() / 60; if (h < 6) h += 24; return h; };
  const dayFactor = (t) => ({ 5: 1, 6: 1.08, 0: 0.72, 4: 0.62 }[new Date(t - 6 * 36e5).getDay()] ?? 0.45);
  const bell = (h, peak, spread) => Math.exp(-(((h - peak) / spread) ** 2));

  // ---- signal sources ----------------------------------------------------------
  // Each returns a value roughly 0..1 for (area, t). Add or swap sources freely.
  const SOURCES = [
    {
      id: 'presence', weight: 0.34, // opted-in people active in the area right now (anonymous count)
      value(a, t, ctx) {
        const [peak, ph, spread, base] = DEMO_POP[a.id] || [60, 21, 2.5, 20];
        let people = (base + (peak - base) * bell(hourOf(t), ph, spread)) * dayFactor(t);
        if (!ctx.isNow) people *= 0.9; // further out = estimate, not observation
        return people < K_PEOPLE ? 0 : Math.min(1, people / 520);
      },
    },
    {
      id: 'planned', weight: 0.22, // outings planned on the platform with a stop here around t
      value(a, t) {
        let groups = 0, people = 0, publicPeople = 0;
        S().state.outings.forEach((o) => {
          if (o.status === 'ended') return;
          const hit = S().stopsOf(o.id).some((s, i, st) => {
            const end = st[i + 1] ? st[i + 1].at : s.at + 2 * 36e5;
            const p = S().placeOf(s);
            return p && t >= s.at - 30 * 6e4 && t < end && areaOfPoint(p)?.id === a.id;
          });
          if (!hit) return;
          const n = S().going(o.id).length;
          if (o.visibility === 'public') publicPeople += n;
          else { groups += 1; people += n; }
        });
        // anonymous plans from everyone else on the platform (simulated)
        const h = hourOf(t);
        const demoGroups = (DEMO_PLANS[a.id] || 4) * bell(h, (DEMO_POP[a.id] || [0, 21])[1], 2.4) * dayFactor(t);
        const totalGroups = groups + demoGroups;
        const privateCounted = totalGroups >= K_GROUPS ? people + demoGroups * 6 : 0;
        return Math.min(1, (privateCounted + publicPeople) / 260);
      },
    },
    {
      id: 'events', weight: 0.2, // public events by scale (interest), active around t
      value(a, t) {
        let v = 0;
        EV().all().forEach((e) => {
          if (t < e.startsAt - 45 * 6e4 || t > e.endsAt) return;
          const p = EV().placeOf(e);
          if (!p || areaOfPoint(p)?.id !== a.id) return;
          v += Math.log10(e.interested + 10) / 3.4; // trivia ≈ .5, 2,300-person gig ≈ 1
        });
        return Math.min(1, v / 2.2);
      },
    },
    {
      id: 'venues', weight: 0.16, // how busy the area's venues usually are at this hour
      value(a, t) {
        const vs = S().venues.filter((v) => areaOfVenue(v)?.id === a.id);
        if (!vs.length) return 0.08;
        const h = hourOf(t);
        const sum = vs.reduce((n, v) => { const [pop, peak] = HOP.seed.POP[v.id] || [0.3, 21]; return n + pop * bell(h, peak, 3.2); }, 0);
        return Math.min(1, (sum / 4) * dayFactor(t));
      },
    },
    {
      id: 'reports', weight: 0.1, // recent crowd reports from people at venues; decays, needs 2+ to count, capped
      value(a, t, ctx) {
        if (!ctx.isNow) return 0;
        const CROWD = { quiet: 0.15, moderate: 0.45, busy: 0.75, packed: 1 };
        const rs = (S().state.reports || []).filter((r) => r.kind === 'crowd' && t - r.at < 90 * 6e4 && t >= r.at)
          .filter((r) => { const v = S().venueById[r.venueId]; return v && areaOfVenue(v)?.id === a.id; });
        if (rs.length < 2) return 0;
        let w = 0, sum = 0;
        rs.forEach((r) => { const k = Math.exp(-(t - r.at) / (45 * 6e4)); w += k; sum += k * (CROWD[r.value] ?? 0.5); });
        return Math.min(1, (sum / w) * Math.min(1, rs.length / 6));
      },
    },
    {
      id: 'recent', weight: 0.08, // photos from outings in the last hour, capped so it can't dominate
      value(a, t, ctx) {
        if (!ctx.isNow) return 0;
        const n = S().state.photos.filter((p) => t - p.takenAt < 36e5 && t >= p.takenAt).filter((p) => {
          const st = S().state.stops.find((s) => s.id === p.stopId); const pl = st && S().placeOf(st);
          return pl && areaOfPoint(pl)?.id === a.id;
        }).length;
        return n < 5 ? 0 : Math.min(1, n / 40);
      },
    },
  ];

  // ---- scoring -------------------------------------------------------------------
  const cache = new Map();
  function score(areaId, t, ctx = {}) {
    const a = byId[areaId];
    const key = `${areaId}|${Math.round(t / 3e5)}|${ctx.isNow ? 1 : 0}|${S().state.photos.length}|${S().state.stops.length}`;
    if (cache.has(key)) return cache.get(key);
    const parts = {};
    let raw = 0;
    SOURCES.forEach((s) => { const v = s.value(a, t, ctx); parts[s.id] = v; raw += s.weight * v; });
    const heat = 1 - Math.exp(-raw * 2.2); // saturate: lots of signals → "very busy", never > 1
    const out = { heat, parts };
    cache.set(key, out);
    if (cache.size > 4000) cache.clear();
    return out;
  }
  // Five levels. The map turns these into colour: blue, green, yellow, orange, red.
  const LEVELS = [[0.25, 'Quiet', 'QUIET'], [0.43, 'Moderate', 'MODERATE'], [0.6, 'Busy', 'BUSY'], [0.76, 'Very busy', 'VERY_BUSY'], [1.01, 'Packed', 'PACKED']];
  const levelCode = (h) => LEVELS.find(([max]) => h < max)[2];
  const meter = (lv) => `<span class="lvm lv${lv}" aria-hidden="true">${[0, 1, 2, 3, 4].map((k) => `<i class="${k <= lv ? 'on' : ''}"></i>`).join('')}</span>`;
  const level = (h) => LEVELS.find(([max]) => h < max)[1];
  const levelIdx = (h) => LEVELS.findIndex(([max]) => h < max);

  // ---- time windows the user can pick ----------------------------------------
  function windowTime(when, now = HOP.now()) {
    const d = new Date(now);
    const at = (dayAdd, h, m = 0) => { const x = new Date(d); x.setDate(x.getDate() + dayAdd); x.setHours(h, m, 0, 0); return x.getTime(); };
    if (when === 'later') return hourOf(now) < 21.5 ? at(0, 22) : now + 90 * 6e4;
    if (when === 'tomorrow') return at(hourOf(now) >= 24 ? 0 : 1, 21, 30);
    if (when === 'weekend') { let k = 0; while (new Date(at(k, 12)).getDay() !== 6) k++; return at(k, 22); }
    return now;
  }
  const WINDOWS = [['now', 'Now'], ['later', 'Later tonight'], ['tomorrow', 'Tomorrow'], ['weekend', 'This weekend']];

  // What an area is like for a window, in words, with the trend and peak
  function areaInfo(areaId, when = 'now') {
    const now = HOP.now();
    const t = windowTime(when, now);
    const isNow = when === 'now';
    const { heat } = score(areaId, t, { isNow });
    // look across the evening containing t to find the peak and the trend
    const base = new Date(t); base.setHours(16, 0, 0, 0);
    if (hourOf(t) >= 24) base.setDate(base.getDate() - 1);
    let peak = { h: 0, heat: 0 };
    for (let k = 0; k <= 22; k++) { const tt = base.getTime() + k * 30 * 6e4; const s = score(areaId, tt).heat; if (s > peak.heat) peak = { t: tt, heat: s }; }
    const ahead = score(areaId, t + 90 * 6e4).heat;
    const late = score(areaId, base.getTime() + 9.5 * 36e5).heat; // 1:30 AM
    const trend = ahead - heat > 0.06 ? 'rising' : heat - ahead > 0.08 ? 'winding down' : 'steady';
    const peakLabel = HOP.util.hm(peak.t);
    let note;
    if (!isNow) note = `Expected ${level(heat).toLowerCase()}`;
    else if (trend === 'rising') note = `Rising · peak around ${peakLabel}`;
    else if (late > 0.6) note = 'Busy until late';
    else if (trend === 'winding down') note = 'Winding down';
    else note = `Peak around ${peakLabel}`;
    // "Expected busy · 8–11pm"
    let span = '';
    for (let k = 0, on = null; k <= 22; k++) {
      const tt = base.getTime() + k * 30 * 6e4; const b = score(areaId, tt).heat >= 0.6;
      if (b && on === null) on = tt;
      if ((!b || k === 22) && on !== null) { span = `${HOP.util.hm(on).replace(/(am|pm)$/, '')}–${HOP.util.hm(tt)}`; break; }
    }
    // peak level over the evening, for "Expected packed · 9–11pm"
    const peakLevel = level(peak.heat);
    return { area: byId[areaId], heat, level: level(heat), code: levelCode(heat), lv: levelIdx(heat), trend, peak: peakLabel, peakLevel, note, span, t, isNow };
  }

  // Why an area is busy, in words, from the strongest signals
  const WHY = { presence: 'lots of people out', planned: 'many nights out planned here', events: 'events on', venues: 'popular venues', reports: 'recent crowd reports', recent: 'photos being taken' };
  function why(areaId, when = 'now') {
    const t = windowTime(when);
    const { parts } = score(areaId, t, { isNow: when === 'now' });
    return SOURCES.map((s) => ({ id: s.id, v: parts[s.id] * s.weight })).filter((x) => x.v > 0.02).sort((a, b) => b.v - a.v).slice(0, 3).map((x) => WHY[x.id]);
  }

  // Things the user is allowed to see in an area for a window (friends: only for now)
  function areaPublic(areaId, when = 'now') {
    const t = windowTime(when);
    const a = byId[areaId];
    const k = EV().dayKey(t);
    const events = EV().upcoming(HOP.now()).filter((e) => { const p = EV().placeOf(e); return p && areaOfPoint(p)?.id === areaId && (when === 'weekend' ? Math.abs(EV().dayKey(e.startsAt) - k) <= 864e5 : EV().dayKey(e.startsAt) === k); });
    const friends = when === 'now' ? S().friendsOut().filter((f) => {
      const p = f.venueId ? S().venueById[f.venueId] : f.eventId && EV().placeOf(EV().byId(f.eventId));
      return p && areaOfPoint(p)?.id === areaId;
    }) : [];
    const venues = S().venues.filter((v) => areaOfVenue(v)?.id === areaId).map((v) => ({ v, act: S().activity(v.id) })).sort((x, y) => y.act.busy - x.act.busy);
    return { events, friends, venues, popular: venues.filter((x) => x.act.hot), area: a };
  }

  // ---- Cells: what the map consumes --------------------------------------------
  // A regular grid (~220 m). Each cell: { cell, lat, lng, intensity 0..1, level, confidence, timeWindow }.
  // Built from area scores (smoothed) + public points. Swap in H3 cells later without touching the map.
  const GRID = { lat0: -33.925, lat1: -33.845, lng0: 151.155, lng1: 151.300, step: 0.002 };
  const cellCache = new Map();
  function cells(when = 'now') {
    const t = windowTime(when);
    const key = `${when}|${Math.round(t / 3e5)}|${(S().state.reports || []).length}|${S().state.stops.length}|${S().state.photos.length}`;
    if (cellCache.has(key)) return cellCache.get(key);
    const isNow = when === 'now';
    const areas = AREAS.map((a) => ({ a, h: score(a.id, t, { isNow }).heat }));
    const pts = field(when).filter((p) => !p.area);
    const out = [];
    const ny = Math.round((GRID.lat1 - GRID.lat0) / GRID.step), nx = Math.round((GRID.lng1 - GRID.lng0) / GRID.step);
    for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
      const lat = GRID.lat0 + j * GRID.step, lng = GRID.lng0 + i * GRID.step;
      let v = 0, wsum = 0;
      areas.forEach(({ a, h }) => {
        const d = metres(a, { lat, lng }) / (a.r * 1.15);
        if (d > 2.6) return;
        const w = Math.exp(-d * d);
        v = Math.max(v, h * w); wsum += w;
      });
      pts.forEach((p) => { const d = metres(p, { lat, lng }) / p.r; if (d < 2.2) v = Math.min(1, v + p.w * 0.22 * Math.exp(-d * d)); });
      if (v < 0.06) continue;
      out.push({ cell: `${j}:${i}`, lat, lng, intensity: v, level: levelCode(v), confidence: Math.min(1, wsum) * (isNow ? 1 : 0.7), timeWindow: when });
    }
    const res = { grid: GRID, nx, ny, cells: out, byKey: Object.fromEntries(out.map((c) => [c.cell, c.intensity])), forecast: !isNow };
    cellCache.clear(); cellCache.set(key, res);
    return res;
  }
  // Which area did the user tap? Only areas with something going on.
  function areaAt(p, when = 'now') {
    const t = windowTime(when);
    return AREAS.map((a) => ({ a, d: metres(a, p) / a.r, h: score(a.id, t, { isNow: when === 'now' }).heat })).filter((x) => x.d < 1.4 && x.h >= 0.25).sort((x, y) => x.d - y.d)[0]?.a || null;
  }

  // The map's view of activity: smoothed, area-level heat plus public points only
  function field(when = 'now') {
    const t = windowTime(when);
    const isNow = when === 'now';
    const pts = [];
    AREAS.forEach((a) => {
      const { heat } = score(a.id, t, { isNow });
      if (heat < 0.22) return;
      pts.push({ lat: a.lat, lng: a.lng, r: a.r * 1.25, w: heat, area: a.id });
    });
    EV().all().forEach((e) => {
      if (t < e.startsAt - 45 * 6e4 || t > e.endsAt) return;
      const p = EV().placeOf(e);
      if (p) pts.push({ lat: p.lat, lng: p.lng, r: 160 + Math.log10(e.interested + 10) * 90, w: Math.min(0.85, Math.log10(e.interested + 10) / 3.6) });
    });
    S().venues.forEach((v) => {
      const [pop, peak] = HOP.seed.POP[v.id] || [0.3, 21];
      const b = pop * bell(hourOf(t), peak, 3.2) * dayFactor(t);
      if (b > 0.3) pts.push({ lat: v.lat, lng: v.lng, r: 150, w: b * 0.7 });
    });
    return pts;
  }

  // "Newtown expected busy around 9:30pm" — context while planning, never a recommendation
  function levelAt(areaId, t) { const h = score(areaId, t, { isNow: Math.abs(t - HOP.now()) < 15 * 6e4 }).heat; return { heat: h, level: level(h), code: levelCode(h), lv: levelIdx(h) }; }
  return { cells, areaAt, why, meter, LEVELS, levelCode, levelIdx, levelAt, AREAS, byId, WINDOWS, areaOfPoint, areaOfVenue, score, areaInfo, areaPublic, field, level, windowTime, SOURCES, K_PEOPLE, K_GROUPS };
})();

<script>
/* HOP — the map. Leaflet + Esri Dark Gray tiles (no API key), with a hand-drawn vector fallback
   (main streets, parks, harbour) so the map still reads offline or when tiles are blocked. */

HOP.map = (() => {
  const { esc, metres, timeShort, photoTag, avatar, hm } = HOP.util;
  const S = () => HOP.store;
  const EV = () => HOP.events;
  let map, venueLayer, routeLayer, extraLayer, meMarker, eventLayer, friendLayer, clusterLayer, popLayer, mapEl;
  let onEvent = () => {};
  let mode = 'default';          // default | events | focus | pick
  let eventList = null;          // events shown in What's on mode
  let insets = { top: 120, bottom: 220, left: 0, right: 0 };
  let onVenue = () => {}, onOuting = () => {}, onBlank = () => {};
  let filter = 'all';
  let hiddenVenues = new Set();
  let pinnedVenues = new Set();
  let selected = null;
  const markers = {};
  const ME = { lat: -33.8846, lng: 151.2116 }; // demo location: Surry Hills

  const glyph = {
    pub: '<path d="M7 5h9v13a2 2 0 01-2 2H9a2 2 0 01-2-2zM16 8h1.5a2 2 0 012 2v3a2 2 0 01-2 2H16M7 9h9"/>',
    bar: '<path d="M5 5h14l-7 8zM12 13v6M8.5 19.5h7"/>',
    club: '<path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 12h-.5"/>',
    food: '<path d="M7 4v7a2 2 0 002 2v7M11 4v7M9 4v5M16 20V4c-2 1.5-2.5 4-2.5 7H16"/>',
    gig: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
    spot: '<path d="M12 4l2.3 5 5.2.5-4 3.5 1.2 5.2L12 15.5 7.3 18.2l1.2-5.2-4-3.5 5.2-.5z"/>',
  };
  const catSvg = (cat) => `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${glyph[cat] || glyph.spot}</svg>`;

  function init(el) {
    map = L.map(el, { zoomControl: false, attributionControl: true, minZoom: 11, maxZoom: 19, zoomSnap: 0.25, tap: true, worldCopyJump: false })
      .setView([-33.8815, 151.2125], 15.25);
    map.attributionControl.setPrefix(false);
    map.createPane('base'); map.getPane('base').style.zIndex = 250;
    map.createPane('route'); map.getPane('route').style.zIndex = 640;

    // Esri Dark Gray Canvas: free to use without an API key (CARTO's basemaps now need one)
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    const tiles = L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 16, maxZoom: 19, attribution: 'Esri, HERE, Garmin, © OpenStreetMap contributors',
    }).addTo(map);
    map.createPane('labels'); map.getPane('labels').style.zIndex = 300; map.getPane('labels').style.pointerEvents = 'none';
    L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { pane: 'labels', maxNativeZoom: 16, maxZoom: 19 }).addTo(map);
    let loaded = 0, failed = 0;
    tiles.on('tileload', () => { loaded++; document.body.classList.remove('no-tiles'); });
    tiles.on('tileerror', () => { failed++; if (!loaded && failed > 3) fallback(); });
    setTimeout(() => { if (!loaded) fallback(); }, 3500);

    map.createPane('people'); map.getPane('people').style.zIndex = 630;
    map.createPane('heat'); map.getPane('heat').style.zIndex = 280; map.getPane('heat').style.pointerEvents = 'none';
    map.createPane('pops'); map.getPane('pops').style.zIndex = 660; map.getPane('pops').style.pointerEvents = 'none';
    clusterLayer = L.layerGroup().addTo(map);

  // ---- Venues --------------------------------------------------------------
  // One pin, several states: popular tonight (warm ring), friends here (avatar), event tonight
  // (diamond badge), photos tonight (thumbnail), plus a status line when zoomed in.
  function venueHtml(v) {
    const act = S().activity(v.id);
    const evs = EV().tonightAt(v.id);
    const ph = act.tonightPhotos[act.tonightPhotos.length - 1];
    const f = act.friends;
    const stateful = act.hot || f.length || evs.length || ph;
    const status = [
      act.hot || f.length ? act.label : '',
      f.length ? `${f.length} ${f.length === 1 ? 'friend' : 'friends'}` : '',
      evs[0] ? `${evs[0].title.length > 22 ? EV().CATS[evs[0].cat].label : evs[0].title} ${hm(evs[0].startsAt)}` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="vpin c-${v.cat} lv${act.lv}${act.hot ? ' hot' : ''}${stateful ? ' st' : ' plain'}" data-v="${v.id}">
      <span class="core">${catSvg(v.cat)}</span>
      ${f.length ? `<span class="vf">${avatar(f[0].user, 20)}${f.length > 1 ? `<b>+${f.length - 1}</b>` : ''}</span>` : ''}
      ${evs.length ? '<i class="vev"></i>' : ''}
      ${ph ? `<i class="vph">${photoTag(ph, 60)}</i>` : ''}
      <span class="vlabel"><b>${esc(v.name)}</b>${status ? `<em>${esc(status)}</em>` : ''}</span></div>`;
  }
  function drawVenues() {
    venueLayer.clearLayers();
    S().venues.forEach((v) => {
      const m = L.marker([v.lat, v.lng], {
        icon: L.divIcon({ className: '', html: venueHtml(v), iconSize: [28, 28], iconAnchor: [14, 14] }),
        riseOnHover: true, keyboard: true, title: v.name,
      });
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); onVenue(v.id); });
      markers[v.id] = m;
    });
    applyVenueFilter();
  }
  function refreshVenues() {
    S().venues.forEach((v) => {
      const m = markers[v.id];
      const html = venueHtml(v);
      if (m && m._html !== html) { m._html = html; m.setIcon(L.divIcon({ className: '', html, iconSize: [28, 28], iconAnchor: [14, 14] })); }
    });
    setSelected(selected);
  }
  // Map lens: TONIGHT (everything) / FRIENDS / PLACES / EVENTS (the What's on screen)
  let lens = 'tonight', lensSub = null;
  function setLens(l, sub) {
    lens = l; lensSub = sub || null;
    ['tonight', 'friends', 'places'].forEach((k) => mapEl.classList.toggle('lens-' + k, k === l));
    ['out', 'outings', 'recent'].forEach((k) => mapEl.classList.toggle('sub-' + k, l === 'friends' && k === lensSub));
    filter = l === 'places' ? lensSub || 'all' : 'all';
    applyVenueFilter(); setTimeout(declutter, 30);
  }
  const isLate = (v) => /till ([1-5])\s?am/i.test(v.hours) || (HOP.seed.POP[v.id]?.[1] || 0) >= 23 || v.cat === 'club';
  const catOk = (v) => filter === 'all' || v.cat === filter || (filter === 'bar' && v.cat === 'gig') || (filter === 'late' && isLate(v));
  function lensOk(v) {
    if (lens !== 'friends' || mode !== 'default') return true;
    const a = S().activity(v.id);
    return lensSub === 'recent' ? a.tonightPhotos.length > 0 : a.friends.length > 0;
  }
  function applyVenueFilter() {
    S().venues.forEach((v) => {
      const show = !hiddenVenues.has(v.id) && !pinnedVenues.has(v.id) && !friendVenues.has(v.id) && catOk(v) && lensOk(v);
      const m = markers[v.id];
      if (show && !venueLayer.hasLayer(m)) venueLayer.addLayer(m);
      if (!show && venueLayer.hasLayer(m)) venueLayer.removeLayer(m);
    });
    setSelected(selected);
  }
  function setFilter(f) { filter = f; applyVenueFilter(); }
  function setSelected(id) {
    selected = id;
    document.querySelectorAll('.vpin.on,.evpin.on').forEach((n) => n.classList.remove('on'));
    if (id) { const n = document.querySelector(`.vpin[data-v="${id}"],.evpin[data-e="${id}"]`); if (n) n.classList.add('on'); }
  }

  // ---- Public events --------------------------------------------------------
  // Events at a venue show as a badge on that venue; events in parks/streets get their own diamond.
  // In What's on mode every listed event gets a diamond and venues step back.
  function drawEvents() {
    if (!eventLayer) return;
    const next = L.layerGroup();
    const now = HOP.now();
    const list = mode === 'events' && eventList ? eventList
      : mode === 'focus' ? [] : EV().filter({ when: 'tonight' });
    const seen = {};
    list.forEach((e) => {
      const p = EV().placeOf(e);
      if (!p) return;
      const k = `${p.lat},${p.lng}`; const n = (seen[k] = (seen[k] || 0) + 1) - 1; // fan out events sharing a spot
      const lat = p.lat + (mode === 'events' && e.venueId ? 0.00018 : 0) - n * 0.00028;
      const on = EV().live(e, now);
      const mins = Math.round((e.startsAt - now) / 6e4);
      const when = on ? 'On now' : mins <= 90 ? `Starts in ${mins < 60 ? mins + 'm' : '1h ' + (mins - 60) + 'm'}` : hm(e.startsAt);
      const major = e.interested >= 100 ? ' major' : '';
      const atv = e.venueId && mode !== 'events' ? ' atvenue' : '';
      const html = `<div class="evpin${on ? ' now' : ''}${major}${atv}" data-e="${e.id}"><span class="d">${EV().svg(e.cat, 12)}</span>
        <span class="elabel"><b>${esc(e.title)}</b><em data-live="ev-${e.id}">${when} · ${esc(e.priceLabel)}</em></span></div>`;
      const m = L.marker([lat, p.lng], { pane: 'people', icon: L.divIcon({ className: '', html, iconSize: [24, 24], iconAnchor: [12, 12] }), title: e.title, zIndexOffset: 200 });
      m.on('click', (ev) => { L.DomEvent.stopPropagation(ev); onEvent(e.id); });
      m.addTo(next);
    });
    applyVenueFilter();
    setTimeout(declutter, 30);
    eventLayer = swapLayer(eventLayer, next);
  }


  // ---- Friends' outings + suburb clusters ------------------------------------
  function drawFriendOutings() {
    const next = L.layerGroup();
    const mine = new Set(S().myOutings().live.concat(S().myOutings().upcoming).filter((o) => S().myAttendance(o.id)?.rsvp === 'going').map((o) => o.id));
    const list = S().tonightOutings().filter((o) => !mine.has(o.id));
    const hidden = new Set();
    list.forEach((o) => {
      const st = S().stopsOf(o.id);
      const s = o.status === 'live' ? st[o.live.current] : st[0];
      if (!s) return;
      const p = S().placeOf(s);
      if (s.venueId) hidden.add(s.venueId);
      const host = S().userById[o.organiserId];
      const n = S().going(o.id).length;
      const live = o.status === 'live';
      const sub = live ? `LIVE · ${p.name} · ${n} there` : `${hm(o.startsAt)} · ${p.name} · ${n} going`;
      const html = `<div class="fpin${live ? ' live' : ''}${o.visibility === 'public' && !S().myAttendance(o.id) ? ' pub' : ''}">${avatar(host, 32)}<span class="oe">${HOP.oicon(o)}</span>
        <span class="flabel"><b>${esc(host.first)}’s ${esc(o.title.replace(/^.*?'s /, ''))}</b><em>${esc(sub)}</em></span></div>`;
      const m = L.marker([p.lat, p.lng], { pane: 'people', icon: L.divIcon({ className: '', html, iconSize: [36, 36], iconAnchor: [18, 18] }), title: o.title, zIndexOffset: 800 });
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); onOuting(o.id); });
      m.addTo(next);
    });
    friendVenues = hidden;
    friendLayer = swapLayer(friendLayer, next);
  }

  let friendVenues = new Set();

  // Rebuild a layer only when what it shows actually changed, so taps never land on a
  // marker that's being replaced and nothing flickers while the night updates.
  function swapLayer(old, next) {
    const sig = (g) => g ? g.getLayers().map((l) => (l.options.icon?.options.html || '') + (l.getLatLng ? l.getLatLng().toString() : '')).join('|') : null;
    if (old && sig(old) === sig(next)) return old;
    if (old) map.removeLayer(old);
    return next.addTo(map);
  }

  // ---- Neighbourhood energy ---------------------------------------------------

  let heatWhen = 'now', onArea = () => {};

    const next = L.layerGroup();
    HOP.activity.AREAS.forEach((a) => {

        ${bits ? `<span class="ai">${fr.length ? `<span class="stack">${fr.slice(0, 3).map((f) => avatar(f.user, 16)).join('')}</span>` : ''}<span data-live="areab-${a.id}">${bits}</span></span>` : ''}</button>`;
      const m = L.marker([a.lat, a.lng], { pane: 'people', icon: L.divIcon({ className: '', html, iconSize: [10, 10], iconAnchor: [5, 5] }), keyboard: true, title: a.name, zIndexOffset: -200 });
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); onArea(a.id); });

  // Friends grouped by place: "Jack + 4" with faces. Only friends who share or are on an outing you can see.
  let chipLayer = null;
  function drawFriendChips() {
    if (!chipLayer) chipLayer = L.layerGroup().addTo(map);
    const next = L.layerGroup();
    const groups = {};
    S().friendsOut().forEach((f) => { const k = f.venueId || 'e:' + f.eventId; (groups[k] ||= []).push(f); });
    Object.entries(groups).forEach(([k, fs]) => {
      if (friendVenues.has(k)) return; // a friend's outing marker already shows this group
      const p = k.startsWith('e:') ? EV().placeOf(EV().byId(k.slice(2))) : S().venueById[k];
      if (!p) return;
      fs.sort((a, b) => a.since - b.since);
      const lead = fs[0].user;
      const html = `<button class="fchip" data-k="${k}" data-n="${fs.length}">${`<span class="stack">${fs.slice(0, 3).map((f) => avatar(f.user, 22)).join('')}</span>`}<span><b>${esc(lead.first)}${fs.length > 1 ? ` + ${fs.length - 1}` : ''}</b><em>${esc(p.name)}</em></span></button>`;
      const m = L.marker([p.lat, p.lng], { pane: 'people', icon: L.divIcon({ className: '', html, iconSize: [10, 10], iconAnchor: [5, 5] }), title: `${lead.first} and friends` , zIndexOffset: 300 });
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); if (!k.startsWith('e:')) onVenue(k); else onEvent(k.slice(2)); });

  // ---- Activity heat --------------------------------------------------------------
  // Area-level heat + public points only (see activity.js for the privacy rules).
  // Drawn under the street labels so it reads as part of the map, not a layer on top of it.
  let heatOn = true;
  try { heatOn = localStorage.getItem('hop.heat') !== '0'; } catch (e) {}
  const Heat = L.Layer.extend({
    onAdd(m) {
      this._c = L.DomUtil.create('canvas', 'heatcanvas', m.getPane('heat'));
      this._off = document.createElement('canvas');
      m.on('moveend zoomend resize', this.draw, this);
      this.draw();
    },
    onRemove(m) { m.off('moveend zoomend resize', this.draw, this); this._c.remove(); },
    // Semantic ramp: blue/cyan quiet -> green -> yellow -> orange -> red packed.
    // Bilinear-sampled from HOP.activity.cells(); nothing is drawn where there's no data.
    draw() {
      const m = this._map; if (!m) return;
      const size = m.getSize(), k = 0.25;
      const w = Math.max(1, Math.round(size.x * k)), h = Math.max(1, Math.round(size.y * k));
      const off = this._off; off.width = w; off.height = h;
      const ctx = off.getContext('2d');
      const res = HOP.activity.cells(heatWhen), G = res.grid, by = res.byKey;
      const nw = m.containerPointToLatLng([0, 0]), se = m.containerPointToLatLng([size.x, size.y]);
      const img = ctx.createImageData(w, h), d = img.data;
      const soft = res.forecast ? 0.72 : 1;
      const val = (j, i) => by[j + ':' + i] || 0;
      for (let y = 0; y < h; y++) {
        const lat = nw.lat + (se.lat - nw.lat) * ((y + 0.5) / h);
        const fj = (lat - G.lat0) / G.step; if (fj < 0 || fj >= res.ny) continue;
        const j = Math.floor(fj), dj = fj - j;
        for (let x = 0; x < w; x++) {
          const lng = nw.lng + (se.lng - nw.lng) * ((x + 0.5) / w);
          const fi = (lng - G.lng0) / G.step; if (fi < 0 || fi >= res.nx) continue;
          const i = Math.floor(fi), di = fi - i;
          const v = (val(j, i) * (1 - di) + val(j, i + 1) * di) * (1 - dj) + (val(j + 1, i) * (1 - di) + val(j + 1, i + 1) * di) * dj;
          if (v < 0.08) continue;
          const [r, g, b] = ramp(v);
          const o = (y * w + x) * 4;
          d[o] = r; d[o + 1] = g; d[o + 2] = b;
          // quiet is a faint wash; packed is clearly there but never opaque
          d[o + 3] = Math.min(1, (v - 0.08) / 0.12) * (0.05 + 0.4 * Math.min(1, v) ** 1.5) * soft * 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const c = this._c; c.width = size.x; c.height = size.y;
      c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
      L.DomUtil.setPosition(c, m.containerPointToLayerPoint([0, 0]));
      const cx = c.getContext('2d'); cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; cx.drawImage(off, 0, 0, size.x, size.y);
    },
  });
  // Level colours (match --lv0..--lv4 in the CSS)
  const RAMP = [[0.0, [63, 150, 232]], [0.25, [63, 182, 232]], [0.43, [62, 207, 142]], [0.6, [242, 210, 75]], [0.76, [255, 143, 46]], [0.92, [255, 68, 56]]];
  function ramp(v) {
    for (let n = 1; n < RAMP.length; n++) {
      if (v <= RAMP[n][0]) { const [a, ca] = RAMP[n - 1], [b, cb] = RAMP[n]; const t = (v - a) / (b - a); return [0, 1, 2].map((q) => ca[q] + (cb[q] - ca[q]) * t); }
    }

        html = `<div class="spin ${mode === 'home' ? 'mini' : ''}"><b class="n">${i + 1}</b>${mode === 'home' && i > 0 && i < stops.length - 1 ? '' : label}</div>`;
        if (mode === 'home') { size = [22, 22]; anchor = [11, 11]; }
      }
      const mk = L.marker([p.lat, p.lng], { pane: 'route', icon: L.divIcon({ className: '', html, iconSize: size, iconAnchor: anchor }), keyboard: true, title: p.name, zIndexOffset: 1000 - i });
      mk.on('click', (e) => { L.DomEvent.stopPropagation(e); if (mode === 'home') onOuting(outingId); else if (s.venueId) onVenue(s.venueId, { stopId: s.id }); });

  }

  // Hide stop labels that would overlap an earlier one (stop order wins)
  function declutter() {
    const kept = [];
    // visual priority: your route → friends' outings → busiest neighbourhoods → friend groups → events
    const q = (sel) => [...document.querySelectorAll(sel)];
    const areas = q('.leaflet-pane .area').sort((a, b) => (+b.dataset.heat || 0) - (+a.dataset.heat || 0));
    const chips = q('.leaflet-pane .fchip').sort((a, b) => (+b.dataset.n || 0) - (+a.dataset.n || 0));
    [...q('.leaflet-pane .slabel'), ...areas.filter((x) => +x.dataset.heat >= 0.5), ...q('.leaflet-pane .fpin > .av'), ...q('.leaflet-pane .flabel'), ...areas.filter((x) => +x.dataset.heat < 0.5), ...chips, ...q('.leaflet-pane .elabel')].forEach((el) => {

      if (!s) return;
      const p = S().placeOf(s);
      const html = `<div class="opin ${o.visibility}"><span class="e">${HOP.oicon(o)}</span><span class="t"><b>${esc(o.title)}</b><em>${HOP.util.dayDate(o.startsAt).split(' ')[0]} ${timeShort(o.startsAt)}</em></span></div>`;
      const m = L.marker([p.lat, p.lng], { pane: 'route', icon: L.divIcon({ className: '', html, iconSize: [34, 34], iconAnchor: [17, 40] }), zIndexOffset: 500 });

  // ---- Camera --------------------------------------------------------------

})();

<script>
/* HOP — UI primitives: bottom sheet, top bar, full-screen layers, modal sheets, banners,
   and click delegation (data-act="name" → HOP.actions.name). */

HOP.actions = {};

HOP.ui = (() => {
  const $ = (s, el = document) => el.querySelector(s);
  const app = $('#app'), sheet = $('#sheet'), body = $('#sheetBody'), top = $('#top');
  const wide = () => window.matchMedia('(min-width: 900px)').matches;

  // ---------------- sheet ----------------
  let sizes = ['auto'], sizeIdx = 0, onSize = null;
  function heightFor(size) {
    const avail = app.clientHeight - (document.body.classList.contains('hide-nav') ? 0 : $('#nav').offsetHeight);
    const max = avail - (wide() ? 40 + (top.offsetHeight || 0) : 24 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--safe-t')) || 0));
    const kids = body.children;
    const last = kids[kids.length - 1];
    const content = kids.length ? last.offsetTop + last.offsetHeight - kids[0].offsetTop + (wide() ? 32 : 40) : 0;
    if (size === 'none') return 0;
    if (size === 'full') return max;
    if (size === 'tall') return Math.min(max, Math.round(avail * (wide() ? 0.86 : 0.72)));
    if (size === 'half') return Math.min(max, Math.round(avail * (wide() ? 0.62 : 0.5)));
    if (size === 'peek') {
      const pe = body.querySelector('.peek-end');
      return Math.min(max, pe && kids.length ? pe.offsetTop - kids[0].offsetTop + (wide() ? 32 : 30) : Math.min(content, 168));
    }
    return Math.min(content, Math.round(avail * (wide() ? 0.9 : 0.62))); // auto
  }
  function applySize(animate = true) {
    const size = sizes[sizeIdx];
    sheet.dataset.size = size;
    if (size === 'none') { setSheetH(0); return; }
    if (!animate) sheet.classList.add('dragging');
    const h = heightFor(size);
    sheet.style.height = h + 'px';
    setSheetH(h);
    if (!animate) requestAnimationFrame(() => sheet.classList.remove('dragging'));
  }
  function setSheetH(h) {
    app.style.setProperty('--sheet-h', (wide() ? 0 : h) + 'px');
    app.style.setProperty('--top-h', top.offsetHeight + 'px');
    const navH = document.body.classList.contains('hide-nav') ? 0 : $('#nav').offsetHeight;
    const topH = top.childElementCount ? top.offsetHeight + 10 : 0;
    if (wide()) HOP.map.setInsets({ top: 20, bottom: 0, left: h ? 424 : 0 });
    else HOP.map.setInsets({ top: topH + 10, bottom: h + navH, left: 0 });
    if (onSize) onSize(sizes[sizeIdx], h);
  }
  function setSheet(html, opts = {}) {
    const keepScroll = opts.keepScroll ? body.scrollTop : 0;
    body.innerHTML = html;
    body.scrollTop = keepScroll;
    if (opts.sizes) { sizes = opts.sizes; sizeIdx = Math.min(opts.sizeIdx ?? 0, sizes.length - 1); }
    onSize = opts.onSize || onSize;
    applySize(!opts.instant);
  }
  function resizeSheet(idx) { sizeIdx = typeof idx === 'string' ? Math.max(0, sizes.indexOf(idx)) : idx; applySize(); }
  const currentSize = () => sizes[sizeIdx];

  // drag to resize
  let drag = null;
  sheet.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('[data-drag]');
    if (!handle || wide() || e.target.closest('button:not([data-drag]),input,a')) return;
    drag = { y: e.clientY, h: sheet.offsetHeight, moved: false, id: e.pointerId };
    sheet.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 4) drag.moved = true;
    sheet.style.height = Math.max(60, drag.h - dy) + 'px';
  });
  const endDrag = (e) => {
    if (!drag) return;
    sheet.classList.remove('dragging');
    const dy = e.clientY - drag.y;
    if (!drag.moved) sizeIdx = (sizeIdx + 1) % sizes.length; // tap cycles
    else if (dy < -40) sizeIdx = Math.min(sizes.length - 1, sizeIdx + 1);
    else if (dy > 40) sizeIdx = Math.max(0, sizeIdx - 1);
    drag = null;
    applySize();
  };
  sheet.addEventListener('pointerup', endDrag);
  sheet.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', () => applySize(false));

  // ---------------- top bar ----------------
  function setTop(html) { top.innerHTML = html || ''; app.style.setProperty('--top-h', top.offsetHeight + 'px'); }

  // ---------------- layers (full screen) ----------------
  const layers = $('#layers');
  const stack = [];
  function openLayer(html, cls = '', onClose) {
    const el = document.createElement('section');
    el.className = 'layer ' + cls;
    el.innerHTML = html;
    layers.appendChild(el);
    stack.push({ el, onClose });
    return el;
  }
  function closeLayer() {
    const l = stack.pop();
    if (!l) return false;
    l.el.remove();
    if (l.onClose) l.onClose();
    return true;
  }
  const topLayer = () => stack[stack.length - 1]?.el;
  const closeAllLayers = () => { while (stack.length) closeLayer(); };

  // ---------------- modal sheet ----------------
  const modal = $('#modal');
  let modalClose = null;
  function openModal(html, onClose) {
    modal.innerHTML = `<div class="scrim" data-act="closeModal"><div class="msheet" role="dialog" aria-modal="true">${html}</div></div>`;
    modalClose = onClose;
    return modal.querySelector('.msheet');
  }
  function closeModal() { modal.innerHTML = ''; if (modalClose) { const f = modalClose; modalClose = null; f(); } }
  const modalOpen = () => !!modal.firstChild;

  // ---------------- banners ----------------
  const banners = $('#banners');
  function banner({ lead = '', title, text = '', act = '', data = {}, timeout = 4200 }) {
    const b = document.createElement('button');
    b.className = 'banner';
    if (act) { b.dataset.act = act; Object.entries(data).forEach(([k, v]) => (b.dataset[k] = v)); }
    b.innerHTML = `${lead}<div class="grow"><b>${title}</b>${text ? `<span>${text}</span>` : ''}</div>`;
    banners.prepend(b);
    while (banners.children.length > 3) banners.lastChild.remove();
    setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 260); }, timeout);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  }
  function toast(text) {
    const b = document.createElement('div');
    b.className = 'banner toast';
    b.innerHTML = `<b>${text}</b>`;
    let host = document.getElementById('toasts');
    if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.setAttribute('aria-live', 'polite'); app.appendChild(host); }
    host.innerHTML = '';
    host.appendChild(b);
    setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 260); }, 2200);
  }

  // ---------------- delegation ----------------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act],[data-go]');
    if (!el) return;
    if (el.dataset.act === 'closeModal' && e.target !== el) return; // only scrim itself closes
    if (el.dataset.go) { e.preventDefault(); HOP.app.go(el.dataset.go, { ...el.dataset }); return; }
    const fn = HOP.actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
  });
  HOP.actions.closeModal = () => closeModal();
  HOP.actions.closeLayer = () => closeLayer();

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove(); return ok;
    }
  }

  return { setSheet, resizeSheet, currentSize, applySize, setTop, openLayer, closeLayer, topLayer, closeAllLayers, openModal, closeModal, modalOpen, banner, toast, copy, wide, $ };
})();

  const recentSearches = () => { try { return JSON.parse(localStorage.getItem(RKEY) || '[]'); } catch (e) { return []; } };
  function rememberSearch() {
    const q = query.trim(); if (q.length < 2) return;
    try { localStorage.setItem(RKEY, JSON.stringify([q, ...recentSearches().filter((x) => x.toLowerCase() !== q.toLowerCase())].slice(0, 5))); } catch (e) {}
  }
  HOP.actions.recentSearch = (d) => { query = d.q; const q = document.getElementById('q'); if (q) { q.value = d.q; } const r = document.getElementById('results'); if (r) r.innerHTML = results(); };
  const sec = (title, body, more = '') => (body ? `<p class="label sublabel"><span>${title}</span>${more}</p>${body}` : '');
  function discovery() {
    const now = HOP.now();
    const A = HOP.activity;
    const popular = S.venues.filter((v) => v.cat !== 'spot').map((v) => ({ v, a: S.activity(v.id) })).filter((x) => x.a.hot).sort((x, y) => y.a.busy - x.a.busy).slice(0, 4);
    const busy = A.AREAS.map((a) => A.areaInfo(a.id, 'now')).filter((x) => x.lv >= 2).sort((x, y) => y.heat - x.heat).slice(0, 3);
    const soon = HOP.events.filter({ when: 'tonight' }).filter((e) => e.endsAt > now).sort((x, y) => Math.max(x.startsAt, now) - Math.max(y.startsAt, now)).slice(0, 3);
    const withFriends = S.venues.map((v) => ({ v, n: S.activity(v.id).friends.length })).filter((x) => x.n).sort((x, y) => y.n - x.n).slice(0, 3);
    const saved = S.saved().slice(0, 4);
    const rec = recentSearches();
    return [
      rec.length ? `<div class="recents">${rec.map((r) => `<button data-act="recentSearch" data-q="${esc(r)}">${I('clock', 13)} ${esc(r)}</button>`).join('')}</div>` : '',
      sec('Popular tonight', popular.map(({ v }) => venueRow(v)).join('')),
      sec('Busy areas', busy.map((x) => `<button class="row" data-act="openArea" data-id="${x.area.id}"><span class="iconbtn lvbox lv${x.lv}">${A.meter(x.lv)}</span><div class="grow"><div class="t">${esc(x.area.name)}</div><div class="s"><span class="lvw lv${x.lv}">${x.level}</span> · ${esc(x.note)}</div></div>${I('chev')}</button>`).join('')),
      sec('Events starting soon', soon.map((e) => HOP.eventRow(e)).join(''), '<button class="linkbtn" data-act="whatson">All</button>'),
      sec('Popular with friends', withFriends.map(({ v }) => venueRow(v)).join('')),
      sec('Your saved places', saved.map((id) => venueRow(S.venueById[id])).join(''), '<button class="linkbtn" data-act="savedLists">Lists</button>'),
    ].join('');
  }
  function results(opts = {}) {
    const q = query.trim().toLowerCase();
    const near = (v) => HOP.map.distanceFromMe(v);
    const pickOnly = opts.pick || HOP.app.route?.name === 'pick';
    let list = S.venues.filter((v) => filter === 'all' || v.cat === filter || (filter === 'bar' && v.cat === 'gig'));
    if (!q) return pickOnly ? list.sort((a, b) => near(a) - near(b)).slice(0, 30).map(venueRow).join('') : discovery();
    list = list.filter((v) => (v.name + ' ' + v.suburb + ' ' + CAT[v.cat] + ' ' + v.address).toLowerCase().includes(q)).sort((a, b) => near(a) - near(b));
    if (pickOnly) return list.slice(0, 30).map(venueRow).join('') || `<p class="empty">Nothing called “${esc(query)}” nearby.</p>`;
    const areas = HOP.activity.AREAS.filter((a) => (a.name + ' ' + a.suburbs.join(' ')).toLowerCase().includes(q));
    const evs = HOP.events.upcoming().filter((e) => (e.title + ' ' + e.genre + ' ' + (HOP.events.placeOf(e)?.name || '')).toLowerCase().includes(q)).slice(0, 5);
    const outs = S.publicOutings().filter((o) => (o.title + ' ' + S.stopsOf(o.id).map((st) => S.stopName(st)).join(' ')).toLowerCase().includes(q)).slice(0, 3);
    const body = [
      sec('Places', list.slice(0, 8).map(venueRow).join('')),
      sec('Events', evs.map((e) => HOP.eventRow(e)).join('')),
      sec('Public outings', outs.map((o) => `<button class="row" data-act="openOuting" data-id="${o.id}"><span class="iconbtn">${HOP.oicon(o, 18)}</span><div class="grow"><div class="t">${esc(o.title)}</div><div class="s">${o.status === 'live' ? 'Live now' : when(o.startsAt)} · ${S.going(o.id).length} going</div></div>${I('chev')}</button>`).join('')),
      sec('Areas', areas.map((a) => { const x = HOP.activity.areaInfo(a.id, 'now'); return `<button class="row" data-act="openArea" data-id="${a.id}"><span class="iconbtn lvbox lv${x.lv}">${HOP.activity.meter(x.lv)}</span><div class="grow"><div class="t">${esc(a.name)}</div><div class="s"><span class="lvw lv${x.lv}">${x.level} now</span></div></div>${I('chev')}</button>`; }).join('')),
    ].join('');
    return body || `<p class="empty">Nothing matches “${esc(query)}”. Try a suburb, a venue or a kind of night, like trivia.</p>`;
  }
  HOP.venueRow = (v) => venueRow(v);
  function venueRow(v) {
    const act = S.activity(v.id);
    const ev = HOP.events.tonightAt(v.id)[0];
    const evBit = ev ? `${ev.title.length > 20 ? HOP.events.CATS[ev.cat].label : ev.title} · ${HOP.util.startsIn(ev.startsAt, ev.endsAt)}` : '';
    const bits = [act.friends.length ? `${act.friends.length} ${act.friends.length === 1 ? 'friend' : 'friends'}` : '', evBit, distLabel(HOP.map.distanceFromMe(v))].filter(Boolean);
    return `<button class="row" data-act="venue" data-id="${v.id}">
      ${photoTag({ id: v.id, u: v.img }, 120, 120, 'thumb')}
      <div class="grow"><div class="t">${esc(v.name)}</div><div class="s"><span class="lvw lv${act.lv}">${act.label}${act.trend === 'rising' && act.lv >= 2 ? ', rising' : ''}</span>${bits.length ? ' · ' + esc(bits.join(' · ')) : ''}</div></div>
      ${act.friends.length ? avatarStack(act.friends.map((f) => f.user), 3, 22) : `<span class="mono dim">${esc(v.price)}</span>`}</button>`;
  }

  // ---------------- HOME ----------------
  function homeSheet() {
    if (HOP.app.searching) {
      return `<div class="section" style="padding-top:4px"><div class="rows" id="results">${results()}</div></div>`;
    }
    return lens === 'tonight' ? HOP.tonightSheet() : HOP.lensSheet(lens, lensSub[lens]);
  }

  // The Tonight layer: what my night looks like and what my friends are doing, in a few rows
  HOP.tonightSheet = () => {
    const now = HOP.now();
    const { live, upcoming } = S.myOutings();
    const mine = live[0];
    const others = S.tonightOutings().filter((o) => S.myAttendance(o.id)?.rsvp !== 'going');
    const out = S.friendsOut();
    const evTonight = HOP.events.filter({ when: 'tonight' });
    const next = upcoming.find((o) => S.myAttendance(o.id)?.rsvp === 'going');
    const d = new Date(now);
    let rows = '';
    if (mine) {
      const st = S.stopsOf(mine.id), cur = st[mine.live.current], nx = st[mine.live.current + 1];
      const unm = S.unread(mine.id);
      rows += `<div class="tl"><button class="tlmain" data-act="openLive" data-id="${mine.id}"><span class="lead emo">${HOP.oicon(mine)}${unm ? `<b class="ub">${unm}</b>` : ''}</span>
        <div class="grow"><div class="t">${esc(mine.title)}</div><div class="s"><span class="livepill">LIVE</span> ${esc(S.stopName(cur))}${nx ? ` · next ${esc(S.stopName(nx))} ${HOP.util.hm(nx.at)}` : ''}</div></div></button>
        <button class="tlcam" data-act="camera" data-id="${mine.id}" aria-label="Take a photo for ${esc(mine.title)}">${I('camera', 22)}</button></div>`;
    }
    others.slice(0, mine ? 1 : 2).forEach((o) => {
      const host = S.userById[o.organiserId];
      const a = S.myAttendance(o.id);
      const st = S.stopsOf(o.id);
      const isLive = o.status === 'live';
      const at = isLive ? st[o.live.current] : st[0];
      const n = S.going(o.id).length;
      const photos = S.photosOf(o.id).length;
      const sub = isLive ? `<span class="livepill">LIVE</span> ${esc(S.stopName(at))} · ${n} there${photos ? ` · ${photos} photos` : ''}`
        : `${HOP.util.hm(o.startsAt)} ${esc(S.stopName(at))}${st[1] ? ` → ${esc(S.stopName(st[1]))}` : ''}${a?.rsvp === 'maybe' ? ' · you’re a maybe' : ` · ${n} going`}`;
      const cta = !a ? ['View', 'openOuting'] : a.rsvp === 'invited' ? ['Join', 'joinOuting'] : a.rsvp === 'maybe' ? ['I’m in', 'joinOuting'] : ['View', 'openOuting'];
      const un = S.canChat(o) ? S.unread(o.id) : 0;
      rows += `<div class="tl"><button class="tlmain" data-act="openOuting" data-id="${o.id}"><span class="lead ${isLive ? 'live' : ''}">${avatar(host, 38)}<i>${HOP.oicon(o)}</i>${un ? `<b class="ub">${un}</b>` : ''}</span>
        <div class="grow"><div class="t">${esc(host.first)}’s ${esc(o.title.replace(/^.*?'s /, ''))}</div><div class="s">${sub}</div></div></button>
        <button class="btn sm ${cta[1] === 'joinOuting' ? 'primary' : ''}" data-act="${cta[1]}" data-id="${o.id}">${cta[0]}</button></div>`;
    });
    if (out.length) {
      const named = out.slice(0, 2).map((f) => `${esc(f.user.first)} at ${esc(f.venueId ? S.venueById[f.venueId].name : HOP.events.byId(f.eventId)?.title || '')}`);
      rows += `<button class="tl tlmain" data-act="friendsOut">${avatarStack(out.map((f) => f.user), 5, 28)}
        <div class="grow"><div class="t">${out.length} friends are out</div><div class="s">${named.join(' · ')}</div></div>${I('chev')}</button>`;
    }
    if (next && (!mine || next.id !== mine.id)) {
      const un = S.unread(next.id), lm = un && S.lastMessage(next.id);
      rows += `<button class="tl tlmain" data-act="${un ? 'openChat' : 'openOuting'}" data-id="${next.id}"><span class="lead emo">${HOP.oicon(next)}${un ? `<b class="ub">${un}</b>` : ''}</span>
        <div class="grow"><div class="t">${esc(next.title)} <span class="tlwhen">${when(next.startsAt)}</span></div><div class="s">${lm ? `<span class="lm">${esc(HOP.chatPreview(lm))}</span> · ${HOP.util.ago(lm.at)}` : `${S.going(next.id).length} going · ${HOP.util.plural(S.stopsOf(next.id).length, 'stop')}`}</div></div>${I('chev')}</button>`;
    }
    return `<div class="tonhead" data-drag><p class="label"><span class="amber">Tonight</span> · ${HOP.util.DAYS_LONG[d.getDay()]} ${HOP.util.time(now)}</p>
        <button class="linkbtn" data-act="whatson">${evTonight.length} things on ${I('chev', 14)}</button></div>
      <div class="tonrows">${rows}</div><div class="peek-end"></div>
      <div class="section"><p class="label"><span>What’s on tonight</span><button class="linkbtn" data-act="whatson">See all</button></p>
        <div class="rows">${evTonight.slice(0, 5).map((e) => HOP.eventRow(e)).join('')}</div></div>
      <div class="section"><p class="label">Near you</p><div class="rows">${S.venues.filter((v) => v.cat !== 'spot').sort((a, b) => HOP.map.distanceFromMe(a) - HOP.map.distanceFromMe(b)).slice(0, 12).map(venueRow).join('')}</div></div>`;
  };

  HOP.actions.joinOuting = (d) => {
    S.rsvp(d.id, 'going');
    const o = S.outing(d.id);
    ui.toast(`You’re in. ${esc(S.userById[o.organiserId].first)} can see you’re coming.`);
    HOP.actions.openOuting({ id: d.id });
  };
  HOP.actions.friendsOut = () => {
    const out = S.friendsOut();
    const groups = {};
    out.forEach((f) => { const k = f.venueId || f.eventId; (groups[k] ||= []).push(f); });
    ui.openModal(`<div class="mhead"><h2 class="h2">${out.length} friends are out</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <div class="rows">${Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([k, fs]) => {
        const v = S.venueById[k]; const e = !v && HOP.events.byId(k);
        const o = fs[0].outingId && S.outing(fs[0].outingId);
        return `<button class="row" data-act="${v ? 'venueFromList' : 'openEvent'}" data-id="${k}">${avatarStack(fs.map((f) => f.user), 3, 30)}
          <div class="grow"><div class="t">${esc(v ? v.name : e.title)}</div><div class="s">${esc(fs.map((f) => f.user.first).join(', '))}${o ? ` · ${esc(o.title)}` : ''} · since ${HOP.util.hm(Math.min(...fs.map((f) => f.since)))}</div></div>${I('chev')}</button>`;
      }).join('')}</div>
      <p class="meta" style="margin:12px 0 0">Only friends who share where they are, or who are on an outing you can see.</p>`);
  };
  HOP.actions.venueFromList = (d) => { ui.closeModal(); HOP.app.openVenue(d.id); };

  HOP.screens.home = {
    nav: 'home', mapMode: 'default',
    render() {
      return {
        top: searchTop(), sheet: homeSheet(),
        sizes: HOP.app.searching ? ['half', 'full'] : lens === 'tonight' ? ['peek', 'half', 'full'] : ['half', 'peek', 'full'],
        map() {
          HOP.map.setSelected(null);
          const { live, upcoming } = S.myOutings();
          const focus = live[0] || upcoming.find((o) => S.myAttendance(o.id)?.rsvp === 'going');
          HOP.map.showRoute(focus ? focus.id : null, 'home', { fit: false });
          const tonight = new Set(S.tonightOutings().map((o) => o.id));
          HOP.map.showOutingPins([...upcoming.slice(focus && !live[0] ? 1 : 0), ...S.publicOutings().filter((o) => !S.myAttendance(o.id))].filter((o) => o !== focus && !tonight.has(o.id)));
        },
      };
    },
    mount() { bindSearch(); },
    refreshSheetOnly: true,
  };

  function bindSearch() {
    const q = document.getElementById('q');
    if (!q) return;
    q.addEventListener('focus', () => { if (!HOP.app.searching) { HOP.app.searching = true; HOP.app.render({ sheetOnly: true, sizes: ['half', 'full'] }); } });
    q.addEventListener('input', () => {
      query = q.value;
      HOP.app.searching = true;
      const r = document.getElementById('results');
      if (r) r.innerHTML = results(); else HOP.app.render({ sheetOnly: true, sizes: ['half', 'full'] });
    });
    q.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { query = ''; q.value = ''; q.blur(); HOP.app.searching = false; HOP.app.render({ sheetOnly: true, sizes: ['peek', 'full'] }); }
      if (e.key === 'Enter') { const first = document.querySelector('#results [data-act]'); if (first) first.click(); }
    });
  }
  HOP.bindSearch = bindSearch;

  HOP.actions.filter = (d) => {
    filter = d.f;
    HOP.map.setFilter(filter);
    document.querySelectorAll('.filters button').forEach((b) => b.classList.toggle('on', b.dataset.f === filter));
    const r = document.getElementById('results'); if (r) r.innerHTML = results();
  };
  HOP.actions.area = (d) => { HOP.map.focus({ lat: +d.lat, lng: +d.lng }, 15.75); HOP.app.searching = false; HOP.app.render({ sheetOnly: true, sizes: ['peek', 'full'] }); document.getElementById('q')?.blur(); };
  document.addEventListener('click', (e) => { if (HOP.app?.searching && e.target.closest('#results [data-act]') && !e.target.closest('[data-act="recentSearch"]')) rememberSearch(); }, true);
  HOP.actions.venue = (d) => { HOP.app.searching = false; document.getElementById('q')?.blur(); HOP.app.openVenue(d.id); };

  // ---------------- VENUE ----------------
  function friendsBeen(v) {
    const ids = new Set();
    S.state.stops.filter((s) => s.venueId === v.id).forEach((s) => {
      const o = S.outing(s.outingId);
      if (o && o.status === 'ended') S.going(o.id).forEach((a) => a.userId !== S.meId && ids.add(a.userId));
    });
    return [...ids].map((id) => S.userById[id]);
  }

  const peakWords = (v) => { const [, pk] = HOP.seed.POP[v.id] || [0.3, 21]; const h = Math.round(pk) % 24; return `peaks around ${h % 12 || 12}${h >= 12 && h < 24 ? 'pm' : 'am'}`; };
  // Save into a collection (Want to go, Good pubs, …)
  HOP.actions.saveVenue = (d) => HOP.actions.saveTo({ v: d.v });
  HOP.actions.saveTo = (d) => {
    const ref = d.v ? { venueId: d.v } : { eventId: d.e };
    const name = d.v ? S.venueById[d.v].name : HOP.events.byId(d.e).title;
    const draw = () => `<div class="mhead"><h2 class="h2">Save ${esc(name)}</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <div class="rows">${S.collections().map((c) => { const on = c.items.some((i) => (d.v ? i.venueId === d.v : i.eventId === d.e)); return `<button class="row colrow ${on ? 'on' : ''}" data-act="saveToggle" data-c="${c.id}" ${d.v ? `data-v="${d.v}"` : `data-e="${d.e}"`}><span class="colic">${I(on ? 'check' : 'bookmark', 16)}</span><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${HOP.util.plural(c.items.length, 'place')}</div></div></button>`; }).join('')}</div>
      <button class="btn primary block" data-act="closeModal" style="margin-top:10px">Done</button>`;
    ui.openModal(draw(), () => HOP.app.render({ sheetOnly: true }));
    HOP.actions.saveToggle = (x) => {
      const r = x.v ? { venueId: x.v } : { eventId: x.e };
      const on = !S.collectionsOf(r).some((c) => c.id === x.c);
      S.setSaved(r, x.c, on);
      document.querySelector('#modal .msheet').innerHTML = draw();
    };
  };

  // Crowd report: structured, quick, only from people who are there
  HOP.actions.report = (d) => {
    const v = S.venueById[d.v];
    const ok = S.canReport(v.id);
    if (!ok.ok) { ui.toast(ok.why); return; }
    const picks = {};
    const draw = () => `<div class="mhead"><h2 class="h2">How’s ${esc(v.name)}?</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <p class="meta" style="margin:0 0 10px">Anonymous. Helps everyone nearby. Pick what you can see.</p>
      ${Object.entries(S.REPORT_KINDS).map(([k, def]) => `<div class="rgroup"><p class="label">${def.label}</p><div class="rchips">${def.opts.map(([val, l]) => `<button class="${picks[k] === val ? 'on' : ''}" data-act="rpick" data-k="${k}" data-val="${val}">${l}</button>`).join('')}</div></div>`).join('')}
      <button class="btn primary block" data-act="rsend" ${Object.keys(picks).length ? '' : 'disabled'}>Send report</button>`;
    ui.openModal(draw());
    HOP.actions.rpick = (x) => { picks[x.k] = picks[x.k] === x.val ? undefined : x.val; if (!picks[x.k]) delete picks[x.k]; document.querySelector('#modal .msheet').innerHTML = draw(); };
    HOP.actions.rsend = () => { S.addReport(v.id, picks); ui.closeModal(); ui.toast('Thanks. Your report is in.'); HOP.app.render({ sheetOnly: true }); };
  };

  // "BUSY · Activity rising", reports, what's on, who's there, public photos
  function reportBlock(v) {
    const r = S.reportsAt(v.id);
    const ks = Object.keys(r);
    const can = S.canReport(v.id);
    if (!ks.length) return `<div class="reports empty"><span class="meta">No crowd reports in the last 90 minutes.</span>${can.ok ? `<button class="linkbtn" data-act="report" data-v="${v.id}">Report</button>` : ''}</div>`;
    const n = Math.max(...ks.map((k) => r[k].n)), last = Math.max(...ks.map((k) => r[k].last));
    return `<div class="reports">
      <div class="rgrid">${['crowd', 'queue', 'entry', 'vibe'].filter((k) => r[k]).map((k) => `<div><span>${k === 'vibe' ? 'Music' : S.REPORT_KINDS[k].label}</span><b>${esc(r[k].label)}</b></div>`).join('')}</div>
      <div class="rfoot"><span data-live="rep-${v.id}">${HOP.util.plural(n, 'report')} · Updated ${HOP.util.ago(last)}</span>${can.ok ? `<button class="linkbtn" data-act="report" data-v="${v.id}">Report</button>` : ''}</div></div>`;
  }
  function venueBody(v, been, act) {
    const now = HOP.now();
    const evs = HOP.events.atVenue(v.id).slice(0, 3);
    const live = act.liveHere;
    const fr = act.friends.filter((f) => !live.some((o) => o.id === f.outingId));
    const pub = S.venuePhotos(v.id);
    const tonight = [...act.tonightPhotos.slice().reverse().map((p) => ({ p, own: true })), ...pub.map((p) => ({ p, own: false }))];
    const mem = S.memoryPhotosAt(v.id);
    const hours = v.hours.replace('Open till', 'till');
    const area = HOP.activity.areaOfVenue(v);
    const areaNow = area && HOP.activity.areaInfo(area.id, 'now');
    const status = `${act.label.toUpperCase()}${act.trend === 'rising' ? ' · Activity rising' : act.trend === 'easing' ? ' · Easing off' : ''}`;
    const onNow = evs.find((e) => HOP.events.live(e));
    return `
      <div class="vhead2" data-drag>
        <div class="grow"><span class="cat">${HOP.map.catSvg(v.cat)} ${CAT[v.cat]} · ${esc(v.suburb)}${v.price ? ` · <span class="mono">${v.price}</span>` : ''}</span>
          <h2 class="h1">${esc(v.name)}</h2>
          <div class="busyline lv${act.lv}">${HOP.activity.meter(act.lv)}<b data-live="vs-${v.id}">${status}</b></div>
          <div class="vsub">${onNow ? `<b>${esc(onNow.title)} · On now</b> · ` : ''}${peakWords(v)} · ${esc(hours)} · ${HOP.util.walkMins(HOP.map.ME, v)} min walk</div>
          ${area ? `<button class="arealink" data-act="openArea" data-id="${area.id}">${esc(area.name)} · ${areaNow.level.toLowerCase()} now ${I('chev', 13)}</button>` : ''}</div>
        <span class="vthumb">${photoTag({ id: v.id, u: v.img }, 200)}</span>
      </div>
      ${live.map((o) => { const host = S.userById[o.organiserId]; const n = S.going(o.id).length; return `<button class="tl tlmain vlive" data-act="openOuting" data-id="${o.id}"><span class="lead live">${avatar(host, 34)}<i>${HOP.oicon(o)}</i></span>
        <div class="grow"><div class="t">${esc(host.first)}’s ${esc(o.title.replace(/^.*?'s /, ''))} is here</div><div class="s">${n} there · ${S.photosOf(o.id).length} photos</div></div>${I('chev')}</button>`; }).join('')}
      ${fr.length ? `<div class="herenow">${avatarStack(fr.map((f) => f.user), 4, 26)}<span><b>${esc(fr.slice(0, 2).map((f) => f.user.first).join(', '))}</b>${fr.length > 2 ? ` + ${fr.length - 2}` : ''} here · since ${HOP.util.hm(Math.min(...fr.map((f) => f.since)))}</span></div>` : ''}
      ${reportBlock(v)}
      ${tonight.length ? `<div class="section"><p class="label"><span>Recent · ${HOP.util.plural(tonight.length, 'photo')} tonight</span><span class="dim">${HOP.util.ago(Math.max(...tonight.map((x) => x.p.takenAt)))}</span></p>
        <div class="strip">${tonight.slice(0, 12).map(({ p, own }) => own
          ? `<button data-act="viewPhoto" data-id="${p.outingId}" data-p="${p.id}">${photoTag(p, 200, 250)}<span class="by">${avatar(S.userById[p.userId], 20)}</span></button>`
          : `<button data-act="viewPhoto" data-vp="${v.id}" data-p="${p.id}">${photoTag(p, 200, 250)}</button>`).join('')}</div></div>`
        : mem.length ? `<div class="section"><p class="label"><span>Your nights here · ${mem.length} photos</span></p>
        <div class="strip">${mem.slice(0, 12).map((p) => `<button data-act="viewPhoto" data-id="${p.outingId}" data-p="${p.id}">${photoTag(p, 200, 250)}</button>`).join('')}</div></div>` : ''}
      ${evs.length ? `<div class="section"><p class="label">On here</p><div class="rows">${evs.map((e) => HOP.eventRow(e, { noPlace: true })).join('')}</div></div>` : ''}
      ${been.length ? `<div class="friends-been">${avatarStack(been, 4, 26)} <span>${esc(been.slice(0, 2).map((u) => u.first).join(', '))}${been.length > 2 ? ` and ${been.length - 2} others` : ''} have been here with you recently</span></div>` : ''}
      <div style="height:12px"></div>`;
  }

  HOP.screens.venue = {
    nav: 'home', mapMode: 'default',
    render({ id }) {
      const v = S.venueById[id];
      const picking = HOP.app.picking && S.outing(HOP.app.picking);
      const been = friendsBeen(v);
      const act = S.activity(v.id);
      let actions = '';
      if (picking) {
        const stops = S.stopsOf(picking.id);
        const existing = stops.find((s) => s.venueId === v.id);
        const at = stops.length ? stops[stops.length - 1].at + 90 * 6e4 : picking.startsAt;
        actions = existing
          ? `<button class="btn block" data-act="removeStop" data-id="${existing.id}">${I('trash', 18)} Remove from ${esc(picking.title)}</button>`
          : `${(() => { const ar = HOP.activity.areaOfVenue(v); if (!ar) return ''; const l = HOP.activity.levelAt(ar.id, at); return `<p class="ctxline">${HOP.activity.meter(l.lv)}${esc(ar.name)} expected ${l.level.toLowerCase()} around ${HOP.util.hm(at)}</p>`; })()}
            <button class="btn primary block" data-act="addStop" data-venue="${v.id}">${I('plus', 18)} Add as stop ${stops.length + 1} · ${timeShort(at)}</button>`;
        actions += `<button class="btn quiet block" data-act="donePicking">Back to ${esc(picking.title)}</button>`;
      } else {
        const mine = S.state.outings.filter((o) => o.organiserId === S.meId && o.status === 'planning');
        actions = mine.map((o) => {
          const has = S.stopsOf(o.id).some((s) => s.venueId === v.id);
          return has
            ? `<button class="btn block" data-act="openOuting" data-id="${o.id}">${I('check', 18)} Stop on ${esc(o.title)}</button>`
            : `<button class="btn primary block" data-act="addToOuting" data-outing="${o.id}" data-venue="${v.id}">${I('plus', 18)} Add to ${esc(o.title)}</button>`;
        }).join('');
        const isSaved = S.isSaved({ venueId: v.id });
        const can = S.canReport(v.id);
        if (!mine.length) actions += `<button class="btn primary block" data-act="startHere" data-venue="${v.id}">${I('plus', 18)} Add to an outing</button>`;
        actions += `<div class="btnrow three"><button class="btn ${isSaved ? 'savedbtn' : ''}" data-act="saveTo" data-v="${v.id}">${isSaved ? I('check', 17) + ' Saved' : I('bookmark', 17) + ' Save'}</button>
          <button class="btn" data-act="sendToOuting" data-v="${v.id}">${I('send', 17)} Share</button>
          <button class="btn ${can.ok ? '' : 'off'}" data-act="report" data-v="${v.id}" ${can.ok ? '' : `aria-disabled="true" title="${esc(can.why)}"`}>${I('flag', 17)} Report</button></div>
          ${mine.length ? `<button class="linkbtn startlink" data-act="startHere" data-venue="${v.id}">${I('plus', 15)} Start a new outing here</button>` : ''}`;
      }
      return {
        top: picking ? pickTop(picking) : searchTop(),
        sizes: ['auto', 'full'],
        sheet: venueBody(v, been, act) + `<div class="addto">${actions}</div><p class="meta vaddr">${esc(v.address)}, ${esc(v.suburb)} · ${esc(v.blurb)}</p>`,

        map() {
          HOP.map.setSelected(v.id);
          HOP.map.focus(v, picking ? HOP.map.leaflet.getZoom() : Math.max(HOP.map.leaflet.getZoom(), 16));
          if (picking) HOP.map.showRoute(picking.id, 'plan', { fit: false });
        },
      };
    },
    mount() { bindSearch(); },
  };

  // ---------------- PICK MODE (adding stops on the map) ----------------
  function pickTop(o) {
    return `<div class="searchrow">
      <label class="search">${I('search')}<input id="q" type="search" autocomplete="off" placeholder="Search a venue to add" value="${esc(query)}"></label>
      <button class="me-btn" data-act="donePicking" aria-label="Done">${I('check', 22)}</button></div>
      <div class="filters"><button class="wo" data-act="savedLists">${I('bookmark', 13)}Saved</button><span class="fsep"></span>${FILTERS.map(([k, l]) => `<button data-act="filter" data-f="${k}" class="${filter === k ? 'on' : ''}">${k !== 'all' ? HOP.map.catSvg(k) : ''}${l}</button>`).join('')}</div>`;
  }
  HOP.screens.pick = {
    nav: null, mapMode: 'pick',
    render({ id, fit }) {
      const o = S.outing(id);
      const stops = S.stopsOf(id);
      const sheet = HOP.app.searching
        ? `<div class="section" style="padding-top:4px"><p class="label">Tap one to add it</p><div class="rows" id="results">${results()}</div></div>`
        : `<div class="pickbar" data-drag>
            <div class="grow"><p class="label">Adding stops · ${esc(o.title)}</p>
            <div class="h2" style="margin-top:4px">${stops.length ? 'Tap another venue, or you’re done' : 'Tap a venue on the map'}</div></div>
            <button class="btn primary sm" data-act="donePicking">Done</button></div>
            ${stops.length ? `<div class="pickchips">${stops.map((s, i) => `<span><b>${i + 1}</b>${esc(S.stopName(s))}</span>`).join('')}</div>` : ''}`;
      return {
        top: pickTop(o), sheet, sizes: HOP.app.searching ? ['half', 'full'] : ['auto', 'half'],
        map() {
          HOP.map.setSelected(null); HOP.map.clearOutingPins();
          HOP.map.showRoute(id, 'plan', { fit: false });
          // keep the whole route in view as it grows, with room around it to spot the next stop
          if (stops.length > 1) HOP.map.fitTo(stops.map((s) => S.placeOf(s)), { maxZoom: 15.75 });
          else HOP.map.focus(stops[0] ? S.placeOf(stops[0]) : HOP.map.ME, Math.min(HOP.map.leaflet.getZoom(), 15.5));
        },
      };
    },
    mount() { bindSearch(); },
    refreshSheetOnly: true,
  };

  // ---------------- OUTINGS TAB ----------------
  function orow(o) {
    const st = S.stopsOf(o.id).map((s) => S.stopName(s));
    return `<button class="orow" data-act="${o.status === 'live' ? 'openLive' : 'openOuting'}" data-id="${o.id}">
      <span class="emo">${o.cover ? photoTag({ id: o.id, src: o.cover }, 120) : HOP.oicon(o, 26)}</span>
      <div class="grow"><div class="t">${esc(o.title)}</div>
        <div class="when">${o.status === 'live' ? '<span class="livepill">LIVE NOW</span>' : when(o.startsAt)}</div>
        <div class="s">${st.length ? esc(st.join(' → ')) : 'No stops yet'}</div>
        <div class="s">${HOP.goingLine(o)} · ${HOP.util.plural(S.stopsOf(o.id).length, 'stop')}${o.visibility === 'public' ? ' · Public' : ''}</div>
        ${HOP.lastLine(o)}</div>
      ${S.canChat(o) && S.unread(o.id) ? `<span class="unread">${S.unread(o.id)}<em>unread</em></span>` : HOP.routeMini(o.id)}</button>`;
  }
  HOP.orow = orow;
  // "Jack: Where are you guys? · 2m" under an outing, so a glance shows what's moving
  HOP.lastLine = (o) => {
    if (!S.canChat(o)) return '';
    const m = S.lastMessage(o.id);
    if (!m) return '';
    const fresh = S.unread(o.id) > 0;
    return `<div class="lastmsg ${fresh ? 'fresh' : ''}" data-act="openChat" data-id="${o.id}"><span>${esc(HOP.chatPreview(m))}</span><time>${HOP.util.ago(m.at)}</time></div>`;
  };

  HOP.screens.outings = {
    nav: 'outings', mapMode: 'default',
    render() {
      const { live, invites, upcoming } = S.myOutings();
      const pub = S.publicOutings().filter((o) => !S.myAttendance(o.id));
      const sheet = `
        <div style="display:flex;align-items:center;justify-content:space-between;padding-top:4px" data-drag><h1 class="h1">Outings</h1><button class="btn primary sm" data-go="create">${I('plus', 16)} New</button></div>
        ${live.length ? `<div class="section"><p class="label">Happening now</p>${live.map(orow).join('')}</div>` : ''}
        ${invites.length ? `<div class="section"><p class="label">Waiting on you</p>${invites.map((o) => {
          const org = S.userById[o.organiserId];
          return `<div class="invite"><div class="from">${avatar(org, 22)} ${esc(org.first)} invited you</div>${orow(o).replace('class="orow"', 'class="orow" style="border:0;padding-top:0"')}
            ${rsvpSeg(o)}</div>`;
        }).join('')}</div>` : ''}
        <div class="section"><p class="label">Coming up</p>${upcoming.length ? upcoming.map(orow).join('') : `<p class="empty">Nothing planned. Start one from the map.</p>`}</div>
        ${pub.length ? `<div class="section"><p class="label">Public near you</p>${pub.map(orow).join('')}</div>` : ''}`;
      return {
        top: '', sheet, sizes: ['full'],
        map() { HOP.map.setSelected(null); HOP.map.showRoute(null); HOP.map.showOutingPins([...live, ...upcoming, ...invites]); },
      };
    },
  };

  function rsvpSeg(o) {
    const a = S.myAttendance(o.id);
    const v = a ? a.rsvp : 'invited';
    return `<div class="seg" role="radiogroup" aria-label="Are you going?">${[['going', 'Going'], ['maybe', 'Maybe'], ['declined', 'Can’t go']].map(([k, l]) => `<button role="radio" aria-checked="${v === k}" data-act="rsvp" data-id="${o.id}" data-v="${k}" class="${v === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  }
  HOP.rsvpSeg = rsvpSeg;
})();

</script>
<script>
/* HOP — Public events: What's on (from the map), the event sheet, and turning an event into a night out */
(() => {
  const { esc, avatar, avatarStack, photoTag, eventWhen, hm, plural, dayDate, longDate, timeShort } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const EV = HOP.events;
  const ui = HOP.ui;

  const WHEN = [['tonight', 'Tonight'], ['tomorrow', 'Tomorrow'], ['weekend', 'This weekend']];
  const GROUP = [['music', 'Music'], ['comedy', 'Comedy'], ['sport', 'Sport'], ['nightlife', 'Nightlife'], ['food', 'Food'], ['free', 'Free']];
  const ICON = { club: 'disco', dj: 'disco', live: 'music', festival: 'party', pub: 'beer', trivia: 'star', happyhour: 'cocktail', market: 'food', run: 'run', comedy: 'mic', exhibition: 'star', sport: 'ball', food: 'bowl' };
  let when = 'tonight', group = null, q = '';
  HOP.eventIcon = (e) => ICON[e.cat] || 'party';

  const where = (e) => { const p = EV.placeOf(e); return `${esc(p.name)} · ${esc(p.suburb)}`; };
  const friendsOf = (e) => e.friendIds.filter((id) => id !== S.meId).map((id) => S.userById[id]).filter(Boolean);

  // one compact list row, shared by What's on, Tonight and venue sheets
  HOP.eventRow = (e, opts = {}) => {
    const fr = friendsOf(e);
    const on = EV.live(e);
    return `<button class="erow" data-act="openEvent" data-id="${e.id}">
      <span class="et ${on ? 'now' : ''}">${on ? 'NOW' : hm(e.startsAt)}</span>
      <div class="grow"><div class="t">${esc(e.title)}</div>
        <div class="s">${(() => { const si = HOP.util.startsIn(e.startsAt, e.endsAt); return si.startsWith('Starts') ? `<span class="soon">${si}</span> · ` : ''; })()}${opts.noPlace ? esc(e.genre) : where(e)} · ${esc(e.priceLabel)}</div>
        ${e.deal ? `<div class="deal">${esc(e.deal)}</div>` : ''}</div>
      ${fr.length ? avatarStack(fr, 3, 22) : `<span class="mono dim">${e.interested >= 1000 ? (e.interested / 1000).toFixed(1) + 'k' : e.interested}</span>`}</button>`;
  };

  function list() {
    // searching looks across everything coming up, not just the selected day
    let l = q ? EV.filter({ when: 'any', group }) : EV.filter({ when, group });
    if (q) l = l.filter((e) => (e.title + ' ' + e.genre + ' ' + EV.placeOf(e).name + ' ' + EV.placeOf(e).suburb).toLowerCase().includes(q.toLowerCase()));
    return l;
  }
  function eventsTop() {
    return `<div class="searchrow">
        <label class="search">${I('search')}<input id="eq" type="search" autocomplete="off" placeholder="Gigs, trivia, markets…" value="${esc(q)}" aria-label="Search events"></label>
        <button class="me-btn" data-go="profile" aria-label="Your profile">${HOP.util.avatar(S.me(), 34)}</button>
      </div>${HOP.lensBar('events', `<div class="filters subs">${WHEN.map(([k, l]) => `<button data-act="evWhen" data-v="${k}" class="${when === k ? 'on' : ''}">${l.replace('This weekend', 'Weekend')}</button>`).join('')}<span class="fsep"></span>${GROUP.map(([k, l]) => `<button data-act="evGroup" data-v="${k}" class="${group === k ? 'on' : ''}">${l}</button>`).join('')}</div>`)}`;
  }
  function eventsSheet() {
    const l = list();
    const head = { tonight: 'What’s on tonight', tomorrow: 'What’s on tomorrow', weekend: 'This weekend' }[when];
    let body = '';
    if (!l.length) body = `<p class="empty">Nothing ${group ? GROUP.find((g) => g[0] === group)[1].toLowerCase() + ' ' : ''}on ${when === 'weekend' ? 'this weekend' : when}. Try another filter.</p>`;
    else if (when === 'weekend') {
      const days = {};
      l.forEach((e) => (days[EV.dayKey(e.startsAt)] ||= []).push(e));
      body = Object.entries(days).map(([k, es]) => `<p class="label dayhead">${longDate(+k)}</p><div class="rows">${es.map((e) => HOP.eventRow(e)).join('')}</div>`).join('');
    } else body = `<div class="rows">${l.map((e) => HOP.eventRow(e)).join('')}</div>`;
    return `<div class="sheethead" data-drag><h2 class="h2">${head}</h2><span class="mono dim">${l.length} ${l.length === 1 ? 'event' : 'events'}</span></div>${body}
      <p class="meta srcnote">Listings come from venues and What’s On Sydney. Venues can post their own soon.</p>`;
  }

  HOP.screens.whatson = {
    nav: 'home', mapMode: 'events',
    render() {
      const l = list();
      return {
        top: eventsTop(), sheet: eventsSheet(), sizes: ['half', 'full'],
        map() { HOP.map.setSelected(null); HOP.map.showRoute(null); HOP.map.clearOutingPins(); HOP.map.setMode('events', l); const pts = near(l); if (pts.length) HOP.map.fitTo(pts, { maxZoom: 15.25 }); },
        mapUpdate() { HOP.map.setMode('events', l); },
      };
    },
    mount() {
      const inp = document.getElementById('eq');
      if (!inp) return;
      inp.addEventListener('input', () => { q = inp.value; refresh(false); });
    },
    refreshSheetOnly: true,
  };
  // frame the events close to you; the list has the rest
  const near = (l) => {
    const ps = l.map((e) => EV.placeOf(e)).filter(Boolean);
    const close = ps.filter((p) => HOP.map.distanceFromMe(p) < 1600);
    return close.length >= 2 ? close : ps.filter((p) => HOP.map.distanceFromMe(p) < 4000);
  };
  function refresh(fit = true) {
    const l = list();
    ui.setSheet(eventsSheet(), { keepScroll: false });
