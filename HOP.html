      return `<div class="chatgate"><p class="meta">The chat is for people on the outing.</p>${o.visibility === 'public' ? `<button class="btn primary" data-act="joinOuting" data-id="${o.id}">Join ${esc(o.title)}</button>` : ''}</div>`;
    }
    const phase = S.chatPhase(o);
    const msgs = S.messagesOf(o.id);
    const lr = S.lastRead(o.id);
    const pref = S.chatPref(o.id);
    const phaseLine = { before: `Planning chat · closes 48 hours after the night`, during: '<span class="livepill">LIVE</span> Coordinating tonight', after: `Open till ${dayDate(S.chatClosesAt(o))} ${hm(S.chatClosesAt(o))}, then saved with the memory`, closed: `Closed ${dayDate(S.chatClosesAt(o))} · kept with the memory` }[phase];
    let html = `<div class="chathead"><span>${phaseLine}</span>
      <button class="bell" data-act="chatPrefs" data-id="${o.id}" aria-label="Notifications: ${pref}">${pref === 'mute' ? I('bellOff', 16) : I('bell', 16)}<em>${{ all: 'All', mentions: 'Mentions', mute: 'Muted' }[pref]}</em></button></div>
      <div class="msgs" id="msgs">`;
    let lastDay = '', prev = null, unreadMarked = false;
    msgs.forEach((m, i) => {
      const day = new Date(m.at).toDateString();
      if (day !== lastDay) { const dd = Math.round((new Date(new Date(HOP.now()).toDateString()) - new Date(day)) / 864e5);
        html += `<div class="chatday">${dd === 0 ? 'Today' : dd === 1 ? 'Yesterday' : longDate(m.at)}</div>`; lastDay = day; prev = null; }
      if (!unreadMarked && lr && m.at > lr && m.userId && m.userId !== S.meId) { html += '<div class="newline"><span>New</span></div>'; unreadMarked = true; }
      if (m.kind === 'system') { html += sysLine(o, m); prev = null; return; }
      const next = msgs[i + 1];
      const first = !prev || prev.userId !== m.userId || m.at - prev.at > 5 * 6e4;
      const last = !next || next.userId !== m.userId || next.kind === 'system' || next.at - m.at > 5 * 6e4 || new Date(next.at).toDateString() !== day;
      html += msgHtml(o, m, first, last, phase);
      prev = m;
    });
    if (!msgs.length) html += `<p class="empty chatempty">${phase === 'before' ? 'Start with the basics: where, when, who’s keen.' : 'Nothing yet.'}</p>`;
    html += '</div>';
    html += phase === 'closed' ? `<div class="composer closed"><p>This chat closed ${dayDate(S.chatClosesAt(o))}. Plan the next one to start a new chat.</p></div>` : composer(o, phase);
    return html;
  }

  function sysLine(o, m) {
    const s = m.sys;
    const ph = s.type === 'photos' ? (s.photoIds || []).map((id) => S.state.photos.find((p) => p.id === id)).filter(Boolean).slice(0, 4) : [];
    return `<div class="msys">${I(sysIcon[s.type] || 'check', 13)}<span>${sysText(m)}</span><time>${hm(m.at)}</time></div>
      ${ph.length ? `<button class="sysph" data-act="album" data-id="${o.id}" aria-label="Open the album">${ph.map((p) => photoTag(p, 140)).join('')}${s.count > ph.length ? `<b>+${s.count - ph.length}</b>` : ''}</button>` : ''}`;
  }

  function msgHtml(o, m, first, last, phase) {
    const mine = m.userId === S.meId;
    const u = S.userById[m.userId];
    const reply = m.replyTo && S.state.messages.find((x) => x.id === m.replyTo);
    const rx = Object.entries(m.reactions || {}).filter(([, l]) => l.length);
    let body;
    if (m.kind === 'place') body = placeCard(o, m);
    else if (m.kind === 'location') body = locCard(o, m);
    else if (m.kind === 'poll') body = pollCard(o, m);
    else if (m.kind === 'photo') body = `<button class="photomsg n${Math.min(4, m.photoIds.length)}" data-act="viewPhoto" data-id="${o.id}" data-p="${m.photoIds[0]}">${m.photoIds.slice(0, 4).map((id) => S.state.photos.find((p) => p.id === id)).filter(Boolean).map((p) => photoTag(p, 300)).join('')}</button>${m.text ? `<div class="bubble">${fmt(m.text)}</div>` : ''}`;
    else body = `<div class="bubble">${fmt(m.text)}</div>`;
    if (m.kind === 'place' && m.text) body = `<div class="bubble">${fmt(m.text)}</div>` + body;
    return `<div class="m ${mine ? 'me' : 'them'} ${first ? 'first' : ''} ${last ? 'last' : ''} ${selected === m.id ? 'sel' : ''}" data-mid="${m.id}">
      ${!mine ? `<span class="mav">${last ? avatar(u, 28) : ''}</span>` : ''}
      <div class="mb">
        ${first && !mine ? `<b class="mname">${esc(u.first)}</b>` : ''}
        ${reply ? `<button class="quote" data-act="jumpMsg" data-m="${reply.id}"><b>${esc(nameOf(reply.userId))}</b> ${esc(HOP.chatPreview(reply).replace(/^[^:]+: /, '').slice(0, 70))}</button>` : ''}
        <div class="mtap" data-act="msgTap" data-m="${m.id}">${body}</div>
        ${rx.length ? `<div class="rx">${rx.map(([e, l]) => `<button class="${l.includes(S.meId) ? 'mine' : ''}" data-act="react" data-m="${m.id}" data-e="${e}">${HOP.react(e, 14)}${l.length > 1 ? `<em>${l.length}</em>` : ''}</button>`).join('')}</div>` : ''}
        ${selected === m.id && phase !== 'closed' ? `<div class="msgbar">${REACTIONS.map((e) => `<button data-act="react" data-m="${m.id}" data-e="${e}" aria-label="React ${e}">${HOP.react(e, 20)}</button>`).join('')}<button class="rp" data-act="replyMsg" data-m="${m.id}">${I('back', 14)} Reply</button></div>` : ''}
        ${last ? `<time class="mt">${hm(m.at)}</time>` : ''}
      </div></div>`;
  }
  // @mentions stand out; nothing else is formatted
  const fmt = (t) => esc(t).replace(/@(\w+)/g, (x, n) => `<span class="mention${n.toLowerCase() === S.me().first.toLowerCase() ? ' me' : ''}">@${n}</span>`);

  function placeCard(o, m) {
    if (m.place.eventId) {
      const e = HOP.events.byId(m.place.eventId);
      if (!e) return '';
      const p = HOP.events.placeOf(e);
      return `<div class="card place ev"><div class="ctop">${photoTag({ id: e.id, u: e.img }, 140)}<div class="grow"><b>${esc(e.title)}</b><span>${esc(p.name)} · ${dayDate(e.startsAt)} ${hm(e.startsAt)} · ${esc(e.priceLabel)}</span></div></div>
        <div class="cbtns"><button data-act="openEvent" data-id="${e.id}">View event</button>${S.isOrganiser(o) && o.status !== 'ended' ? `<button data-act="addEventTo" data-o="${o.id}" data-id="${e.id}">Add as stop</button>` : ''}</div></div>`;
    }
    const v = S.venueById[m.place.venueId];
    const act = S.activity(v.id);
    const onRoute = S.stopsOf(o.id).some((s) => s.venueId === v.id);
    const keen = m.keen || [];
    const canAdd = S.isOrganiser(o) && o.status !== 'ended' && !onRoute;
    return `<div class="card place"><div class="ctop">${photoTag({ id: v.id, u: v.img }, 140)}<div class="grow"><b>${esc(v.name)}</b>
        <span>${esc(v.suburb)} · ${distLabel(HOP.map.distanceFromMe(v))} away${act.hot || act.friends.length ? ` · ${act.label}` : ''}</span>
        ${keen.length ? `<span class="keen">${avatarStack(keen.map((id) => S.userById[id]), 4, 18)} ${keen.length} keen</span>` : ''}</div></div>
      <div class="cbtns"><button data-act="viewPlace" data-v="${v.id}">${I('map', 15)} View on map</button>
        ${onRoute ? `<button disabled>${I('check', 15)} On the route</button>` : canAdd ? `<button class="pri" data-act="placeStop" data-o="${o.id}" data-v="${v.id}" data-m="${m.id}">${I('plus', 15)} Add as stop</button>`
          : o.status !== 'ended' ? `<button class="${keen.includes(S.meId) ? 'pri' : ''}" data-act="keen" data-m="${m.id}">${keen.includes(S.meId) ? I('check', 15) + ' Keen' : 'I’m keen'}</button>` : ''}</div></div>`;
  }
  function locCard(o, m) {
    const live = m.loc.until > HOP.now();
    const d = metres(HOP.map.ME, m.loc);
    const mine = m.userId === S.meId;
    const u = S.userById[m.userId];
    return `<div class="card loc ${live ? '' : 'off'}"><div class="minimap"><span class="pinme">${avatar(u, 26)}</span></div>
      <div class="ctop"><div class="grow"><b>${mine ? 'You shared your location' : `${esc(u.first)} shared ${['u_sarah', 'u_mia', 'u_grace', 'u_hannah', 'u_kate', 'u_priya', 'u_chloe', 'u_zoe', 'u_emily', 'u_jess', 'u_ella', 'u_lucy'].includes(m.userId) ? 'her' : 'his'} location`}</b>
        <span>${esc(m.loc.label)} · ${distLabel(d)} away · ${live ? `live for ${Math.max(1, Math.round((m.loc.until - HOP.now()) / 6e4))} more min` : 'sharing ended'}</span></div></div>
      <div class="cbtns">${live ? `<button data-act="viewLoc" data-m="${m.id}">${I('map', 15)} View on map</button>` : ''}${mine && live ? `<button data-act="stopShare" data-m="${m.id}">Stop sharing</button>` : ''}</div></div>`;
  }
  function pollCard(o, m) {
    const total = m.poll.options.reduce((n, op) => n + op.votes.length, 0) || 1;
    const lead = m.poll.options.slice().sort((a, b) => b.votes.length - a.votes.length)[0];
    return `<div class="card poll"><b class="pq">${esc(m.poll.q)}</b>
      ${m.poll.options.map((op, k) => {
        const v = S.venueById[op.venueId];
        const mineV = op.votes.includes(S.meId);
        return `<button class="opt ${mineV ? 'mine' : ''}" data-act="vote" data-m="${m.id}" data-k="${k}" ${m.poll.closed ? 'disabled' : ''}>
          <i style="width:${Math.round((op.votes.length / total) * 100)}%"></i><span>${esc(v.name)}</span>${avatarStack(op.votes.map((id) => S.userById[id]), 3, 16)}<em>${op.votes.length}</em></button>`;
      }).join('')}
      ${!m.poll.closed && S.isOrganiser(o) && lead.votes.length ? `<div class="cbtns"><button class="pri" data-act="closePoll" data-m="${m.id}" data-o="${o.id}">Go with ${esc(S.venueById[lead.venueId].name)}</button></div>` : ''}
      ${m.poll.closed ? '<span class="pclosed">Voting closed</span>' : ''}</div>`;
  }

  function composer(o, phase) {
    const r = replyTo && S.state.messages.find((x) => x.id === replyTo);
    const hint = { before: `Where, when, who’s keen…`, during: 'Where are you? Heading where?', after: 'Last night was…' }[phase];
    return `<div class="composer">
      ${r ? `<div class="replying"><span>Replying to <b>${esc(nameOf(r.userId))}</b> ${esc(HOP.chatPreview(r).replace(/^[^:]+: /, '').slice(0, 50))}</span><button class="iconbtn bare" data-act="cancelReply" aria-label="Cancel reply">${I('close', 16)}</button></div>` : ''}
      ${attachOpen ? `<div class="tray">
        ${phase === 'during' ? `<button data-act="chatCamera" data-id="${o.id}">${I('camera', 20)}<span>Take a photo</span></button>` : ''}
        <button data-act="chatAlbumPick" data-id="${o.id}">${I('image', 20)}<span>Photo from album</span></button>
        <button data-act="chatPlace" data-id="${o.id}">${I('pin', 20)}<span>Share a place</span></button>
        <button data-act="chatLocation" data-id="${o.id}">${I('locate', 20)}<span>Share my location</span></button>
        ${phase !== 'after' ? `<button data-act="chatPoll" data-id="${o.id}">${I('users', 20)}<span>Vote: where next?</span></button>` : ''}
      </div>` : ''}
      <div class="crow"><button class="cplus ${attachOpen ? 'on' : ''}" data-act="chatAttach" aria-label="Share a photo, place or location">${I('plus', 20)}</button>
        <input id="chatIn" type="text" autocomplete="off" maxlength="300" placeholder="${esc(hint)}" aria-label="Message ${esc(o.title)}">
        <button class="csend" data-act="sendMsg" data-id="${o.id}" aria-label="Send">${I('send', 18)}</button></div>
    </div>`;
  }

  function bindChat(outingId) {
    const body = document.getElementById('sheetBody');
    const inp = document.getElementById('chatIn');
    const o = S.outing(outingId);
    if (!o || !S.canChat(o)) return;
    if (inp) {
      inp.value = draft[outingId] || '';
      inp.addEventListener('input', () => (draft[outingId] = inp.value));
      inp.addEventListener('focus', () => (chatFocused = true));
      inp.addEventListener('blur', () => setTimeout(() => (chatFocused = document.activeElement === inp), 0));
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(outingId); } });
      if (chatFocused) inp.focus({ preventScroll: true });
    }
    body.onscroll = () => { stuckToBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 140; };
    if (stuckToBottom) requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
    if (S.unread(outingId)) setTimeout(() => S.markRead(outingId), 900);
  }
  HOP.chatOpenFor = () => { const r = HOP.app.route; return r.params?.tab === 'chat' ? r.params.id : null; };

  function send(outingId) {
    const inp = document.getElementById('chatIn');
    const text = (inp?.value || '').trim();
    if (!text) return;
    S.postMessage(outingId, { text, replyTo }, S.meId);
    draft[outingId] = ''; replyTo = null; stuckToBottom = true; attachOpen = false;
    HOP.sim.chatReply(outingId, text);
  }
  HOP.actions.sendMsg = (d) => send(d.id || HOP.app.route.params.id);
  HOP.actions.msgTap = (d, el, e) => {
    if (e.target.closest('button,a')) return;
    selected = selected === d.m ? null : d.m;
    HOP.app.render({ keepScroll: true });
  };
  HOP.actions.react = (d) => { S.react(d.m, d.e); selected = null; };
  HOP.actions.replyMsg = (d) => { replyTo = d.m; selected = null; chatFocused = true; HOP.app.render({ keepScroll: true }); };
  HOP.actions.cancelReply = () => { replyTo = null; HOP.app.render({ keepScroll: true }); };
  HOP.actions.jumpMsg = (d) => { const el = document.querySelector(`[data-mid="${d.m}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flashmsg'); setTimeout(() => el.classList.remove('flashmsg'), 1200); } };
  HOP.actions.chatAttach = () => { attachOpen = !attachOpen; stuckToBottom = true; HOP.app.render({ keepScroll: true }); };
  HOP.actions.keen = (d) => S.keen(d.m);
  HOP.actions.vote = (d) => S.vote(d.m, +d.k);
  HOP.actions.closePoll = (d) => {
    const win = S.closePoll(d.m);
    S.addStop(d.o, win.venueId);
    ui.toast(`${esc(S.venueById[win.venueId].name)} is on the route`);
  };
  HOP.actions.placeStop = (d) => { S.addStop(d.o, d.v); ui.toast(`${esc(S.venueById[d.v].name)} added to the route`); };
  HOP.actions.viewPlace = (d) => { ui.closeModal(); if (ui.currentSize() !== 'half' && HOP.app.route.params?.tab === 'chat') ui.resizeSheet('half'); setTimeout(() => { HOP.map.focus(S.venueById[d.v], 16.5); HOP.map.setSelected(d.v); }, 300); };
  HOP.actions.viewLoc = (d) => {
    const m = S.state.messages.find((x) => x.id === d.m);
    if (HOP.app.route.params?.tab === 'chat') ui.resizeSheet('half');
    setTimeout(() => { HOP.map.refreshLive(); HOP.map.focus(m.loc, 16.5); }, 300);
  };
  HOP.actions.stopShare = (d) => { S.stopSharing(d.m); ui.toast('Stopped sharing your location'); };

  // notifications: all / mentions only / mute
  HOP.actions.chatPrefs = (d) => {
    const o = S.outing(d.id), cur = S.chatPref(d.id);
    ui.openModal(`<div class="mhead"><h2 class="h2">Notifications</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <p class="meta" style="margin:0 0 12px">For ${esc(o.title)}. Updates like “Grace added 6 photos” never send a notification on their own.</p>
      <div class="vis">${[['all', 'All messages', 'Every message from people on the outing'], ['mentions', 'Mentions only', `Only when someone writes @${esc(S.me().first)}`], ['mute', 'Mute', 'Nothing until you open the chat']].map(([k, l, s]) => `<button data-act="setPref" data-id="${d.id}" data-v="${k}" class="${cur === k ? 'on' : ''}">${I(k === 'mute' ? 'bellOff' : 'bell')}<div><b>${l}</b><span>${s}</span></div></button>`).join('')}</div>`);
  };
  HOP.actions.setPref = (d) => { S.setChatPref(d.id, d.v); ui.closeModal(); ui.toast({ all: 'All messages', mentions: 'Mentions only', mute: 'Muted' }[d.v]); };

  // ---------------- attachments ----------------
  HOP.actions.chatCamera = (d) => { attachOpen = false; HOP.actions.camera({ id: d.id }); };
  HOP.actions.chatAlbumPick = (d) => {
    const ps = S.photosOf(d.id).slice().reverse();
    const sel = new Set();
    const draw = () => ui.openModal(`<div class="mhead"><h2 class="h2">From the album</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      ${ps.length ? `<div class="pickgrid">${ps.slice(0, 60).map((p) => `<button data-act="pickPh" data-p="${p.id}" class="${sel.has(p.id) ? 'on' : ''}">${photoTag(p, 200)}<i>${sel.has(p.id) ? I('check', 14) : ''}</i></button>`).join('')}</div>
        <div class="cta" style="margin-bottom:-18px"><button class="btn primary" data-act="sendPhotos" ${sel.size ? '' : 'disabled'}>${sel.size ? `Send ${plural(sel.size, 'photo')}` : 'Pick photos to point people to'}</button></div>`
        : `<p class="meta">No photos in the album yet. Take one and it lands here for everyone.</p>`}`);
    HOP.actions.pickPh = (x) => { sel.has(x.p) ? sel.delete(x.p) : sel.add(x.p); const sc = document.querySelector('.msheet').scrollTop; draw(); document.querySelector('.msheet').scrollTop = sc; };
    HOP.actions.sendPhotos = () => { ui.closeModal(); attachOpen = false; S.postMessage(d.id, { kind: 'photo', photoIds: [...sel] }); };
    draw();
  };
  HOP.actions.chatPlace = (d) => sendPlacePicker(d.id);
  function sendPlacePicker(outingId) {
    const o = S.outing(outingId);
    const st = S.stopsOf(outingId);
    const from = (o.live ? S.placeOf(st[o.live.current]) : st[0] && S.placeOf(st[0])) || HOP.map.ME;
    const list = S.venues.filter((v) => v.cat !== 'spot').map((v) => ({ v, d: metres(from, v) })).sort((a, b) => a.d - b.d).slice(0, 10);
    ui.openModal(`<div class="mhead"><h2 class="h2">Share a place</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <p class="meta" style="margin:0 0 8px">Close to ${esc(from.name || 'you')}. Or tap any venue on the map and choose <b>Send to outing</b>.</p>
      <div class="rows">${list.map(({ v, d }) => { const a = S.activity(v.id); return `<button class="row" data-act="sendPlace" data-o="${outingId}" data-v="${v.id}">${photoTag({ id: v.id, u: v.img }, 120, 120, 'thumb')}<div class="grow"><div class="t">${esc(v.name)}</div><div class="s">${distLabel(d)} · ${a.label}${a.friends.length ? ` · ${a.friends.length} friends` : ''}</div></div>${I('send', 16)}</button>`; }).join('')}</div>`);
  }
  HOP.actions.sendPlace = (d) => {
    ui.closeModal(); attachOpen = false;
    S.postMessage(d.o, { kind: 'place', place: { venueId: d.v } });
    HOP.sim.chatKeen(d.o);
    if (HOP.chatOpenFor() !== d.o) ui.toast(`Sent ${esc(S.venueById[d.v].name)} to ${esc(S.outing(d.o).title)}`);
  };
  HOP.actions.chatLocation = (d) => {
    attachOpen = false;
    const post = (lat, lng) => {
      const near = S.venues.map((v) => ({ v, d: metres({ lat, lng }, v) })).sort((a, b) => a.d - b.d)[0];
      const label = near && near.d < 250 ? `Near ${near.v.name}` : (near ? `${near.v.address.replace(/^[\d/-]+\s*/, '')}, ${near.v.suburb}` : 'Current location');
      S.postMessage(d.id, { kind: 'location', loc: { lat, lng, label, until: HOP.now() + 30 * 6e4 } });
      ui.toast('Sharing your location with this outing for 30 minutes');
    };
    // demo position by default; a real phone would use its GPS once, only when you tap this
    post(HOP.map.ME.lat, HOP.map.ME.lng);
  };
  HOP.actions.chatPoll = (d) => {
    attachOpen = false;
    const o = S.outing(d.id);
    const st = S.stopsOf(d.id);
    const from = (o.live ? S.placeOf(st[o.live.current]) : st[st.length - 1] && S.placeOf(st[st.length - 1])) || HOP.map.ME;
    const taken = new Set(st.map((s) => s.venueId));
    const opts = S.venues.filter((v) => ['bar', 'pub', 'club'].includes(v.cat) && !taken.has(v.id))
      .map((v) => ({ v, score: metres(from, v) - (HOP.seed.POP[v.id]?.[0] || 0.3) * 600 })).sort((a, b) => a.score - b.score).slice(0, 3);
    const m = S.postMessage(d.id, { kind: 'poll', poll: { q: `Where after ${from.name || 'this'}?`, closed: false, options: opts.map(({ v }) => ({ venueId: v.id, votes: [] })) } });
    HOP.sim.chatVotes(d.id, m.id);
  };

  // Send any venue or event to an outing chat (from the map)
  HOP.actions.sendToOuting = (d) => {
    const list = S.state.outings.filter((o) => S.canChat(o) && ['before', 'during'].includes(S.chatPhase(o)))
      .sort((a, b) => (b.status === 'live') - (a.status === 'live') || a.startsAt - b.startsAt);
    const what = d.v ? S.venueById[d.v].name : HOP.events.byId(d.e).title;
    ui.openModal(`<div class="mhead"><h2 class="h2">Share</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
      <p class="meta" style="margin:0 0 8px">Send ${esc(what)} to an outing chat, or copy a link for anywhere else.</p>
      <div class="rows">${list.map((o) => `<button class="row" data-act="sendTo" data-o="${o.id}" ${d.v ? `data-v="${d.v}"` : `data-e="${d.e}"`}><span class="emo-sm">${HOP.oicon(o)}</span><div class="grow"><div class="t">${esc(o.title)}</div><div class="s">${o.status === 'live' ? 'Live now' : HOP.util.when(o.startsAt)} · ${S.going(o.id).length} going</div></div>${I('send', 16)}</button>`).join('') || '<p class="meta">You’re not on any upcoming outings.</p>'}</div>
      <button class="btn block" style="margin-top:10px" data-act="copyShare" data-t="${esc(what)}">${I('link', 17)} Copy link</button>`);
  };
  HOP.actions.copyShare = (d) => { ui.copy(`${d.t} · on HOP`); ui.closeModal(); };
  HOP.actions.sendTo = (d) => {
    ui.closeModal();
    S.postMessage(d.o, { kind: 'place', place: d.v ? { venueId: d.v } : { eventId: d.e } });
    if (d.v) HOP.sim.chatKeen(d.o);
    ui.banner({ lead: `<span class="emo-sm">${HOP.oicon(S.outing(d.o))}</span>`, title: `Sent to ${esc(S.outing(d.o).title)}`, text: 'Tap to open the chat', act: 'openChat', data: { id: d.o }, timeout: 3500 });
  };
  HOP.actions.openChat = (d) => {
    const o = S.outing(d.id);
    HOP.app.go(o.status === 'live' ? 'live' : o.status === 'ended' ? 'memory' : 'outing', { id: d.id, tab: 'chat' });
  };

  // ---------------- photos tab: the outing album, grouped by stop ----------------
  function photosBody(o) {
    const ps = S.photosOf(o.id);
    const stops = S.stopsOf(o.id);
    return `<div class="phhead"><span class="meta">${plural(ps.length, 'photo')} from ${plural(new Set(ps.map((p) => p.userId)).size, 'person', 'people')}</span>${ps.length ? `<button class="linkbtn" data-act="album" data-id="${o.id}">Full screen</button>` : ''}</div>
      ${stops.map((s, i) => { const l = ps.filter((p) => p.stopId === s.id); return l.length ? `<p class="label dayhead">${i + 1}. ${esc(S.stopName(s))} · ${l.length}</p><div class="grid inset">${l.map((p) => `<button data-act="viewPhoto" data-id="${o.id}" data-p="${p.id}">${photoTag(p, 260)}</button>`).join('')}</div>` : ''; }).join('')
      || `<p class="empty">${o.status === 'planning' ? 'The album opens when the night starts. Everyone’s photos land here automatically.' : 'No photos yet.'}</p>`}
      ${S.myAttendance(o.id)?.rsvp === 'going' && o.status !== 'planning' ? `<div class="cta"><button class="btn" data-act="roll" data-id="${o.id}">${I('image', 18)} Add from camera roll</button>${o.status === 'live' ? `<button class="btn primary" data-act="camera" data-id="${o.id}">${I('camera', 18)} Take a photo</button>` : ''}</div>` : ''}`;
  }

  // ---------------- wire tabs into the outing, live and memory screens ----------------
  ['outing', 'live', 'memory'].forEach((name) => {
    const sc = HOP.screens[name];
    const render = sc.render.bind(sc), mount = sc.mount;
    sc.render = (params) => {
      const out = render(params);
      const o = S.outing(params.id);
      if (!o) return out;
      const tab = params.tab || 'plan';
      const tabs = HOP.outingTabs(o, tab);
      if (tab === 'chat') { out.sheet = tabs + chatBody(o); out.sizes = ['half', 'tall', 'full']; out.sizeIdx = 1; }
      else if (tab === 'photos') { out.sheet = tabs + photosBody(o); out.sizes = ['half', 'full']; out.sizeIdx = 0; }
      else out.sheet = tabs + out.sheet;
      return out;
    };
    sc.mount = (params) => { if (mount) mount.call(sc, params); if (params.tab === 'chat') bindChat(params.id); };
  });
})();

</script>
<script>
/* HOP — Tonight: the home sheet. Three levels:
   1. Glance (collapsed): your plans, who's out, what's starting — readable in two seconds
   2. Explore (dragged up): friends tonight, starting soon, busy areas, recent photos, popular, saved
   3. Detail: tap anything → its own sheet
   What leads changes with the time of day: memories in the morning, plans in the afternoon,
   people and places in the evening, your group and getting around late at night. */
(() => {
  const { esc, avatar, avatarStack, photoTag, when, hm, plural, time, ago, distLabel, metres } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;
  const A = HOP.activity;

  // time words that make things feel current
  const since = (ts) => { const m = Math.max(1, Math.round((HOP.now() - ts) / 6e4)); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60 ? (m % 60) + 'm' : ''}`.trim(); };
  const until = (ts) => { const m = Math.round((ts - HOP.now()) / 6e4); return m <= 0 ? 'now' : m < 60 ? `in ${m}m` : m < 180 ? `in ${Math.floor(m / 60)}h ${m % 60 ? (m % 60) + 'm' : ''}`.trim() : `at ${hm(ts)}`; };
  HOP.since = since; HOP.until = until;

  let previewHour = null; // prototype: preview Home at another time of day
  HOP.setPreviewHour = (h) => { previewHour = h; };
  function phase() {
    let h = previewHour ?? new Date(HOP.now()).getHours();
    if (h >= 5 && h < 12) return 'morning';
    if (h >= 12 && h < 17) return 'afternoon';
    if (h >= 17 && h < 23) return 'evening';
    return 'late';
  }
  const PHASE_LABEL = { morning: 'This morning', afternoon: 'This afternoon', evening: 'Tonight', late: 'Late' };

  // ---------- rows ----------
  function myLiveRow(o) {
    const st = S.stopsOf(o.id), cur = st[o.live.current], nx = st[o.live.current + 1];
    const un = S.unread(o.id);
    return `<div class="tl"><button class="tlmain" data-act="openLive" data-id="${o.id}"><span class="lead emo">${HOP.oicon(o)}${un ? `<b class="ub">${un}</b>` : ''}</span>
      <div class="grow"><div class="t">${esc(o.title)}</div><div class="s">At ${esc(S.stopName(cur))} · ${since(o.live.arrivedAt)}${nx ? ` · ${esc(S.stopName(nx))} ${until(nx.at)}` : ''}</div></div></button>
      <button class="tlcam" data-act="camera" data-id="${o.id}" aria-label="Take a photo for ${esc(o.title)}">${I('camera', 22)}</button></div>`;
  }
  function otherOutingRow(o) {
    const host = S.userById[o.organiserId];
    const a = S.myAttendance(o.id);
    const st = S.stopsOf(o.id);
    const isLive = o.status === 'live';
    const at = isLive ? st[o.live.current] : st[0];
    const going = S.going(o.id).map((x) => S.userById[x.userId]);
    const photos = S.photosOf(o.id);
    const lastPh = photos[photos.length - 1];
    const sub = isLive ? `${esc(S.stopName(at))} · ${since(o.live.arrivedAt)}${lastPh && HOP.now() - lastPh.takenAt < 36e5 ? ` · new photo ${since(lastPh.takenAt)} ago` : ''}`
      : `${esc(S.stopName(at))} ${until(o.startsAt)}${a?.rsvp === 'maybe' ? ' · you’re a maybe' : ''}`;
    const cta = !a ? ['View', 'openOuting'] : a.rsvp === 'invited' ? ['Join', 'joinOuting'] : a.rsvp === 'maybe' ? ['I’m in', 'joinOuting'] : ['View', 'openOuting'];
    const un = S.canChat(o) ? S.unread(o.id) : 0;
    return `<div class="tl"><button class="tlmain" data-act="openOuting" data-id="${o.id}"><span class="lead ${isLive ? 'live' : ''}">${avatar(host, 38)}<i>${HOP.oicon(o)}</i>${un ? `<b class="ub">${un}</b>` : ''}</span>
      <div class="grow"><div class="t">${esc(host.first)}${going.length > 1 ? ` + ${going.length - 1}` : ''} <span class="tlsub">${esc(o.title.replace(/^.*?'s /, ''))}</span></div><div class="s">${sub}</div></div></button>
      <button class="btn sm ${cta[1] === 'joinOuting' ? 'primary' : ''}" data-act="${cta[1]}" data-id="${o.id}">${cta[0]}</button></div>`;
  }
  function planRow(o) {
    const un = S.unread(o.id), lm = un && S.lastMessage(o.id);
    const going = S.going(o.id).map((x) => S.userById[x.userId]);
    return `<button class="tl tlmain" data-act="${un ? 'openChat' : 'openOuting'}" data-id="${o.id}"><span class="lead emo">${HOP.oicon(o)}${un ? `<b class="ub">${un}</b>` : ''}</span>
      <div class="grow"><div class="t">${esc(o.title)} <span class="tlwhen">${when(o.startsAt)}</span></div>
      <div class="s">${lm ? `<span class="lm">${esc(HOP.chatPreview(lm))}</span> · ${since(lm.at)}` : `${avatarStack(going, 4, 18)} <span data-live="going-${o.id}">${going.length} going</span> · ${plural(S.stopsOf(o.id).length, 'stop')}`}</div></div>${I('chev')}</button>`;
  }
  function friendsRow(out) {
    const places = {};
    out.forEach((f) => { const k = f.venueId || f.eventId; (places[k] ||= []).push(f); });
    const top = Object.entries(places).sort((a, b) => b[1].length - a[1].length).slice(0, 2)
      .map(([k, fs]) => `${esc(fs[0].user.first)}${fs.length > 1 ? ` + ${fs.length - 1}` : ''} at ${esc(S.venueById[k]?.name || HOP.events.byId(k)?.title || '')}`);
    return `<button class="tl tlmain" data-act="friendsOut">${avatarStack(out.map((f) => f.user), 5, 28)}
      <div class="grow"><div class="t"><span data-live="friends-out">${out.length}</span> friends out</div><div class="s">${top.join(' · ')}</div></div>${I('chev')}</button>`;
  }

  // ---------- sections ----------
  function friendsSection(out) {
    if (!out.length) return '';
    const places = {};
    out.forEach((f) => { const k = f.venueId || 'e:' + f.eventId; (places[k] ||= []).push(f); });
    const rows = Object.entries(places).sort((a, b) => b[1].length - a[1].length).slice(0, 6).map(([k, fs]) => {
      const v = S.venueById[k], e = k.startsWith('e:') && HOP.events.byId(k.slice(2));
      const names = fs.map((f) => f.user.first);
      const o = fs[0].outingId && S.outing(fs[0].outingId);
      return `<button class="row" data-act="${v ? 'venueFromList' : 'openEvent'}" data-id="${v ? k : k.slice(2)}">${avatarStack(fs.map((f) => f.user), 3, 30)}
        <div class="grow"><div class="t">${esc(names.slice(0, 2).join(', '))}${names.length > 2 ? ` + ${names.length - 2}` : ''}</div>
        <div class="s">${esc(v ? v.name : e.title)}${o ? ` · ${esc(o.title)}` : ''} · ${since(Math.min(...fs.map((f) => f.since)))}</div></div>${I('chev')}</button>`;
    }).join('');
    return `<div class="section"><p class="label"><span>Friends tonight</span><button class="linkbtn" data-act="friendsOut">All ${out.length}</button></p><div class="rows">${rows}</div></div>`;
  }
  function startingSection(title = 'Starting soon', whenKey = 'tonight') {
    const now = HOP.now();
    const list = HOP.events.filter({ when: whenKey }).filter((e) => e.endsAt > now).sort((a, b) => Math.max(a.startsAt, now) - Math.max(b.startsAt, now));
    if (!list.length) return '';
    return `<div class="section"><p class="label"><span>${title}</span><button class="linkbtn" data-act="whatson" data-when="${whenKey}">See all ${list.length}</button></p>
      <div class="rows">${list.slice(0, 5).map((e) => HOP.eventRow(e)).join('')}</div></div>`;
  }
  function busySection(whenKey = 'now', title = 'Busy tonight') {
    const rows = A.AREAS.map((a) => ({ a, info: A.areaInfo(a.id, whenKey), pub: A.areaPublic(a.id, whenKey) }))
      .filter((x) => x.info.lv >= 2).sort((x, y) => y.info.heat - x.info.heat).slice(0, 5);
    if (!rows.length) return '';
    return `<div class="section"><p class="label"><span>${title}</span>${!HOP.map.heatOn ? '<button class="linkbtn" data-act="toggleHeat">Show on map</button>' : ''}</p><div class="rows">${rows.map(({ a, info, pub }) => `
      <button class="row" data-act="openArea" data-id="${a.id}"><span class="iconbtn lvbox lv${info.lv}">${A.meter(info.lv)}</span>
        <div class="grow"><div class="t">${esc(a.name)} <span class="lvw lv${info.lv}">${whenKey === 'now' ? info.level : 'Expected ' + info.level.toLowerCase()}</span></div>
        <div class="s">${whenKey === 'now' ? esc(info.note) : info.span ? `Busy ${esc(info.span)}` : esc(info.note)}${pub.events.length ? ` · ${pub.events.length} on` : ''}</div></div>
        ${pub.friends.length ? avatarStack(pub.friends.map((f) => f.user), 3, 22) : ''}</button>`).join('')}</div></div>`;
  }
  function photosSection(title = 'Recent photos', maxAge = 3 * 36e5) {
    const now = HOP.now();
    const ps = S.state.photos.filter((p) => p.visibility === 'outing' && now - p.takenAt < maxAge && now >= p.takenAt)
      .filter((p) => { const o = S.outing(p.outingId); return o && (S.myAttendance(o.id) || o.visibility === 'public'); })
      .sort((a, b) => b.takenAt - a.takenAt);
    if (!ps.length) return '';
    const byOuting = {};
    ps.forEach((p) => (byOuting[p.outingId] ||= []).push(p));
    const lines = Object.entries(byOuting).slice(0, 2).map(([oid, l]) => `${esc(S.outing(oid).title)} · ${plural(l.length, 'photo')} · last ${since(l[0].takenAt)} ago`);
    return `<div class="section"><p class="label"><span>${title}</span></p>
      <div class="strip">${ps.slice(0, 12).map((p) => `<button data-act="viewPhoto" data-id="${p.outingId}" data-p="${p.id}">${photoTag(p, 200, 250)}<span class="by">${avatar(S.userById[p.userId], 20)}</span>${HOP.fresh.has(p.id) ? '<span class="newdot"></span>' : ''}</button>`).join('')}</div>
      <p class="meta stripmeta">${lines.join('<br>')}</p></div>`;
  }
  function popularSection(title = 'Popular near you') {
    const list = S.venues.filter((v) => v.cat !== 'spot').map((v) => ({ v, a: S.activity(v.id), d: HOP.map.distanceFromMe(v) }))
      .filter((x) => x.a.hot && x.d < 2500).sort((a, b) => b.a.busy - a.a.busy).slice(0, 5);
    if (!list.length) return '';
    return `<div class="section"><p class="label">${title}</p><div class="rows">${list.map(({ v }) => HOP.venueRow(v)).join('')}</div></div>`;
  }
  function savedSection() {
    const cols = S.collections().filter((c) => c.items.length);
    if (!cols.length) return '';
    return `<div class="section"><p class="label"><span>Saved</span><button class="linkbtn" data-act="savedLists">All lists</button></p><div class="colchips">${cols.map((c) => `<button data-act="savedLists" data-c="${c.id}"><b>${esc(c.name)}</b><span>${plural(c.items.length, 'place')}</span></button>`).join('')}</div></div>`;
  }
  function plansSection(list, title = 'Your plans') {
    if (!list.length) return '';
    return `<div class="section"><p class="label">${title}</p><div class="rows tonrows">${list.map(planRow).join('')}</div></div>`;
  }

  // ---------- the sheet ----------
  // PEEK: three one-line rows, the whole sheet ~18% of the screen. EXPLORE (~50%) and FULL (~90%) add sections.
  const pk = (act, id, lead, main, sub, extra = '') => `<div class="pk"><button class="pkmain" data-act="${act}" ${id ? `data-id="${id}"` : ''}>${lead}<span class="pkt"><b>${main}</b>${sub ? ` <em>${sub}</em>` : ''}</span>${extra ? '' : I('chev', 16)}</button>${extra}</div>`;
  const icoLead = (svg) => `<span class="pklead">${svg}</span>`;
  HOP.tonightSheet = () => {
    const now = HOP.now();
    const ph = phase();
    const { live, upcoming, invites, memories } = S.myOutings();
    const mine = live.find((o) => S.myAttendance(o.id)?.rsvp === 'going');
    const myPlans = upcoming.filter((o) => S.myAttendance(o.id)?.rsvp === 'going');
    const others = S.tonightOutings().filter((o) => S.myAttendance(o.id)?.rsvp !== 'going');
    const out = S.friendsOut();
    const evTonight = HOP.events.filter({ when: 'tonight' });
    const soonNear = evTonight.filter((e) => e.endsAt > now && e.startsAt - now < 120 * 6e4 && metres(HOP.map.ME, HOP.events.placeOf(e)) < 2500).sort((x, y) => x.startsAt - y.startsAt);
    const hottest = A.AREAS.map((a) => A.areaInfo(a.id, 'now')).sort((a, b) => b.heat - a.heat)[0];
    const nearMe = out.filter((f) => { const p = f.venueId ? S.venueById[f.venueId] : HOP.events.placeOf(HOP.events.byId(f.eventId)); return p && metres(HOP.map.ME, p) < 1500; });
    const quietNearby = !nearMe.length && !evTonight.some((e) => metres(HOP.map.ME, HOP.events.placeOf(e)) < 1500);
    const d = new Date(now);

    // peek candidates, in time-of-day order
    const rows = {
      live: mine && (() => { const st = S.stopsOf(mine.id), cur = st[mine.live.current]; return pk('openLive', mine.id, icoLead(HOP.oicon(mine, 16)), esc(mine.title), `At ${esc(S.stopName(cur))} · ${since(mine.live.arrivedAt)}`, `<button class="pkcam" data-act="camera" data-id="${mine.id}" aria-label="Take a photo">${I('camera', 18)}</button>`); })(),
      plan: (() => { const o = myPlans.find((x) => !mine || x.id !== mine.id); if (!o) return ''; const un = S.unread(o.id); return pk(un ? 'openChat' : 'openOuting', o.id, icoLead(HOP.oicon(o, 16)), esc(o.title), `${esc(when(o.startsAt).replace(', ', ' · '))} · <span data-live="going-${o.id}">${S.going(o.id).length} going</span>${un ? ` · <span class="pkun">${un} new</span>` : ''}`); })(),
      friends: out.length ? pk('friendsOut', '', `<span class="pkstack">${avatarStack(out.map((f) => f.user), 3, 20)}</span>`, `<span data-live="friends-out">${out.length}</span> friends are out`, (() => { const g = {}; out.forEach((f) => { const k = f.venueId || f.eventId; (g[k] ||= []).push(f); }); const [k, fs] = Object.entries(g).sort((x, y) => y[1].length - x[1].length)[0]; return `${esc(fs[0].user.first)}${fs.length > 1 ? ` + ${fs.length - 1}` : ''} at ${esc(S.venueById[k]?.name || HOP.events.byId(k)?.title || '')}`; })()) : '',
      soon: soonNear.length ? (() => { const st = soonNear.filter((e) => e.startsAt > now); return st.length ? pk('whatson', '', icoLead(I('ticket', 16)), `${st.length} ${st.length === 1 ? 'thing' : 'things'} starting nearby`, esc(HOP.util.startsIn(st[0].startsAt).replace('Starts in', 'first in'))) : pk('whatson', '', icoLead(I('ticket', 16)), `${soonNear.length} ${soonNear.length === 1 ? 'thing' : 'things'} on nearby`, esc(soonNear[0].title)); })() : '',
      invite: (() => { const o = invites[0] || others.filter((x) => S.myAttendance(x.id)?.rsvp === 'invited')[0]; if (!o) return ''; const host = S.userById[o.organiserId]; return pk('openOuting', o.id, `<span class="pklead av">${avatar(host, 22)}</span>`, `${esc(host.first)} invited you`, `${esc(o.title)} · ${esc(when(o.startsAt))}`); })(),
      memory: memories[0] ? pk('openOuting', memories[0].id, icoLead(HOP.oicon(memories[0], 16)), esc(memories[0].title), `${plural(S.photosOf(memories[0].id).length, 'photo')} · ${ago(memories[0].startsAt)}`) : '',
      busy: hottest && hottest.lv >= 2 ? pk('openArea', hottest.area.id, `<span class="pklead lvbox lv${hottest.lv}">${A.meter(hottest.lv)}</span>`, `${esc(hottest.area.name)} ${hottest.level.toLowerCase()} now`, esc(hottest.note)) : '',
    };
    const order = { morning: ['live', 'memory', 'plan', 'invite', 'soon'], afternoon: ['live', 'plan', 'invite', 'soon', 'friends'], evening: ['live', 'plan', 'friends', 'soon', 'invite', 'busy'], late: ['live', 'friends', 'busy', 'soon', 'plan'] }[ph];
    let peek = order.map((k) => rows[k]).filter(Boolean).slice(0, 3);
    if (!peek.length) peek.push(pk('create', '', icoLead(I('plus', 16)), 'Plan something', 'pick a few places, send the link').replace('data-act="create"', 'data-go="create"'));

    // glance line (explore): the most current facts, in words
    const glance = [];
    if (hottest && hottest.lv >= 2) glance.push(`${hottest.area.name} ${hottest.level.toLowerCase()} now${hottest.trend === 'rising' ? ', activity rising' : ''}`);
    if (ph === 'afternoon') { const later = A.AREAS.map((a) => A.areaInfo(a.id, 'later')).sort((a, b) => b.heat - a.heat)[0]; if (later) glance.push(`${later.area.name} expected ${later.level.toLowerCase()} tonight`); }

    const plans = plansSection(mine ? [mine, ...myPlans.filter((o) => o.id !== mine.id)] : myPlans, 'Your plans');
    const sections = {
      morning: () => [plans, recentFromFriends('New photos', 36 * 36e5), startingSection('This weekend', 'weekend'), savedSection()],
      afternoon: () => [plans, busySection('later', 'Expected busy tonight'), startingSection('What’s happening later', 'tonight'), friendsSection(out), popularSection('Popular tonight'), savedSection()],
      evening: () => [quietNearby ? `<div class="section"><p class="empty quietnote">Nothing much near you yet. Here’s what’s happening across Sydney.</p></div>` : '',
        plans, friendsSection(out), startingSection('What’s happening'), popularSection('Popular tonight'), busySection('now', 'Busy areas'), recentFromFriends(), savedSection()],
      late: () => [mine ? whereNextSection(mine) : '', friendsSection(nearMe.length ? nearMe : out), busySection('now', 'Still busy'), popularSection('Still going'), recentFromFriends(), startingSection('Still on', 'tonight'), plans],
    }[ph]().join('');

    return `<div class="tonhead" data-drag><p class="label"><span class="amber">${PHASE_LABEL[ph]}</span> · ${HOP.util.DAYS_LONG[d.getDay()].slice(0, 3)} ${time(now)}${previewHour != null ? ' · preview' : ''}</p>
        <button class="linkbtn" data-act="whatson">${evTonight.length} on ${I('chev', 13)}</button></div>
      <div class="pkrows">${peek.join('')}</div><div class="peek-end"></div>
      ${glance.length ? `<p class="glance">${esc(glance.join(' · '))}</p>` : ''}
      ${sections}
      <p class="meta srcnote">Busy levels combine venue patterns, public events, crowd reports and anonymous activity. Crowd reports, public photos and the wider city population are demo data in this prototype.</p>`;
  };

  // Friends from your outings: recent photos (only outings you're on, or public ones)
  function recentFromFriends(title = 'Recent from friends', maxAge = 3 * 36e5) { return photosSection(title, maxAge); }

  // ---------- lens sheets (FRIENDS / PLACES) ----------
  HOP.lensSheet = (lens, sub) => {
    if (lens === 'friends') {
      const out = S.friendsOut();
      const outs = S.tonightOutings();
      const body = sub === 'outings'
        ? (outs.length ? `<div class="rows tonrows">${outs.map((o) => (S.myAttendance(o.id)?.rsvp === 'going' ? planRow(o) : otherOutingRow(o))).join('')}</div>` : '<p class="empty">No outings you can see tonight yet.</p>')
        : sub === 'recent' ? (recentFromFriends('Photos', 6 * 36e5) || '<p class="empty">No photos from friends in the last few hours.</p>')
        : (friendsSection(out).replace('<p class="label"><span>Friends tonight</span>', '<p class="label"><span>Where they are</span>') || '<p class="empty">None of your friends are sharing where they are right now.</p>');
      return `<div class="tonhead" data-drag><p class="label"><span class="amber">Friends</span> · ${out.length} out now</p></div><div class="peek-end"></div>${body}
        <p class="meta srcnote">Only friends who share where they are, or who are on an outing you can see. Sharing is always opt-in.</p>`;
    }
    // places
    const late = (v) => /till ([1-5])\s?am/i.test(v.hours) || (HOP.seed.POP[v.id]?.[1] || 0) >= 23 || v.cat === 'club';
    const list = S.venues.filter((v) => v.cat !== 'spot' && (sub === 'all' || !sub || v.cat === sub || (sub === 'bar' && v.cat === 'gig') || (sub === 'late' && late(v))))
      .map((v) => ({ v, a: S.activity(v.id), dd: HOP.map.distanceFromMe(v) })).sort((x, y) => (y.a.busy - y.dd / 4000) - (x.a.busy - x.dd / 4000));
    const hot = list.filter((x) => x.a.hot);
    return `<div class="tonhead" data-drag><p class="label"><span class="amber">Places</span> · ${hot.length} busy now</p></div><div class="peek-end"></div>
      <div class="section"><p class="label">Popular now</p><div class="rows">${list.slice(0, 6).map(({ v }) => HOP.venueRow(v)).join('')}</div></div>
      <div class="section"><p class="label">More nearby</p><div class="rows">${list.slice(6, 20).sort((x, y) => x.dd - y.dd).map(({ v }) => HOP.venueRow(v)).join('')}</div></div>`;
  };

  // ---------- WHERE NEXT? ----------
  // Ranked from distance, busy now and expected, events, friends, saved places, chat votes and the route.
  HOP.whereNext = (o, n = 3) => {
    const st = S.stopsOf(o.id);
    const cur = o.live ? st[o.live.current] : st[st.length - 1];
    const from = cur ? S.placeOf(cur) : HOP.map.ME;
    const nxt = o.live && st[o.live.current + 1];
    const taken = new Set(st.map((x) => x.venueId));
    const saved = new Set(S.saved());
    const keen = {};
    S.messagesOf(o.id).forEach((m) => { if (m.kind === 'place' && m.place?.venueId) keen[m.place.venueId] = (keen[m.place.venueId] || 0) + (m.keen?.length || 0) + 1; });
    const now = HOP.now();
    return S.venues.filter((v) => ['bar', 'pub', 'club', 'gig'].includes(v.cat) && !taken.has(v.id))
      .map((v) => {
        const d = metres(from, v);
        if (d > 2000) return null;
        const a = S.activity(v.id);
        const ar = A.areaOfVenue(v);
        const later = ar ? A.levelAt(ar.id, now + 60 * 6e4).heat : 0.3;
        const ev = HOP.events.tonightAt(v.id).find((e) => e.endsAt > now && e.startsAt - now < 120 * 6e4);
        const rep = S.reportsAt(v.id);
        const towardNext = nxt ? Math.max(0, 1 - metres(v, S.placeOf(nxt)) / 1500) * 0.1 : 0;
        const score = a.busy * 0.45 + later * 0.2 + a.friends.length * 0.12 + (ev ? 0.15 : 0) + (saved.has(v.id) ? 0.1 : 0) + (keen[v.id] || 0) * 0.08 + towardNext
          - d / 2600 - (a.lv === 0 ? 0.25 : 0) - (rep.queue?.value === 'long' ? 0.15 : 0) - (rep.crowd?.value === 'packed' ? 0.05 : 0);
        return { v, d, a, ev, rep, score, saved: saved.has(v.id) };
      }).filter(Boolean).sort((x, y) => y.score - x.score).slice(0, n);
  };
  function whereNextSection(o) {
    const list = HOP.whereNext(o);
    if (!list.length) return '';
    return `<div class="section"><p class="label"><span>Where next?</span></p><div class="wn">${list.map(({ v, d, a, ev, rep, saved }) => {
      const bits = [`${Math.max(1, Math.round(d / 80))} min walk`, `<span class="lvw lv${a.lv}">${a.label}</span>`, a.friends.length ? `${a.friends.length} ${a.friends.length === 1 ? 'friend' : 'friends'} there` : ''].filter(Boolean).join(' · ');
      const extra = [ev ? `${esc(ev.title)} · ${HOP.util.startsIn(ev.startsAt, ev.endsAt)}` : '', rep.queue ? `Queue ${rep.queue.label.toLowerCase()}` : '', saved ? 'Saved' : ''].filter(Boolean).join(' · ');
      return `<div class="wnrow"><button class="wnmain" data-act="venue" data-id="${v.id}">${photoTag({ id: v.id, u: v.img }, 120, 120, 'thumb')}<div class="grow"><div class="t">${esc(v.name)}</div><div class="s">${bits}</div>${extra ? `<div class="s dim">${extra}</div>` : ''}</div></button>
        <div class="wnact">${S.isOrganiser(o) ? `<button class="btn sm primary" data-act="wnAdd" data-o="${o.id}" data-v="${v.id}">Add stop</button>` : ''}<button class="btn sm" data-act="wnVote" data-o="${o.id}">Vote</button></div></div>`;
    }).join('')}</div></div>`;
  }
  HOP.whereNextSection = whereNextSection;
  HOP.actions.wnAdd = (d) => {
    const o = S.outing(d.o); const st = S.stopsOf(o.id);
    const cur = st[o.live ? o.live.current : st.length - 1], nx = o.live && st[o.live.current + 1];
    let at = HOP.now() + 45 * 6e4;
    if (nx) at = Math.max(cur.at + 6e4, Math.min(at, nx.at - 6e4));
    const s = S.addStop(o.id, d.v, at);
    if (s) ui.toast(`${esc(S.venueById[d.v].name)} is the next stop`);
    HOP.app.render({ keepScroll: true });
  };
  HOP.actions.wnVote = (d) => {
    const o = S.outing(d.o);
    const open = S.messagesOf(o.id).filter((m) => m.kind === 'poll' && !m.poll.closed).pop();
    if (open) { ui.toast('There’s already a vote going in the chat'); HOP.actions.openChat({ id: o.id }); return; }
    const opts = HOP.whereNext(o).map(({ v }) => ({ venueId: v.id, votes: [] }));
    const st = S.stopsOf(o.id), cur = st[o.live ? o.live.current : st.length - 1];
    const m = S.postMessage(o.id, { kind: 'poll', poll: { q: `Where after ${cur ? S.stopName(cur) : 'this'}?`, closed: false, options: opts } });
    HOP.sim.chatVotes(o.id, m.id);
    ui.toast('Vote sent to the chat');
    HOP.actions.openChat({ id: o.id });
  };

  // ---------- saved collections ----------
  HOP.actions.savedLists = (d = {}) => {
    const cols = S.collections();
    const pick = HOP.app.picking;
    const draw = (cid) => {
      const c = cid && cols.find((x) => x.id === cid);
      if (!c) return `<div class="mhead"><h2 class="h2">Saved</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
        <div class="rows">${cols.map((x) => `<button class="row" data-act="savedOpen" data-c="${x.id}"><span class="colic">${I('bookmark', 16)}</span><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${esc(x.items.slice(0, 3).map((i) => (i.venueId ? S.venueById[i.venueId]?.name : HOP.events.byId(i.eventId)?.title)).filter(Boolean).join(', ')) || 'Empty'}</div></div><span class="mono dim">${x.items.length}</span>${I('chev', 16)}</button>`).join('')}</div>`;
      return `<div class="mhead"><button class="iconbtn bare" data-act="savedOpen" data-c="" aria-label="Back">${I('back')}</button><h2 class="h2 grow">${esc(c.name)}</h2><button class="iconbtn bare" data-act="closeModal" aria-label="Close">${I('close')}</button></div>
        ${pick ? `<p class="meta" style="margin:0 0 8px">Tap one to add it to ${esc(S.outing(pick).title)}.</p>` : ''}
        <div class="rows">${c.items.map((i) => {
          if (i.venueId) { const v = S.venueById[i.venueId]; return v ? HOP.venueRow(v).replace('data-act="venue"', 'data-act="savedVenue"') : ''; }
          const e = HOP.events.byId(i.eventId); return e ? HOP.eventRow(e).replace('data-act="openEvent"', 'data-act="savedEvent"') : '';
        }).join('') || '<p class="empty">Nothing saved here yet. Tap Save on any place or event.</p>'}</div>`;
    };
    ui.openModal(draw(d.c));
    HOP.actions.savedOpen = (x) => { document.querySelector('#modal .msheet').innerHTML = draw(x.c); };
    HOP.actions.savedVenue = (x) => { ui.closeModal(); HOP.app.openVenue(x.id); };
    HOP.actions.savedEvent = (x) => { ui.closeModal(); HOP.actions.openEvent({ id: x.id }); };
  };

  // ---------- area sheet (tap a neighbourhood, or an active part of the heat) ----------
  HOP.screens.area = {
    nav: 'home', mapMode: 'default',
    render({ id }) {
      const a = A.byId[id];
      const when = HOP.map.heatWhen;
      const info = A.areaInfo(id, when);
      const now = A.areaInfo(id, 'now');
      const pub = A.areaPublic(id, when);
      const pubNow = when === 'now' ? pub : A.areaPublic(id, 'now');
      const evs = (pub.events.length ? pub.events : A.areaPublic(id, 'tonight').events).filter((e) => e.endsAt > HOP.now());
      const soon = evs.slice().sort((x, y) => x.startsAt - y.startsAt).slice(0, 4);
      const why = A.why(id, when);
      const popular = pub.venues.filter((x) => x.act.busy >= 0.43).slice(0, 5);
      const photos = pub.venues.flatMap((x) => S.venuePhotos(x.v.id)).sort((p, q) => q.takenAt - p.takenAt);
      const fr = pubNow.friends;
      const isNow = when === 'now';
      const lvl = isNow ? info : info;
      const facts = [fr.length ? `${fr.length} ${fr.length === 1 ? 'friend' : 'friends'} around` : '', evs.length ? `${evs.length} ${evs.length === 1 ? 'event' : 'events'} ${when === 'now' || when === 'later' ? 'tonight' : ''}`.trim() : '', popular.length ? `${popular.length} popular ${popular.length === 1 ? 'venue' : 'venues'}` : ''].filter(Boolean);
      return {
        top: `<div class="floatbar"><button class="fbtn" data-act="back" aria-label="Back">${I('back')}</button></div>`,
        sizes: ['half', 'full'],
        sheet: `<div data-drag><p class="label">Area${isNow ? '' : ' · forecast'}</p><h1 class="h1 areah">${esc(a.name)}</h1>
          <div class="arealine lv${lvl.lv}">${A.meter(lvl.lv)}<b class="lvw lv${lvl.lv}" data-live="areah-${id}">${isNow ? `${lvl.level} now` : `Expected ${lvl.level.toLowerCase()}`}</b>${isNow && now.trend === 'rising' ? '<span>Activity rising</span>' : ''}</div>
          ${info.span ? `<p class="meta peakline">Peak expected ${esc(info.peakLevel.toLowerCase())} · ${esc(info.span)}</p>` : info.peak ? `<p class="meta peakline">${esc(info.peak)}</p>` : ''}
          ${why.length && lvl.lv >= 2 ? `<p class="why">Busy because of ${esc(why.join(', '))}.</p>` : ''}
          ${facts.length ? `<div class="afacts">${facts.map((f) => `<span>${f}</span>`).join('')}</div>` : ''}</div>
          ${popular.length ? `<div class="section"><p class="label">Popular now</p><div class="rows">${popular.map(({ v }) => HOP.venueRow(v)).join('')}</div></div>` : ''}
          ${soon.length ? `<div class="section"><p class="label">Starting soon</p><div class="rows">${soon.map((e) => HOP.eventRow(e)).join('')}</div></div>` : ''}
          ${fr.length ? `<div class="section"><p class="label">Friends around here</p><div class="herenow">${avatarStack(fr.map((f) => f.user), 6, 28)}<span><b>${esc(fr.slice(0, 2).map((f) => f.user.first).join(', '))}</b>${fr.length > 2 ? ` + ${fr.length - 2}` : ''}</span></div></div>` : ''}
          ${photos.length ? `<div class="section"><p class="label"><span>Recent · ${plural(photos.length, 'public photo')}</span><span class="dim">${ago(photos[0].takenAt)}</span></p><div class="strip">${photos.slice(0, 10).map((p) => `<button data-act="viewPhoto" data-vp="${p.venueId}" data-p="${p.id}">${photoTag(p, 200, 250)}</button>`).join('')}</div></div>` : ''}
          <div class="section"><p class="label">All places here</p><div class="rows">${pub.venues.filter((x) => !popular.includes(x)).slice(0, 8).map(({ v }) => HOP.venueRow(v)).join('') || '<p class="empty">No places listed here yet.</p>'}</div></div>
          <p class="meta srcnote">Area activity is anonymous and aggregated. It never shows private outings, who is where, or anyone’s route.</p>`,
        map() { HOP.map.setSelected(null); HOP.map.showRoute(null); HOP.map.fitTo([{ lat: a.lat - a.r / 111000, lng: a.lng - a.r / 92000 }, { lat: a.lat + a.r / 111000, lng: a.lng + a.r / 92000 }], { maxZoom: 15.6 }); },
      };
    },
  };
  HOP.actions.openArea = (d) => HOP.app.go('area', { id: d.id }, { replace: HOP.app.route.name === 'area' });
  HOP.actions.toggleHeat = () => { HOP.map.setHeat(!HOP.map.heatOn); HOP.app.syncHeatUi(); HOP.app.render({ keepScroll: true, sheetOnly: true }); };
})();

</script>
<script>
/* HOP — app shell: routing, re-rendering on data changes, notifications, and the
   prototype's group simulator (stands in for other people's phones). */
(() => {
  const { esc, plural, photoTag, avatar, time, pick, uid } = HOP.util;
  const I = HOP.icon;
  const S = HOP.store;
  const ui = HOP.ui;

  // ---------------- routing ----------------
  let route = { name: 'home', params: {} };
  let hist = [];
  const IMMERSIVE = new Set(['pick', 'create', 'live']);

  function go(name, params = {}, opts = {}) {
    if (name === 'create' && params.go === 'create') params = { fresh: 1 };
    if (params.go) { // a tab tap: start that tab fresh
      hist = []; HOP.app.picking = null; HOP.app.searching = false; HOP.clearQuery();
      ui.closeAllLayers(); ui.closeModal();
      if (name === 'create') params = { fresh: 1 };
    } else if (opts.resetTo) {
      hist = opts.resetTo === name ? [] : [{ name: opts.resetTo, params: {} }];
    } else if (!opts.replace) hist.push(route);
    route = { name, params };
    render({ fresh: true });
  }
  function back() {
    if (ui.modalOpen()) return ui.closeModal();
    if (ui.closeLayer()) return;
    if (HOP.app.searching && (route.name === 'home' || route.name === 'pick')) {
      HOP.app.searching = false; const q = document.getElementById('q'); if (q) { q.value = ''; q.blur(); }
      return render({ sheetOnly: true, sizes: route.name === 'home' ? ['peek', 'full'] : ['auto', 'half'] });
    }
    if (route.name === 'pick') return HOP.actions.donePicking();
    route = hist.pop() || { name: 'home', params: {} };
    if (route.name === 'venue' && !S.venueById[route.params.id]) route = { name: 'home', params: {} };
    render({ fresh: true });
  }

  function render(opts = {}) {
    const sc = HOP.screens[route.name];
    const out = sc.render(route.params);
    document.body.classList.toggle('hide-nav', IMMERSIVE.has(route.name));
    if (!opts.sheetOnly) ui.setTop(out.top);
    ui.setSheet(out.sheet, {
      sizes: opts.fresh || opts.resize ? out.sizes : opts.sizes,
      sizeIdx: opts.fresh || opts.resize ? out.sizeIdx || 0 : opts.sizes ? 0 : undefined,
      keepScroll: !opts.fresh,
      onSize: (size) => (document.body.dataset.sheet = size),
    });
    document.body.dataset.sheet = ui.currentSize();
    document.querySelectorAll('#nav [data-go]').forEach((b) => b.classList.toggle('on', b.dataset.go === sc.nav));
    // During your live outing the centre action becomes the camera
    const navC = document.querySelector('#nav .create');
    const myLive = S.myOutings().live.find((o) => S.myAttendance(o.id)?.rsvp === 'going');
    if (navC && myLive && navC.dataset.id !== myLive.id) { delete navC.dataset.go; navC.dataset.act = 'camera'; navC.dataset.id = myLive.id; navC.classList.add('cam'); navC.setAttribute('aria-label', 'Take a photo'); navC.innerHTML = I('camera', 24); }
    else if (navC && !myLive && navC.dataset.act) { delete navC.dataset.act; delete navC.dataset.id; navC.dataset.go = 'create'; navC.classList.remove('cam'); navC.setAttribute('aria-label', 'New outing'); navC.innerHTML = I('plus', 24); }
    // one-tap camera whenever you're on a live outing
    const fab = document.getElementById('camfab');
    const liveMine = route.name === 'live' && S.outing(route.params.id)?.status === 'live' && S.myAttendance(route.params.id)?.rsvp === 'going';
    fab.hidden = !liveMine;
    if (liveMine) fab.dataset.id = route.params.id;
    if (opts.fresh) HOP.map.setMode(route.name === 'venue' && HOP.app.picking ? 'pick' : sc.mapMode || 'focus');
    if (opts.fresh && out.map) out.map();
    else if (!opts.sheetOnly && out.mapUpdate) out.mapUpdate();
    if (sc.mount) sc.mount(route.params);
    document.body.classList.toggle('mapbrowse', ['home', 'venue', 'whatson', 'event', 'area', 'pick'].includes(route.name));
    bump();
  }

  // Movement only when something meaningful changed: any element marked data-live="key"
  // whose text differs from last time gets a brief nudge.
  const lastSeen = new Map();
  function bump() {
    document.querySelectorAll('[data-live]').forEach((el) => {
      const k = el.dataset.live, v = el.textContent;
      if (lastSeen.has(k) && lastSeen.get(k) !== v) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
      lastSeen.set(k, v);
    });
  }
  HOP.bump = bump;

  let mapQueued = null;
  function mapRefresh() { clearTimeout(mapQueued); mapQueued = setTimeout(() => { HOP.map.refreshLive(); bump(); }, 120); }
  let queued = false;
  function softRender() {
    if (queued) return; queued = true;
    requestAnimationFrame(() => {
      queued = false;
      if (route.name === 'create') return;
      const sc = HOP.screens[route.name];
      const typing = document.activeElement && document.activeElement.id === 'q';
      render({ keepScroll: true, sheetOnly: sc.refreshSheetOnly || typing });
    });
  }

  // ---------------- data changes ----------------
  const fresh = new Set();
  HOP.fresh = fresh;
  S.on((type, p) => {
    if (type === 'me') { hist = []; route = { name: route.name === 'live' || route.name === 'outing' || route.name === 'memory' ? route.name : 'home', params: route.params }; render({ fresh: true }); return; }
    if (type === 'reset') return;

    if (type === 'photos:add') {
      p.ids?.forEach((id) => { fresh.add(id); setTimeout(() => fresh.delete(id), 9000); });
      if (p.visibility === 'outing' && p.userId !== S.meId && S.myAttendance(p.outingId)?.rsvp === 'going') queuePhotoNote(p);
      // the photo floats up from wherever it was taken
      const o = S.outing(p.outingId), ph = S.state.photos.find((x) => x.id === p.ids?.[p.ids.length - 1]);
      const st = ph && S.state.stops.find((x) => x.id === ph.stopId);
      if (st && p.visibility === 'outing' && (S.myAttendance(o.id) || o.visibility === 'public')) HOP.map.pop(S.placeOf(st), ph, S.userById[p.userId]);
    }
    mapRefresh();
    // someone else started / ended a night you're on
    if (p.remote && type === 'live:start' && S.myAttendance(p.id)) {
      const o = S.outing(p.id);
      ui.banner({ lead: `<span class="livepill">LIVE</span>`, title: `${esc(o.title)} has started`, text: 'Tap to open the live map', act: 'openLive', data: { id: o.id } });
      if (route.name === 'outing' && route.params.id === p.id) { route = { name: 'live', params: { id: p.id } }; render({ fresh: true }); return; }
    }
    if (p.remote && type === 'live:end' && route.name === 'live' && route.params.id === p.id) { route = { name: 'memory', params: { id: p.id } }; render({ fresh: true }); return; }
    if (type === 'chat:post' && p.userId && p.userId !== S.meId) queueChatNote(p);
    if (type === 'rsvp' && p.userId !== S.meId) {
      const o = S.outing(p.outingId);
      if (o && S.isOrganiser(o) && p.value !== 'invited') {
        const u = S.userById[p.userId];
        ui.banner({ lead: avatar(u, 36), title: `${esc(u.first)} ${{ going: 'is going', maybe: 'might come', declined: 'can’t make it' }[p.value]}`, text: `${esc(o.title)} · ${S.going(o.id).length} going`, act: 'openOuting', data: { id: o.id } });
      }
    }
    if (type === 'invite' && !p.remote) HOP.sim.replies(p.outingId, p.userIds);

    if (HOP.app.albumEl && HOP.app.albumOpen && p.outingId === HOP.app.albumOpen && ui.topLayer() === HOP.app.albumEl) HOP.renderAlbum(HOP.app.albumOpen, HOP.app.albumEl);
    if (type === 'outing:delete' && route.params?.id === p.id) { route = { name: 'home', params: {} }; hist = []; render({ fresh: true }); return; }
    softRender();
  });

  // Batched photo notifications: "Jack added 3 photos…" or "14 new photos were added…"
  const pending = {};
  function queuePhotoNote(p) {
    const q = pending[p.outingId] ||= { users: {}, ids: [], first: Date.now(), t: null };
    q.users[p.userId] = (q.users[p.userId] || 0) + p.count;
    q.ids.push(...(p.ids || []));
    clearTimeout(q.t);
    if (Date.now() - q.first > 6000) flush(p.outingId);
    else q.t = setTimeout(() => flush(p.outingId), 2200);
  }
  function flush(outingId) {
    const q = pending[outingId]; if (!q) return;
    clearTimeout(q.t); delete pending[outingId];
    const o = S.outing(outingId); if (!o) return;
    const who = Object.keys(q.users);
    const total = Object.values(q.users).reduce((a, b) => a + b, 0);
    const thumbs = q.ids.slice(-3).map((id) => S.state.photos.find((x) => x.id === id)).filter(Boolean);
    const single = who.length === 1 && total < 10;
    ui.banner({
      lead: thumbs.length ? `<span class="thumbs">${thumbs.map((t) => photoTag(t, 80, 100)).join('')}</span>` : I('image', 20),
      title: single ? `${esc(S.userById[who[0]].first)} added ${plural(total, 'photo')} to ${esc(o.title)}` : `${total} new photos were added to ${esc(o.title)}`,
      text: single ? 'Tap to see them' : `From ${esc(who.slice(0, 3).map((id) => S.userById[id].first).join(', '))}${who.length > 3 ? ` and ${who.length - 3} more` : ''}`,
      act: 'notifAlbum', data: { id: outingId }, timeout: 5200,
    });
  }
  // Chat notifications respect All / Mentions only / Mute, never fire for system lines,
  // and stay quiet while you're looking at that chat
  const chatPending = {};
  function queueChatNote(p) {
    const o = S.outing(p.outingId);
    if (!o || !S.canChat(o)) return;
    const m = S.state.messages.find((x) => x.id === p.id);
    if (!m) return;
    if (HOP.chatOpenFor() === o.id && !document.hidden) return;
    const pref = S.chatPref(o.id);
    if (pref === 'mute' || (pref === 'mentions' && !S.mentionsMe(m))) return;
    const q = chatPending[o.id] ||= { msgs: [], t: null };
    q.msgs.push(m);
    clearTimeout(q.t);
    q.t = setTimeout(() => {
      delete chatPending[o.id];
      const last = q.msgs[q.msgs.length - 1];
      ui.banner({ lead: avatar(S.userById[last.userId], 36), title: `${esc(o.title)}`,
        text: q.msgs.length > 1 ? `${q.msgs.length} new messages · ${esc(HOP.chatPreview(last))}` : esc(HOP.chatPreview(last)),
        act: 'openChat', data: { id: o.id } });
    }, 1400);
  }
  HOP.actions.notifAlbum = (d) => { if (HOP.app.albumOpen !== d.id) { ui.closeModal(); HOP.openAlbum(d.id); HOP.app.albumEl = ui.topLayer(); } };
  const _open = HOP.openAlbum;
  HOP.openAlbum = (id) => { _open(id); HOP.app.albumEl = ui.topLayer(); };
  HOP.actions.album = (d) => HOP.openAlbum(d.id);

  // ---------------- group simulator (prototype only) ----------------
  const LEAD_KEY = 'hop.simLeader';
  const nextAt = {}, chatAt = {};
  HOP.sim = {
    isLeader() {
      try {
        const v = JSON.parse(localStorage.getItem(LEAD_KEY) || 'null');
        if (!v || v.tab === S.TAB || Date.now() - v.t > 4000) { localStorage.setItem(LEAD_KEY, JSON.stringify({ tab: S.TAB, t: Date.now() })); return true; }
        return false;
      } catch (e) { return true; }
    },
    photoFor(outingId) {
      const o = S.outing(outingId);
      const st = S.stopsOf(outingId)[o.live ? o.live.current : 0];
      const v = S.venueById[st.venueId];
      const pool = Math.random() < 0.4 ? HOP.seed.P.friends : Math.random() < 0.2 && o.emoji === 'cake' ? HOP.seed.P.party : HOP.seed.poolFor(v?.cat);
      return { u: { id: pool[Math.floor(Math.random() * pool.length)], fx: (0.25 + Math.random() * 0.5).toFixed(2), fy: (0.3 + Math.random() * 0.4).toFixed(2), fz: (1 + Math.random() * 0.8).toFixed(2) } };
    },
    friendPost(outingId, { userId, n } = {}) {
      const others = S.going(outingId).map((a) => a.userId).filter((id) => id !== S.meId);
      if (!others.length) return;
      userId = userId || others[Math.floor(Math.random() * others.length)];
      n = n || [1, 1, 2, 3, 3, 4][Math.floor(Math.random() * 6)];
      S.addPhotos(outingId, Array.from({ length: n }, () => HOP.sim.photoFor(outingId)), { userId, source: Math.random() < 0.75 ? 'camera' : 'upload' });
    },
    burst(outingId) {
      const others = S.going(outingId).map((a) => a.userId).filter((id) => id !== S.meId).sort(() => Math.random() - 0.5).slice(0, 5);
      [4, 3, 3, 2, 2].forEach((n, i) => others[i] && setTimeout(() => HOP.sim.friendPost(outingId, { userId: others[i], n }), 250 + i * 380));
    },
    replies(outingId, userIds) {
      userIds.forEach((id, i) => setTimeout(() => {
        const a = S.attendeesOf(outingId).find((x) => x.userId === id);
        if (!a || a.rsvp !== 'invited') return;
        const r = Math.random();
        S.rsvp(outingId, r < 0.7 ? 'going' : r < 0.9 ? 'maybe' : 'declined', id);
      }, 3500 + i * 2600 + Math.random() * 3000));
    },
    // ---- chat: friends answer, vote and chatter (stands in for their phones) ----
    pickFriend(outingId, not) {
      const ids = S.going(outingId).map((a) => a.userId).filter((id) => id !== S.meId && id !== not);
      return ids[Math.floor(Math.random() * ids.length)];
    },
    chatReply(outingId, text) {
      if (!HOP.sim.isLeader()) return;
      const o = S.outing(outingId);
      const phase = S.chatPhase(o);
      const st = S.stopsOf(outingId);
      const cur = o.live ? st[o.live.current] : st[0];
      const nx = o.live ? st[o.live.current + 1] : st[1];
      const who = HOP.sim.pickFriend(outingId);
      if (!who) return;
      const t = text.toLowerCase();
      const pick = (a) => a[Math.floor(Math.random() * a.length)];
      const mine = S.messagesOf(outingId).filter((m) => m.userId === S.meId).pop();
      let reply = null, extra = {};
      if (/where (are|r) (you|u|ya)|where you|where's everyone|where is everyone/.test(t)) {
        if (phase === 'during' && Math.random() < 0.5) {
          const v = S.placeOf(cur);
          extra = { kind: 'location', loc: { lat: v.lat + (Math.random() - 0.5) * 0.0012, lng: v.lng + (Math.random() - 0.5) * 0.0012, label: `Near ${v.name}`, until: HOP.now() + 30 * 6e4 } };
        } else reply = phase === 'during' ? pick([`Upstairs at ${S.stopName(cur)}`, `Out the front of ${S.stopName(cur)}`, 'At the bar, come find us']) : pick(['Not out yet, leaving at 7', 'Getting ready, 20 min', 'On the bus']);
      } else if (/late|running/.test(t)) reply = pick(['No stress', 'All good, we’ll be here', 'Classic']);
      else if (/heading|going to|omw|on my way/.test(t)) reply = pick([`See you at ${nx ? S.stopName(nx) : 'the next one'}`, 'We’ll grab a table', 'Get me a drink']);
      else if (t.includes('?')) reply = phase === 'during' ? pick(['Yep', '2 min', 'Ask Jack', 'I’m keen']) : pick(['Works for me', 'Down', 'Yep', 'Sounds good']);
      setTimeout(() => {
        if (mine) S.react(mine.id, pick(['up', 'fire', 'haha']), who);
        if (reply || extra.kind) setTimeout(() => S.postMessage(outingId, { text: reply, replyTo: reply && Math.random() < 0.4 && mine ? mine.id : null, ...extra }, who), 1800 + Math.random() * 2500);
      }, 2500 + Math.random() * 2500);
    },
    chatKeen(outingId) {
      const m = S.messagesOf(outingId).filter((x) => x.kind === 'place').pop();
      [0, 1, 2].slice(0, 1 + Math.floor(Math.random() * 3)).forEach((k) => setTimeout(() => { const u = HOP.sim.pickFriend(outingId); if (u && !(m.keen || []).includes(u)) S.keen(m.id, u); }, 3000 + k * 2600));
    },
    chatVotes(outingId, msgId) {
      const voters = S.going(outingId).map((a) => a.userId).filter((id) => id !== S.meId).sort(() => Math.random() - 0.5).slice(0, 7);
      voters.forEach((u, k) => setTimeout(() => { const m = S.state.messages.find((x) => x.id === msgId); if (m && !m.poll.closed) S.vote(msgId, Math.random() < 0.6 ? 0 : Math.floor(Math.random() * m.poll.options.length), u); }, 2500 + k * 1700 + Math.random() * 1200));
    },
    chatter(o) {
      const st = S.stopsOf(o.id), cur = st[o.live.current], nx = st[o.live.current + 1];
      const who = HOP.sim.pickFriend(o.id);
      if (!who) return;
      const lines = [`Who wants a drink? I’m at the bar`, `We’re upstairs`, `Grabbed a table near the back`, nx ? `What time are we heading to ${S.stopName(nx)}?` : 'Last stop, let’s go big', nx ? `Is the line long at ${S.stopName(nx)}?` : 'Kebab after?', 'Someone has my lighter', `Just got to ${S.stopName(cur)}, where are you?`, 'This DJ is going off', '@Ollie happy birthday!!'];
      const text = lines[Math.floor(Math.random() * lines.length)];
      if (text.includes('@Ollie') && o.id !== 'o_bday' && !o.title.includes('Birthday')) return;
      S.postMessage(o.id, { text }, who);
    },
    tick() {
      if (document.hidden || !HOP.sim.isLeader()) return;
      // a bit of chat on live outings you're on
      S.state.outings.filter((o) => o.status === 'live' && S.myAttendance(o.id)?.rsvp === 'going').forEach((o) => {
        const now = HOP.now();
        if (!chatAt[o.id]) chatAt[o.id] = now + 20000 + Math.random() * 15000;
        if (now >= chatAt[o.id]) { HOP.sim.chatter(o); chatAt[o.id] = now + 40000 + Math.random() * 40000; }
      });
      S.state.outings.filter((o) => o.status === 'live').forEach((o) => {
        const now = HOP.now();
        if (!nextAt[o.id]) nextAt[o.id] = Math.max(now + 2500 + Math.random() * 9000, o.live.startedAt + 5000);
        if (now >= nextAt[o.id]) {
          HOP.sim.friendPost(o.id);
          const mine = S.myAttendance(o.id)?.rsvp === 'going';
          nextAt[o.id] = now + (mine ? 16000 : 22000) + Math.random() * (mine ? 16000 : 26000);
        }
      });
    },
  };
  setInterval(HOP.sim.tick, 1000);

  // keep "Tonight · Friday 7:12 PM" and busy levels current
  setInterval(() => { if (route.name === 'home' && !HOP.app.searching) softRender(); mapRefresh(); }, 60000);

  // live clocks
  setInterval(() => {
    document.querySelectorAll('[data-clock]').forEach((el) => { const o = S.outing(el.dataset.clock); if (o && o.live) el.textContent = time(HOP.liveClock(o)); });
  }, 10000);

  // ---------------- boot ----------------
  const m = location.hash.match(/as=(u_\w+)/);
  if (m && S.userById[m[1]]) { S.setMe(m[1], true); history.replaceState(null, '', location.pathname + location.search); }

  document.getElementById('nav').innerHTML = `
    <button data-go="home">${I('map', 22)}<span>Map</span></button>
    <button data-go="outings">${I('list', 22)}<span>Outings</span></button>
    <button data-go="create" class="create" aria-label="New outing">${I('plus', 24)}</button>
    <button data-go="memories">${I('memories', 22)}<span>Memories</span></button>
    <button data-go="profile">${I('user', 22)}<span>Profile</span></button>`;
  const loc = document.createElement('button');
  loc.className = 'fbtn locate'; loc.dataset.act = 'locate'; loc.setAttribute('aria-label', 'Show where I am'); loc.innerHTML = I('locate');
  document.getElementById('app').appendChild(loc);
  const fab = document.createElement('button');
  fab.id = 'camfab'; fab.className = 'camfab'; fab.dataset.act = 'camera'; fab.hidden = true; fab.setAttribute('aria-label', 'Take a photo'); fab.innerHTML = I('camera', 28);
  document.getElementById('app').appendChild(fab);
  HOP.actions.locate = () => HOP.map.locate();

  // Activity layer: one toggle, one simple time control. Remembered per person.
  const layerBtn = document.createElement('button');
  layerBtn.className = 'fbtn layerbtn'; layerBtn.dataset.act = 'toggleHeat'; layerBtn.setAttribute('aria-label', 'Activity layer');
  layerBtn.innerHTML = `${I('waves', 20)}<span>Activity</span>`;
  const heatBar = document.createElement('div');
  heatBar.className = 'heatbar';
  document.getElementById('app').append(layerBtn, heatBar);
  function syncHeatUi() {
    const on = HOP.map.heatOn, w = HOP.map.heatWhen;
    layerBtn.classList.toggle('on', on);
    layerBtn.setAttribute('aria-pressed', on);
    heatBar.hidden = !on;
    let legend = true; try { legend = localStorage.getItem('hop.legend') !== '0'; } catch (e) {}
    const fc = w !== 'now';
    heatBar.innerHTML = `${legend ? `<div class="legend${fc ? ' fc' : ''}"><b>Activity</b><em>Quiet</em><i class="ramp"></i><em>Packed</em>${fc ? '<span>Forecast</span>' : ''}<button data-act="hideLegend" aria-label="Hide key">${I('close', 12)}</button></div>` : ''}<div class="seg" role="radiogroup" aria-label="When">${HOP.activity.WINDOWS.map(([k, l]) => `<button role="radio" aria-checked="${w === k}" class="${w === k ? 'on' : ''}" data-act="heatWhen" data-v="${k}">${l}</button>`).join('')}</div>`;
  }
  HOP.actions.hideLegend = () => { try { localStorage.setItem('hop.legend', '0'); } catch (e) {} syncHeatUi(); };
  HOP.actions.heatWhen = (d) => { HOP.map.setHeat(true, d.v); syncHeatUi(); if (route.name === 'home' || route.name === 'area') render({ keepScroll: true, sheetOnly: route.name === 'home' }); };

  HOP.map.init(document.getElementById('map'));
  HOP.map.onArea((id) => go('area', { id }, { replace: route.name === 'area' }));
  HOP.map.onVenue((id) => HOP.app.openVenue(id));
  HOP.map.onOuting((id) => HOP.actions.openOuting({ id }));
  HOP.map.onEvent((id) => go('event', { id }, { replace: route.name === 'event' }));
  HOP.map.onBlank(() => {
    if (route.name === 'venue' || route.name === 'event' || route.name === 'area') back();
    else if (HOP.app.searching) back();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !(e.target.id === 'q')) back(); });

  HOP.app = {
    go, back, render, syncHeatUi, picking: null, searching: false, albumOpen: null, albumEl: null,
    get route() { return route; },
    openVenue(id) { go('venue', { id }, { replace: route.name === 'venue' }); },
    startPicking(id, opts = {}) { HOP.app.picking = id; HOP.app.searching = false; go('pick', { id, fit: 1 }, opts); },
  };

  // first frame: home, framed around tonight's plan if there is one
  render({ fresh: true });
  // first frame: where you are, with the busy part of the inner city around you
  const first = S.myOutings().live[0];
  if (first) setTimeout(() => HOP.map.fitTo(S.stopsOf(first.id).map((s) => S.placeOf(s)), { instant: true }), 50);
  // glance view: the inner city at neighbourhood level, so the first two seconds answer
  // "where am I, who's out, what's on, where is it busy"
  else setTimeout(() => HOP.map.focus({ lat: -33.8795, lng: 151.2060 }, 13.4), 50);
  syncHeatUi();
  window.addEventListener('load', () => HOP.map.invalidate());
})();

</script>
</body>
</html>
