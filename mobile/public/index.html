<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%" style="background-color:#0d0e11">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: draw under the notch and home bar; safe-area insets keep content clear -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="See where the city is alive, plan nights with friends, and keep the night as a shared memory." />
    <meta name="theme-color" content="#0d0e11" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HOP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- iPhone launch screens (portrait) -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1320x2868.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1206x2622.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1290x2796.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1179x2556.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1284x2778.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1170x2532.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1125x2436.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" href="/splash/1242x2688.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/splash/828x1792.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/splash/750x1334.png" />

    <!-- Link previews (iMessage, WhatsApp, Messenger). %APP_URL% is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOP" />
    <meta property="og:title" content="HOP · Early access" />
    <meta property="og:description" content="See where the city is alive. Plan nights with friends. Keep the night as a shared memory." />
    <meta property="og:image" content="%APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- HOP's type: Latin subsets, preloaded so the first frame isn't in a fallback font -->
    <link rel="preload" href="/fonts/Archivo_800ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstrumentSans_400Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstrumentSans_600SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/InstrumentSans_700Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Map tiles and photos: connect early -->
    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <style id="expo-reset">
      @font-face { font-family: "Archivo_800ExtraBold"; src: url("/fonts/Archivo_800ExtraBold.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "Archivo_900Black"; src: url("/fonts/Archivo_900Black.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "InstrumentSans_400Regular"; src: url("/fonts/InstrumentSans_400Regular.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "InstrumentSans_500Medium"; src: url("/fonts/InstrumentSans_500Medium.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "InstrumentSans_600SemiBold"; src: url("/fonts/InstrumentSans_600SemiBold.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "InstrumentSans_700Bold"; src: url("/fonts/InstrumentSans_700Bold.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "IBMPlexMono_500Medium"; src: url("/fonts/IBMPlexMono_500Medium.woff2") format("woff2"); font-display: swap; }
      @font-face { font-family: "IBMPlexMono_600SemiBold"; src: url("/fonts/IBMPlexMono_600SemiBold.woff2") format("woff2"); font-display: swap; }
      html, body { height: 100%; margin: 0; background-color: #0d0e11; color: #f3f0ea; }
      body {
        overflow: hidden;
        overscroll-behavior: none;              /* no pull-to-refresh / rubber-banding over the map */
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea { -webkit-user-select: text; user-select: text; font-size: 16px; }
      #root { display: flex; height: 100%; flex: 1; }
      /* iOS Safari: the visible height, not the height behind the toolbars */
      @supports (height: 100dvh) { html, body, #root { height: 100dvh; } }

      /* Shown until the app's first paint, so nobody stares at a blank page on a slow network */
      #hop-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0e11; z-index: 100; transition: opacity .25s; }
      #hop-boot img { width: 120px; height: 40px; }
      #hop-boot .bar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 64px); width: 96px; height: 3px; margin-left: -48px; border-radius: 2px; background: #272b33; overflow: hidden; }
      #hop-boot .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: #ffad1f; animation: hopb 1.1s ease-in-out infinite; }
      @keyframes hopb { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      #hop-boot.done { opacity: 0; pointer-events: none; }
    </style>
  </head>

  <body>
    <noscript>HOP needs JavaScript to run.</noscript>
    <div id="root"></div>
    <div id="hop-boot" aria-hidden="true">
      <img src="/icons/wordmark.png" alt="" width="120" height="40" />
      <div class="bar"></div>
    </div>
  </body>
</html>
